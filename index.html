<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة القرآن — لعبة تفاعلية للأطفال</title>
<style>
:root{
  --bg1:#070b1f; --bg2:#141a3d; --bg3:#251a45;
  --gold:#ffd67e; --gold2:#f5b942; --ink:#f3f0ff;
  --muted:#a6a3c9; --ok:#3ddc97; --bad:#ff6b81;
  --card:rgba(255,255,255,.07); --line:rgba(255,214,126,.28);
  --ui:'Tajawal','Segoe UI','Noto Kufi Arabic','Cairo',system-ui,sans-serif;
  --quran:'Amiri Quran','Amiri','Scheherazade New','Traditional Arabic','Noto Naskh Arabic',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:var(--ui); color:var(--ink); background:var(--bg1);
  background-image:
    radial-gradient(1200px 700px at 80% -10%, #3a2a6b 0%, transparent 60%),
    radial-gradient(900px 600px at 10% 110%, #14325c 0%, transparent 55%),
    linear-gradient(170deg, var(--bg1), var(--bg2) 55%, var(--bg3));
  background-attachment:fixed;
  min-height:100vh; overflow-x:hidden;
}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;opacity:.7;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.95;transform:scale(1.15)}}
#app{position:relative;z-index:1;max-width:920px;margin:0 auto;padding:16px 14px 60px}

h1,h2,h3{margin:0 0 .4em}
h1{font-size:clamp(1.7rem,6vw,2.8rem);letter-spacing:.5px}
h2{font-size:clamp(1.25rem,4.5vw,1.7rem)}
p{line-height:1.9;margin:.4em 0}
.muted{color:var(--muted)}
.center{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;
  backdrop-filter:blur(8px);box-shadow:0 12px 40px rgba(0,0,0,.35);margin-bottom:14px}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pop{animation:pop .3s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.shake{animation:sh .4s}
@keyframes sh{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

button{font-family:inherit;font-size:1rem;cursor:pointer;border:0;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(180deg,var(--gold),var(--gold2));color:#2a1d00;
  font-weight:700;padding:14px 26px;border-radius:16px;
  box-shadow:0 6px 0 #a97a17, 0 12px 24px rgba(0,0,0,.35);transition:.12s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a97a17}
.btn.ghost{background:transparent;color:var(--gold);border:2px solid var(--line);box-shadow:none;font-weight:600}
.btn.ghost:active{transform:translateY(2px)}
.btn.sm{padding:9px 16px;font-size:.9rem;border-radius:12px;box-shadow:0 4px 0 #a97a17}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.opt{display:block;width:100%;text-align:right;background:rgba(255,255,255,.06);
  border:2px solid rgba(255,255,255,.14);border-radius:16px;padding:15px 18px;margin-bottom:10px;
  font-size:1.05rem;line-height:1.7;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--gold);background:rgba(255,214,126,.12)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:rgba(61,220,151,.18)}
.opt.bad{border-color:var(--bad);background:rgba(255,107,129,.18)}
.opt .tag{float:left;font-weight:800}

.ayah{font-family:var(--quran);font-size:clamp(1.4rem,5.2vw,2rem);line-height:2.5;
  color:#ffeec2;text-align:center;padding:6px 4px}
.ayah .num{display:inline-block;font-family:var(--ui);font-size:.75rem;color:var(--gold);
  border:1px solid var(--line);border-radius:50%;width:26px;height:26px;line-height:24px;
  text-align:center;margin:0 6px;vertical-align:middle}
.src{text-align:center;color:var(--gold);font-size:.82rem;opacity:.85;margin-top:-4px}
.blankbox{display:inline-block;min-width:110px;border-bottom:3px dashed var(--gold);
  color:var(--gold);font-family:var(--quran)}
.blankbox.filled{border-bottom-style:solid;color:#fff}

.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;font-size:.88rem;font-weight:700;white-space:nowrap}
.pill.turn{background:linear-gradient(90deg,rgba(255,214,126,.25),rgba(255,214,126,.05));color:var(--gold)}
.bar{height:9px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;margin:10px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));
  border-radius:99px;transition:width .4s}
.timer{height:6px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.timer>i{display:block;height:100%;background:var(--ok);transition:width 1s linear}
.timer.low>i{background:var(--bad)}

.grid{display:grid;gap:12px}
.stages{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.surahs{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px}
.surahs .stage{padding:11px 6px;border-radius:14px}
.surahs .stage .st{font-size:.9rem;letter-spacing:1px}
.qbox{max-height:44vh;overflow-y:auto;border:1px solid var(--line);border-radius:16px;padding:8px 4px;
  background:rgba(0,0,0,.18)}
.qbox .ayah{font-size:clamp(1.25rem,4.4vw,1.6rem);line-height:2.2;margin:0}
.stage{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 12px;
  text-align:center;transition:.15s;cursor:pointer}
.stage:hover{transform:translateY(-4px);border-color:var(--gold)}
.stage.locked{opacity:.42;cursor:not-allowed;filter:grayscale(.6)}
.stage .em{font-size:2.3rem;display:block;margin-bottom:6px}
.stage .st{color:var(--gold);letter-spacing:2px;font-size:1.05rem}

.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);border-radius:14px;
  padding:13px 10px;text-align:center;font-size:.98rem;line-height:1.6;transition:.15s}
.pair.q{font-family:var(--quran);font-size:1.35rem;color:#ffeec2}
.pair.sel{border-color:var(--gold);background:rgba(255,214,126,.16)}
.pair.done{border-color:var(--ok);background:rgba(61,220,151,.16);opacity:.65;cursor:default}
.pair.err{border-color:var(--bad)}

.slots{min-height:60px;border:2px dashed var(--line);border-radius:16px;padding:10px;margin-bottom:12px}
.slot{background:rgba(255,214,126,.14);border:1px solid var(--line);border-radius:12px;
  padding:8px 12px;margin:5px 0;font-family:var(--quran);font-size:1.2rem;color:#ffeec2;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.slot .rm{font-family:var(--ui);font-size:.8rem;color:var(--bad);cursor:pointer;font-weight:700}

.fb{border-radius:16px;padding:14px 16px;margin-top:12px;line-height:1.9;font-size:.98rem}
.fb.ok{background:rgba(61,220,151,.14);border:1px solid var(--ok)}
.fb.bad{background:rgba(255,107,129,.14);border:1px solid var(--bad)}
.fb b{color:var(--gold)}

.moon{width:120px;height:120px;margin:6px auto 14px;position:relative}
.moon i{position:absolute;top:0;width:60px;height:120px;background:
  radial-gradient(circle at 40% 35%, #fff8e2, #ffd67e 60%, #d9a13c);
  box-shadow:0 0 45px rgba(255,214,126,.55)}
.moon i.l{right:0;border-radius:120px 0 0 120px;animation:sl 4s infinite ease-in-out}
.moon i.r{left:0;border-radius:0 120px 120px 0;animation:sr 4s infinite ease-in-out}
@keyframes sl{0%,45%,100%{transform:translateX(0) rotate(0)}70%{transform:translateX(22px) rotate(9deg)}}
@keyframes sr{0%,45%,100%{transform:translateX(0) rotate(0)}70%{transform:translateX(-22px) rotate(-9deg)}}

table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.1);text-align:right;font-size:.95rem}
th{color:var(--gold);font-size:.85rem}
input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:2px solid rgba(255,255,255,.16);
  background:rgba(0,0,0,.25);color:#fff;font-family:inherit;font-size:1rem;margin-bottom:8px}
input[type=text]:focus{outline:none;border-color:var(--gold)}
select{padding:12px 14px;border-radius:12px;border:2px solid rgba(255,255,255,.16);
  background:#141a3d;color:#fff;font-family:inherit;font-size:1rem}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
  background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.9rem}
code{background:rgba(0,0,0,.35);padding:2px 6px;border-radius:6px;font-size:.85em;direction:ltr;display:inline-block}
pre{background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:14px;padding:14px;
  overflow-x:auto;direction:ltr;text-align:left;font-size:.8rem;line-height:1.6}
.confetti{position:fixed;top:-10px;width:10px;height:16px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
@media(max-width:520px){ .pairs{grid-template-columns:1fr} .btn{padding:13px 20px} }
</style>
</head>
<body>
<div id="stars"></div>
<div id="app"></div>

<script>
/* ==========================================================================
   رحلة القرآن — محرك لعبة تفاعلية
   --------------------------------------------------------------------------
   لإضافة سورة جديدة: انسخ بلوك سورة كامل داخل مصفوفة SURAHS وعدّل بياناته.

   شكل السورة:
   {
     id:'مُعرّف-فريد', name:'اسم السورة', number:54, place:'مكية', ayahCount:55,
     tagline:'سطر تعريفي', intro:'فقرة تمهيدية',
     ayat:[ {n:1,t:'نص الآية بالرسم العثماني'}, ... ],   // النص كامل بالترتيب
     stages:[
       { title:'اسم المرحلة', emoji:'🌙', range:[1,8],
         story:['فقرة قصة','فقرة قصة'],
         challenges:[ ...تحديات... ] }
     ]
   }

   أنواع التحديات (challenges):
   1) اختيار من متعدد:
      {type:'mcq', q:'السؤال', options:['أ','ب','ج','د'], answer:0,
       explain:'الشرح بعد الإجابة', ayah:2}          // ayah اختياري: يعرض الآية
   2) صح أم خطأ:
      {type:'tf', q:'العبارة', answer:true, explain:'...', ayah:7}
   3) الكلمة الناقصة (تُؤخذ من نص الآية نفسه — لا تُكتب يدويًا):
      {type:'blank', ayah:11, idx:4, options:['بديل1','بديل2','بديل3'], explain:'...'}
      idx = ترتيب الكلمة داخل الآية بدءًا من 0 (افصل الآية بالمسافات لتعدّها)
   4) ترتيب الآيات:
      {type:'order', ayat:[10,11,12,13], explain:'...'}
   5) توصيل كلمة بمعناها:
      {type:'match', pairs:[['الكلمة','المعنى'],['الكلمة','المعنى']], explain:'...'}
   6) قرار في القصة (تربوي — كل إجابة لها رد):
      {type:'choice', q:'الموقف', options:[{t:'الاختيار', ok:true, fb:'الرد'}, ...]}
   ========================================================================== */

const SURAHS = [
{
  id:'al-qamar',
  name:'سورة القمر',
  number:54,
  place:'مكية',
  ayahCount:55,
  tagline:'المعجزة والعِبرة — خمسة أقوام وقصة واحدة',
  intro:'سورة القمر سورة مكية، فيها معجزة انشقاق القمر، ثم خمس قصص لأقوام كذّبوا رسلهم، وتتكرر فيها آية واحدة أربع مرات كأنها نداء متكرر: «وَلَقَدْ يَسَّرْنَا ٱلْقُرْءَانَ لِلذِّكْرِ فَهَلْ مِن مُّدَّكِرٍۢ». رحلتك: 6 مراحل، اجمع النجوم وكن من «المُدَّكِرين»!',
  ayat: [
    {n:1,t:"ٱقْتَرَبَتِ ٱلسَّاعَةُ وَٱنشَقَّ ٱلْقَمَرُ"},
    {n:2,t:"وَإِن يَرَوْا۟ ءَايَةًۭ يُعْرِضُوا۟ وَيَقُولُوا۟ سِحْرٌۭ مُّسْتَمِرٌّۭ"},
    {n:3,t:"وَكَذَّبُوا۟ وَٱتَّبَعُوٓا۟ أَهْوَآءَهُمْ ۚ وَكُلُّ أَمْرٍۢ مُّسْتَقِرٌّۭ"},
    {n:4,t:"وَلَقَدْ جَآءَهُم مِّنَ ٱلْأَنۢبَآءِ مَا فِيهِ مُزْدَجَرٌ"},
    {n:5,t:"حِكْمَةٌۢ بَٰلِغَةٌۭ ۖ فَمَا تُغْنِ ٱلنُّذُرُ"},
    {n:6,t:"فَتَوَلَّ عَنْهُمْ ۘ يَوْمَ يَدْعُ ٱلدَّاعِ إِلَىٰ شَىْءٍۢ نُّكُرٍ"},
    {n:7,t:"خُشَّعًا أَبْصَٰرُهُمْ يَخْرُجُونَ مِنَ ٱلْأَجْدَاثِ كَأَنَّهُمْ جَرَادٌۭ مُّنتَشِرٌۭ"},
    {n:8,t:"مُّهْطِعِينَ إِلَى ٱلدَّاعِ ۖ يَقُولُ ٱلْكَٰفِرُونَ هَٰذَا يَوْمٌ عَسِرٌۭ"},
    {n:9,t:"۞ كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍۢ فَكَذَّبُوا۟ عَبْدَنَا وَقَالُوا۟ مَجْنُونٌۭ وَٱزْدُجِرَ"},
    {n:10,t:"فَدَعَا رَبَّهُۥٓ أَنِّى مَغْلُوبٌۭ فَٱنتَصِرْ"},
    {n:11,t:"فَفَتَحْنَآ أَبْوَٰبَ ٱلسَّمَآءِ بِمَآءٍۢ مُّنْهَمِرٍۢ"},
    {n:12,t:"وَفَجَّرْنَا ٱلْأَرْضَ عُيُونًۭا فَٱلْتَقَى ٱلْمَآءُ عَلَىٰٓ أَمْرٍۢ قَدْ قُدِرَ"},
    {n:13,t:"وَحَمَلْنَٰهُ عَلَىٰ ذَاتِ أَلْوَٰحٍۢ وَدُسُرٍۢ"},
    {n:14,t:"تَجْرِى بِأَعْيُنِنَا جَزَآءًۭ لِّمَن كَانَ كُفِرَ"},
    {n:15,t:"وَلَقَد تَّرَكْنَٰهَآ ءَايَةًۭ فَهَلْ مِن مُّدَّكِرٍۢ"},
    {n:16,t:"فَكَيْفَ كَانَ عَذَابِى وَنُذُرِ"},
    {n:17,t:"وَلَقَدْ يَسَّرْنَا ٱلْقُرْءَانَ لِلذِّكْرِ فَهَلْ مِن مُّدَّكِرٍۢ"},
    {n:18,t:"كَذَّبَتْ عَادٌۭ فَكَيْفَ كَانَ عَذَابِى وَنُذُرِ"},
    {n:19,t:"إِنَّآ أَرْسَلْنَا عَلَيْهِمْ رِيحًۭا صَرْصَرًۭا فِى يَوْمِ نَحْسٍۢ مُّسْتَمِرٍّۢ"},
    {n:20,t:"تَنزِعُ ٱلنَّاسَ كَأَنَّهُمْ أَعْجَازُ نَخْلٍۢ مُّنقَعِرٍۢ"},
    {n:21,t:"فَكَيْفَ كَانَ عَذَابِى وَنُذُرِ"},
    {n:22,t:"وَلَقَدْ يَسَّرْنَا ٱلْقُرْءَانَ لِلذِّكْرِ فَهَلْ مِن مُّدَّكِرٍۢ"},
    {n:23,t:"كَذَّبَتْ ثَمُودُ بِٱلنُّذُرِ"},
    {n:24,t:"فَقَالُوٓا۟ أَبَشَرًۭا مِّنَّا وَٰحِدًۭا نَّتَّبِعُهُۥٓ إِنَّآ إِذًۭا لَّفِى ضَلَٰلٍۢ وَسُعُرٍ"},
    {n:25,t:"أَءُلْقِىَ ٱلذِّكْرُ عَلَيْهِ مِنۢ بَيْنِنَا بَلْ هُوَ كَذَّابٌ أَشِرٌۭ"},
    {n:26,t:"سَيَعْلَمُونَ غَدًۭا مَّنِ ٱلْكَذَّابُ ٱلْأَشِرُ"},
    {n:27,t:"إِنَّا مُرْسِلُوا۟ ٱلنَّاقَةِ فِتْنَةًۭ لَّهُمْ فَٱرْتَقِبْهُمْ وَٱصْطَبِرْ"},
    {n:28,t:"وَنَبِّئْهُمْ أَنَّ ٱلْمَآءَ قِسْمَةٌۢ بَيْنَهُمْ ۖ كُلُّ شِرْبٍۢ مُّحْتَضَرٌۭ"},
    {n:29,t:"فَنَادَوْا۟ صَاحِبَهُمْ فَتَعَاطَىٰ فَعَقَرَ"},
    {n:30,t:"فَكَيْفَ كَانَ عَذَابِى وَنُذُرِ"},
    {n:31,t:"إِنَّآ أَرْسَلْنَا عَلَيْهِمْ صَيْحَةًۭ وَٰحِدَةًۭ فَكَانُوا۟ كَهَشِيمِ ٱلْمُحْتَظِرِ"},
    {n:32,t:"وَلَقَدْ يَسَّرْنَا ٱلْقُرْءَانَ لِلذِّكْرِ فَهَلْ مِن مُّدَّكِرٍۢ"},
    {n:33,t:"كَذَّبَتْ قَوْمُ لُوطٍۭ بِٱلنُّذُرِ"},
    {n:34,t:"إِنَّآ أَرْسَلْنَا عَلَيْهِمْ حَاصِبًا إِلَّآ ءَالَ لُوطٍۢ ۖ نَّجَّيْنَٰهُم بِسَحَرٍۢ"},
    {n:35,t:"نِّعْمَةًۭ مِّنْ عِندِنَا ۚ كَذَٰلِكَ نَجْزِى مَن شَكَرَ"},
    {n:36,t:"وَلَقَدْ أَنذَرَهُم بَطْشَتَنَا فَتَمَارَوْا۟ بِٱلنُّذُرِ"},
    {n:37,t:"وَلَقَدْ رَٰوَدُوهُ عَن ضَيْفِهِۦ فَطَمَسْنَآ أَعْيُنَهُمْ فَذُوقُوا۟ عَذَابِى وَنُذُرِ"},
    {n:38,t:"وَلَقَدْ صَبَّحَهُم بُكْرَةً عَذَابٌۭ مُّسْتَقِرٌّۭ"},

      {n:78011,s:"النبإ",a:11,t:"وَجَعَلْنَا ٱلنَّهَارَ مَعَاشًۭا"},
      {n:78012,s:"النبإ",a:12,t:"وَبَنَيْنَا فَوْقَكُمْ سَبْعًۭا شِدَادًۭا"},
      {n:78013,s:"النبإ",a:13,t:"وَجَعَلْنَا سِرَاجًۭا وَهَّاجًۭا"},
      {n:78014,s:"النبإ",a:14,t:"وَأَنزَلْنَا مِنَ ٱلْمُعْصِرَٰتِ مَآءًۭ ثَجَّاجًۭا"},
      {n:78015,s:"النبإ",a:15,t:"لِّنُخْرِجَ بِهِۦ حَبًّۭا وَنَبَاتًۭا"},
      {n:78016,s:"النبإ",a:16,t:"وَجَنَّٰتٍ أَلْفَافًا"},
      {n:78017,s:"النبإ",a:17,t:"إِنَّ يَوْمَ ٱلْفَصْلِ كَانَ مِيقَٰتًۭا"},
      {n:78018,s:"النبإ",a:18,t:"يَوْمَ يُنفَخُ فِى ٱلصُّورِ فَتَأْتُونَ أَفْوَاجًۭا"},
      {n:78019,s:"النبإ",a:19,t:"وَفُتِحَتِ ٱلسَّمَآءُ فَكَانَتْ أَبْوَٰبًۭا"},
      {n:78020,s:"النبإ",a:20,t:"وَسُيِّرَتِ ٱلْجِبَالُ فَكَانَتْ سَرَابًا"},
      {n:78021,s:"النبإ",a:21,t:"إِنَّ جَهَنَّمَ كَانَتْ مِرْصَادًۭا"},
      {n:78022,s:"النبإ",a:22,t:"لِّلطَّٰغِينَ مَـَٔابًۭا"},
      {n:78023,s:"النبإ",a:23,t:"لَّٰبِثِينَ فِيهَآ أَحْقَابًۭا"},
      {n:78024,s:"النبإ",a:24,t:"لَّا يَذُوقُونَ فِيهَا بَرْدًۭا وَلَا شَرَابًا"},
      {n:78025,s:"النبإ",a:25,t:"إِلَّا حَمِيمًۭا وَغَسَّاقًۭا"},
      {n:78026,s:"النبإ",a:26,t:"جَزَآءًۭ وِفَاقًا"},
      {n:78027,s:"النبإ",a:27,t:"إِنَّهُمْ كَانُوا۟ لَا يَرْجُونَ حِسَابًۭا"},
      {n:78028,s:"النبإ",a:28,t:"وَكَذَّبُوا۟ بِـَٔايَٰتِنَا كِذَّابًۭا"},
      {n:78029,s:"النبإ",a:29,t:"وَكُلَّ شَىْءٍ أَحْصَيْنَٰهُ كِتَٰبًۭا"},
      {n:78030,s:"النبإ",a:30,t:"فَذُوقُوا۟ فَلَن نَّزِيدَكُمْ إِلَّا عَذَابًا"},
      {n:78031,s:"النبإ",a:31,t:"إِنَّ لِلْمُتَّقِينَ مَفَازًا"},
      {n:78032,s:"النبإ",a:32,t:"حَدَآئِقَ وَأَعْنَٰبًۭا"},
      {n:78033,s:"النبإ",a:33,t:"وَكَوَاعِبَ أَتْرَابًۭا"},
      {n:78034,s:"النبإ",a:34,t:"وَكَأْسًۭا دِهَاقًۭا"},
      {n:78035,s:"النبإ",a:35,t:"لَّا يَسْمَعُونَ فِيهَا لَغْوًۭا وَلَا كِذَّٰبًۭا"},
      {n:78036,s:"النبإ",a:36,t:"جَزَآءًۭ مِّن رَّبِّكَ عَطَآءً حِسَابًۭا"},
      {n:78037,s:"النبإ",a:37,t:"رَّبِّ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَمَا بَيْنَهُمَا ٱلرَّحْمَٰنِ ۖ لَا يَمْلِكُونَ مِنْهُ خِطَابًۭا"},
      {n:78038,s:"النبإ",a:38,t:"يَوْمَ يَقُومُ ٱلرُّوحُ وَٱلْمَلَٰٓئِكَةُ صَفًّۭا ۖ لَّا يَتَكَلَّمُونَ إِلَّا مَنْ أَذِنَ لَهُ ٱلرَّحْمَٰنُ وَقَالَ صَوَابًۭا"},
      {n:78039,s:"النبإ",a:39,t:"ذَٰلِكَ ٱلْيَوْمُ ٱلْحَقُّ ۖ فَمَن شَآءَ ٱتَّخَذَ إِلَىٰ رَبِّهِۦ مَـَٔابًا"},
      {n:78040,s:"النبإ",a:40,t:"إِنَّآ أَنذَرْنَٰكُمْ عَذَابًۭا قَرِيبًۭا يَوْمَ يَنظُرُ ٱلْمَرْءُ مَا قَدَّمَتْ يَدَاهُ وَيَقُولُ ٱلْكَافِرُ يَٰلَيْتَنِى كُنتُ تُرَٰبًۢا"},
      {n:79001,s:"النازعات",a:1,t:"وَٱلنَّٰزِعَٰتِ غَرْقًۭا"},
      {n:79002,s:"النازعات",a:2,t:"وَٱلنَّٰشِطَٰتِ نَشْطًۭا"},
      {n:79003,s:"النازعات",a:3,t:"وَٱلسَّٰبِحَٰتِ سَبْحًۭا"},
      {n:79004,s:"النازعات",a:4,t:"فَٱلسَّٰبِقَٰتِ سَبْقًۭا"},
      {n:79005,s:"النازعات",a:5,t:"فَٱلْمُدَبِّرَٰتِ أَمْرًۭا"},
      {n:79006,s:"النازعات",a:6,t:"يَوْمَ تَرْجُفُ ٱلرَّاجِفَةُ"},
      {n:79007,s:"النازعات",a:7,t:"تَتْبَعُهَا ٱلرَّادِفَةُ"},
      {n:79008,s:"النازعات",a:8,t:"قُلُوبٌۭ يَوْمَئِذٍۢ وَاجِفَةٌ"},
      {n:79009,s:"النازعات",a:9,t:"أَبْصَٰرُهَا خَٰشِعَةٌۭ"},
      {n:79010,s:"النازعات",a:10,t:"يَقُولُونَ أَءِنَّا لَمَرْدُودُونَ فِى ٱلْحَافِرَةِ"},
      {n:79011,s:"النازعات",a:11,t:"أَءِذَا كُنَّا عِظَٰمًۭا نَّخِرَةًۭ"},
      {n:79012,s:"النازعات",a:12,t:"قَالُوا۟ تِلْكَ إِذًۭا كَرَّةٌ خَاسِرَةٌۭ"},
      {n:79013,s:"النازعات",a:13,t:"فَإِنَّمَا هِىَ زَجْرَةٌۭ وَٰحِدَةٌۭ"},
      {n:79014,s:"النازعات",a:14,t:"فَإِذَا هُم بِٱلسَّاهِرَةِ"},
      {n:79015,s:"النازعات",a:15,t:"هَلْ أَتَىٰكَ حَدِيثُ مُوسَىٰٓ"},
      {n:79016,s:"النازعات",a:16,t:"إِذْ نَادَىٰهُ رَبُّهُۥ بِٱلْوَادِ ٱلْمُقَدَّسِ طُوًى"},
      {n:79017,s:"النازعات",a:17,t:"ٱذْهَبْ إِلَىٰ فِرْعَوْنَ إِنَّهُۥ طَغَىٰ"},
      {n:79018,s:"النازعات",a:18,t:"فَقُلْ هَل لَّكَ إِلَىٰٓ أَن تَزَكَّىٰ"},
      {n:79019,s:"النازعات",a:19,t:"وَأَهْدِيَكَ إِلَىٰ رَبِّكَ فَتَخْشَىٰ"},
      {n:79020,s:"النازعات",a:20,t:"فَأَرَىٰهُ ٱلْءَايَةَ ٱلْكُبْرَىٰ"},
      {n:79021,s:"النازعات",a:21,t:"فَكَذَّبَ وَعَصَىٰ"},
      {n:79022,s:"النازعات",a:22,t:"ثُمَّ أَدْبَرَ يَسْعَىٰ"},
      {n:79023,s:"النازعات",a:23,t:"فَحَشَرَ فَنَادَىٰ"},
      {n:79024,s:"النازعات",a:24,t:"فَقَالَ أَنَا۠ رَبُّكُمُ ٱلْأَعْلَىٰ"},
      {n:79025,s:"النازعات",a:25,t:"فَأَخَذَهُ ٱللَّهُ نَكَالَ ٱلْءَاخِرَةِ وَٱلْأُولَىٰٓ"},
      {n:79026,s:"النازعات",a:26,t:"إِنَّ فِى ذَٰلِكَ لَعِبْرَةًۭ لِّمَن يَخْشَىٰٓ"},
      {n:79027,s:"النازعات",a:27,t:"ءَأَنتُمْ أَشَدُّ خَلْقًا أَمِ ٱلسَّمَآءُ ۚ بَنَىٰهَا"},
      {n:79028,s:"النازعات",a:28,t:"رَفَعَ سَمْكَهَا فَسَوَّىٰهَا"},
      {n:79029,s:"النازعات",a:29,t:"وَأَغْطَشَ لَيْلَهَا وَأَخْرَجَ ضُحَىٰهَا"},
      {n:79030,s:"النازعات",a:30,t:"وَٱلْأَرْضَ بَعْدَ ذَٰلِكَ دَحَىٰهَآ"},
      {n:79031,s:"النازعات",a:31,t:"أَخْرَجَ مِنْهَا مَآءَهَا وَمَرْعَىٰهَا"},
      {n:79032,s:"النازعات",a:32,t:"وَٱلْجِبَالَ أَرْسَىٰهَا"},
      {n:79033,s:"النازعات",a:33,t:"مَتَٰعًۭا لَّكُمْ وَلِأَنْعَٰمِكُمْ"},
      {n:79034,s:"النازعات",a:34,t:"فَإِذَا جَآءَتِ ٱلطَّآمَّةُ ٱلْكُبْرَىٰ"},
      {n:79035,s:"النازعات",a:35,t:"يَوْمَ يَتَذَكَّرُ ٱلْإِنسَٰنُ مَا سَعَىٰ"},
      {n:79036,s:"النازعات",a:36,t:"وَبُرِّزَتِ ٱلْجَحِيمُ لِمَن يَرَىٰ"},
      {n:79037,s:"النازعات",a:37,t:"فَأَمَّا مَن طَغَىٰ"},
      {n:79038,s:"النازعات",a:38,t:"وَءَاثَرَ ٱلْحَيَوٰةَ ٱلدُّنْيَا"},
      {n:79039,s:"النازعات",a:39,t:"فَإِنَّ ٱلْجَحِيمَ هِىَ ٱلْمَأْوَىٰ"},
      {n:79040,s:"النازعات",a:40,t:"وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى ٱلنَّفْسَ عَنِ ٱلْهَوَىٰ"},
      {n:79041,s:"النازعات",a:41,t:"فَإِنَّ ٱلْجَنَّةَ هِىَ ٱلْمَأْوَىٰ"},
      {n:79042,s:"النازعات",a:42,t:"يَسْـَٔلُونَكَ عَنِ ٱلسَّاعَةِ أَيَّانَ مُرْسَىٰهَا"},
      {n:79043,s:"النازعات",a:43,t:"فِيمَ أَنتَ مِن ذِكْرَىٰهَآ"},
      {n:79044,s:"النازعات",a:44,t:"إِلَىٰ رَبِّكَ مُنتَهَىٰهَآ"},
      {n:79045,s:"النازعات",a:45,t:"إِنَّمَآ أَنتَ مُنذِرُ مَن يَخْشَىٰهَا"},
      {n:79046,s:"النازعات",a:46,t:"كَأَنَّهُمْ يَوْمَ يَرَوْنَهَا لَمْ يَلْبَثُوٓا۟ إِلَّا عَشِيَّةً أَوْ ضُحَىٰهَا"},
      {n:80001,s:"عبس",a:1,t:"عَبَسَ وَتَوَلَّىٰٓ"},
      {n:80002,s:"عبس",a:2,t:"أَن جَآءَهُ ٱلْأَعْمَىٰ"},
      {n:80003,s:"عبس",a:3,t:"وَمَا يُدْرِيكَ لَعَلَّهُۥ يَزَّكَّىٰٓ"},
      {n:80004,s:"عبس",a:4,t:"أَوْ يَذَّكَّرُ فَتَنفَعَهُ ٱلذِّكْرَىٰٓ"},
      {n:80005,s:"عبس",a:5,t:"أَمَّا مَنِ ٱسْتَغْنَىٰ"},
      {n:80006,s:"عبس",a:6,t:"فَأَنتَ لَهُۥ تَصَدَّىٰ"},
      {n:80007,s:"عبس",a:7,t:"وَمَا عَلَيْكَ أَلَّا يَزَّكَّىٰ"},
      {n:80008,s:"عبس",a:8,t:"وَأَمَّا مَن جَآءَكَ يَسْعَىٰ"},
      {n:80009,s:"عبس",a:9,t:"وَهُوَ يَخْشَىٰ"},
      {n:80010,s:"عبس",a:10,t:"فَأَنتَ عَنْهُ تَلَهَّىٰ"},
      {n:80011,s:"عبس",a:11,t:"كَلَّآ إِنَّهَا تَذْكِرَةٌۭ"},
      {n:80012,s:"عبس",a:12,t:"فَمَن شَآءَ ذَكَرَهُۥ"},
      {n:80013,s:"عبس",a:13,t:"فِى صُحُفٍۢ مُّكَرَّمَةٍۢ"},
      {n:80014,s:"عبس",a:14,t:"مَّرْفُوعَةٍۢ مُّطَهَّرَةٍۭ"},
      {n:80015,s:"عبس",a:15,t:"بِأَيْدِى سَفَرَةٍۢ"},
      {n:80016,s:"عبس",a:16,t:"كِرَامٍۭ بَرَرَةٍۢ"},
      {n:80017,s:"عبس",a:17,t:"قُتِلَ ٱلْإِنسَٰنُ مَآ أَكْفَرَهُۥ"},
      {n:80018,s:"عبس",a:18,t:"مِنْ أَىِّ شَىْءٍ خَلَقَهُۥ"},
      {n:80019,s:"عبس",a:19,t:"مِن نُّطْفَةٍ خَلَقَهُۥ فَقَدَّرَهُۥ"},
      {n:80020,s:"عبس",a:20,t:"ثُمَّ ٱلسَّبِيلَ يَسَّرَهُۥ"},
      {n:80021,s:"عبس",a:21,t:"ثُمَّ أَمَاتَهُۥ فَأَقْبَرَهُۥ"},
      {n:80022,s:"عبس",a:22,t:"ثُمَّ إِذَا شَآءَ أَنشَرَهُۥ"},
      {n:80023,s:"عبس",a:23,t:"كَلَّا لَمَّا يَقْضِ مَآ أَمَرَهُۥ"},
      {n:80024,s:"عبس",a:24,t:"فَلْيَنظُرِ ٱلْإِنسَٰنُ إِلَىٰ طَعَامِهِۦٓ"},
      {n:80025,s:"عبس",a:25,t:"أَنَّا صَبَبْنَا ٱلْمَآءَ صَبًّۭا"},
      {n:80026,s:"عبس",a:26,t:"ثُمَّ شَقَقْنَا ٱلْأَرْضَ شَقًّۭا"},
      {n:80027,s:"عبس",a:27,t:"فَأَنۢبَتْنَا فِيهَا حَبًّۭا"},
      {n:80028,s:"عبس",a:28,t:"وَعِنَبًۭا وَقَضْبًۭا"},
      {n:80029,s:"عبس",a:29,t:"وَزَيْتُونًۭا وَنَخْلًۭا"},
      {n:80030,s:"عبس",a:30,t:"وَحَدَآئِقَ غُلْبًۭا"},
      {n:80031,s:"عبس",a:31,t:"وَفَٰكِهَةًۭ وَأَبًّۭا"},
      {n:80032,s:"عبس",a:32,t:"مَّتَٰعًۭا لَّكُمْ وَلِأَنْعَٰمِكُمْ"},
      {n:80033,s:"عبس",a:33,t:"فَإِذَا جَآءَتِ ٱلصَّآخَّةُ"},
      {n:80034,s:"عبس",a:34,t:"يَوْمَ يَفِرُّ ٱلْمَرْءُ مِنْ أَخِيهِ"},
      {n:80035,s:"عبس",a:35,t:"وَأُمِّهِۦ وَأَبِيهِ"},
      {n:80036,s:"عبس",a:36,t:"وَصَٰحِبَتِهِۦ وَبَنِيهِ"},
      {n:80037,s:"عبس",a:37,t:"لِكُلِّ ٱمْرِئٍۢ مِّنْهُمْ يَوْمَئِذٍۢ شَأْنٌۭ يُغْنِيهِ"},
      {n:80038,s:"عبس",a:38,t:"وُجُوهٌۭ يَوْمَئِذٍۢ مُّسْفِرَةٌۭ"},
      {n:80039,s:"عبس",a:39,t:"ضَاحِكَةٌۭ مُّسْتَبْشِرَةٌۭ"},
      {n:80040,s:"عبس",a:40,t:"وَوُجُوهٌۭ يَوْمَئِذٍ عَلَيْهَا غَبَرَةٌۭ"},
      {n:80041,s:"عبس",a:41,t:"تَرْهَقُهَا قَتَرَةٌ"},
      {n:80042,s:"عبس",a:42,t:"أُو۟لَٰٓئِكَ هُمُ ٱلْكَفَرَةُ ٱلْفَجَرَةُ"},
      {n:81001,s:"التكوير",a:1,t:"إِذَا ٱلشَّمْسُ كُوِّرَتْ"},
      {n:81002,s:"التكوير",a:2,t:"وَإِذَا ٱلنُّجُومُ ٱنكَدَرَتْ"},
      {n:81003,s:"التكوير",a:3,t:"وَإِذَا ٱلْجِبَالُ سُيِّرَتْ"},
      {n:81004,s:"التكوير",a:4,t:"وَإِذَا ٱلْعِشَارُ عُطِّلَتْ"},
      {n:81005,s:"التكوير",a:5,t:"وَإِذَا ٱلْوُحُوشُ حُشِرَتْ"},
      {n:81006,s:"التكوير",a:6,t:"وَإِذَا ٱلْبِحَارُ سُجِّرَتْ"},
      {n:81007,s:"التكوير",a:7,t:"وَإِذَا ٱلنُّفُوسُ زُوِّجَتْ"},
      {n:81008,s:"التكوير",a:8,t:"وَإِذَا ٱلْمَوْءُۥدَةُ سُئِلَتْ"},
      {n:81009,s:"التكوير",a:9,t:"بِأَىِّ ذَنۢبٍۢ قُتِلَتْ"},
      {n:81010,s:"التكوير",a:10,t:"وَإِذَا ٱلصُّحُفُ نُشِرَتْ"},
      {n:81011,s:"التكوير",a:11,t:"وَإِذَا ٱلسَّمَآءُ كُشِطَتْ"},
      {n:81012,s:"التكوير",a:12,t:"وَإِذَا ٱلْجَحِيمُ سُعِّرَتْ"},
      {n:81013,s:"التكوير",a:13,t:"وَإِذَا ٱلْجَنَّةُ أُزْلِفَتْ"},
      {n:81014,s:"التكوير",a:14,t:"عَلِمَتْ نَفْسٌۭ مَّآ أَحْضَرَتْ"},
      {n:81015,s:"التكوير",a:15,t:"فَلَآ أُقْسِمُ بِٱلْخُنَّسِ"},
      {n:81016,s:"التكوير",a:16,t:"ٱلْجَوَارِ ٱلْكُنَّسِ"},
      {n:81017,s:"التكوير",a:17,t:"وَٱلَّيْلِ إِذَا عَسْعَسَ"},
      {n:81018,s:"التكوير",a:18,t:"وَٱلصُّبْحِ إِذَا تَنَفَّسَ"},
      {n:81019,s:"التكوير",a:19,t:"إِنَّهُۥ لَقَوْلُ رَسُولٍۢ كَرِيمٍۢ"},
      {n:81020,s:"التكوير",a:20,t:"ذِى قُوَّةٍ عِندَ ذِى ٱلْعَرْشِ مَكِينٍۢ"},
      {n:81021,s:"التكوير",a:21,t:"مُّطَاعٍۢ ثَمَّ أَمِينٍۢ"},
      {n:81022,s:"التكوير",a:22,t:"وَمَا صَاحِبُكُم بِمَجْنُونٍۢ"},
      {n:81023,s:"التكوير",a:23,t:"وَلَقَدْ رَءَاهُ بِٱلْأُفُقِ ٱلْمُبِينِ"},
      {n:81024,s:"التكوير",a:24,t:"وَمَا هُوَ عَلَى ٱلْغَيْبِ بِضَنِينٍۢ"},
      {n:81025,s:"التكوير",a:25,t:"وَمَا هُوَ بِقَوْلِ شَيْطَٰنٍۢ رَّجِيمٍۢ"},
      {n:81026,s:"التكوير",a:26,t:"فَأَيْنَ تَذْهَبُونَ"},
      {n:81027,s:"التكوير",a:27,t:"إِنْ هُوَ إِلَّا ذِكْرٌۭ لِّلْعَٰلَمِينَ"},
      {n:81028,s:"التكوير",a:28,t:"لِمَن شَآءَ مِنكُمْ أَن يَسْتَقِيمَ"},
      {n:81029,s:"التكوير",a:29,t:"وَمَا تَشَآءُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُ رَبُّ ٱلْعَٰلَمِينَ"},
      {n:82001,s:"الانفطار",a:1,t:"إِذَا ٱلسَّمَآءُ ٱنفَطَرَتْ"},
      {n:82002,s:"الانفطار",a:2,t:"وَإِذَا ٱلْكَوَاكِبُ ٱنتَثَرَتْ"},
      {n:82003,s:"الانفطار",a:3,t:"وَإِذَا ٱلْبِحَارُ فُجِّرَتْ"},
      {n:82004,s:"الانفطار",a:4,t:"وَإِذَا ٱلْقُبُورُ بُعْثِرَتْ"},
      {n:82005,s:"الانفطار",a:5,t:"عَلِمَتْ نَفْسٌۭ مَّا قَدَّمَتْ وَأَخَّرَتْ"},
      {n:82006,s:"الانفطار",a:6,t:"يَٰٓأَيُّهَا ٱلْإِنسَٰنُ مَا غَرَّكَ بِرَبِّكَ ٱلْكَرِيمِ"},
      {n:82007,s:"الانفطار",a:7,t:"ٱلَّذِى خَلَقَكَ فَسَوَّىٰكَ فَعَدَلَكَ"},
      {n:82008,s:"الانفطار",a:8,t:"فِىٓ أَىِّ صُورَةٍۢ مَّا شَآءَ رَكَّبَكَ"},
      {n:82009,s:"الانفطار",a:9,t:"كَلَّا بَلْ تُكَذِّبُونَ بِٱلدِّينِ"},
      {n:82010,s:"الانفطار",a:10,t:"وَإِنَّ عَلَيْكُمْ لَحَٰفِظِينَ"},
      {n:82011,s:"الانفطار",a:11,t:"كِرَامًۭا كَٰتِبِينَ"},
      {n:82012,s:"الانفطار",a:12,t:"يَعْلَمُونَ مَا تَفْعَلُونَ"},
      {n:82013,s:"الانفطار",a:13,t:"إِنَّ ٱلْأَبْرَارَ لَفِى نَعِيمٍۢ"},
      {n:82014,s:"الانفطار",a:14,t:"وَإِنَّ ٱلْفُجَّارَ لَفِى جَحِيمٍۢ"},
      {n:82015,s:"الانفطار",a:15,t:"يَصْلَوْنَهَا يَوْمَ ٱلدِّينِ"},
      {n:82016,s:"الانفطار",a:16,t:"وَمَا هُمْ عَنْهَا بِغَآئِبِينَ"},
      {n:82017,s:"الانفطار",a:17,t:"وَمَآ أَدْرَىٰكَ مَا يَوْمُ ٱلدِّينِ"},
      {n:82018,s:"الانفطار",a:18,t:"ثُمَّ مَآ أَدْرَىٰكَ مَا يَوْمُ ٱلدِّينِ"},
      {n:82019,s:"الانفطار",a:19,t:"يَوْمَ لَا تَمْلِكُ نَفْسٌۭ لِّنَفْسٍۢ شَيْـًۭٔا ۖ وَٱلْأَمْرُ يَوْمَئِذٍۢ لِّلَّهِ"},
      {n:83001,s:"المطففين",a:1,t:"وَيْلٌۭ لِّلْمُطَفِّفِينَ"},
      {n:83002,s:"المطففين",a:2,t:"ٱلَّذِينَ إِذَا ٱكْتَالُوا۟ عَلَى ٱلنَّاسِ يَسْتَوْفُونَ"},
      {n:83003,s:"المطففين",a:3,t:"وَإِذَا كَالُوهُمْ أَو وَّزَنُوهُمْ يُخْسِرُونَ"},
      {n:83004,s:"المطففين",a:4,t:"أَلَا يَظُنُّ أُو۟لَٰٓئِكَ أَنَّهُم مَّبْعُوثُونَ"},
      {n:83005,s:"المطففين",a:5,t:"لِيَوْمٍ عَظِيمٍۢ"},
      {n:83006,s:"المطففين",a:6,t:"يَوْمَ يَقُومُ ٱلنَّاسُ لِرَبِّ ٱلْعَٰلَمِينَ"},
      {n:83007,s:"المطففين",a:7,t:"كَلَّآ إِنَّ كِتَٰبَ ٱلْفُجَّارِ لَفِى سِجِّينٍۢ"},
      {n:83008,s:"المطففين",a:8,t:"وَمَآ أَدْرَىٰكَ مَا سِجِّينٌۭ"},
      {n:83009,s:"المطففين",a:9,t:"كِتَٰبٌۭ مَّرْقُومٌۭ"},
      {n:83010,s:"المطففين",a:10,t:"وَيْلٌۭ يَوْمَئِذٍۢ لِّلْمُكَذِّبِينَ"},
      {n:83011,s:"المطففين",a:11,t:"ٱلَّذِينَ يُكَذِّبُونَ بِيَوْمِ ٱلدِّينِ"},
      {n:83012,s:"المطففين",a:12,t:"وَمَا يُكَذِّبُ بِهِۦٓ إِلَّا كُلُّ مُعْتَدٍ أَثِيمٍ"},
      {n:83013,s:"المطففين",a:13,t:"إِذَا تُتْلَىٰ عَلَيْهِ ءَايَٰتُنَا قَالَ أَسَٰطِيرُ ٱلْأَوَّلِينَ"},
      {n:83014,s:"المطففين",a:14,t:"كَلَّا ۖ بَلْ ۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُوا۟ يَكْسِبُونَ"},
      {n:83015,s:"المطففين",a:15,t:"كَلَّآ إِنَّهُمْ عَن رَّبِّهِمْ يَوْمَئِذٍۢ لَّمَحْجُوبُونَ"},
      {n:83016,s:"المطففين",a:16,t:"ثُمَّ إِنَّهُمْ لَصَالُوا۟ ٱلْجَحِيمِ"},
      {n:83017,s:"المطففين",a:17,t:"ثُمَّ يُقَالُ هَٰذَا ٱلَّذِى كُنتُم بِهِۦ تُكَذِّبُونَ"},
      {n:83018,s:"المطففين",a:18,t:"كَلَّآ إِنَّ كِتَٰبَ ٱلْأَبْرَارِ لَفِى عِلِّيِّينَ"},
      {n:83019,s:"المطففين",a:19,t:"وَمَآ أَدْرَىٰكَ مَا عِلِّيُّونَ"},
      {n:83020,s:"المطففين",a:20,t:"كِتَٰبٌۭ مَّرْقُومٌۭ"},
      {n:83021,s:"المطففين",a:21,t:"يَشْهَدُهُ ٱلْمُقَرَّبُونَ"},
      {n:83022,s:"المطففين",a:22,t:"إِنَّ ٱلْأَبْرَارَ لَفِى نَعِيمٍ"},
      {n:83023,s:"المطففين",a:23,t:"عَلَى ٱلْأَرَآئِكِ يَنظُرُونَ"},
      {n:83024,s:"المطففين",a:24,t:"تَعْرِفُ فِى وُجُوهِهِمْ نَضْرَةَ ٱلنَّعِيمِ"},
      {n:83025,s:"المطففين",a:25,t:"يُسْقَوْنَ مِن رَّحِيقٍۢ مَّخْتُومٍ"},
      {n:83026,s:"المطففين",a:26,t:"خِتَٰمُهُۥ مِسْكٌۭ ۚ وَفِى ذَٰلِكَ فَلْيَتَنَافَسِ ٱلْمُتَنَٰفِسُونَ"},
      {n:83027,s:"المطففين",a:27,t:"وَمِزَاجُهُۥ مِن تَسْنِيمٍ"},
      {n:83028,s:"المطففين",a:28,t:"عَيْنًۭا يَشْرَبُ بِهَا ٱلْمُقَرَّبُونَ"},
      {n:83029,s:"المطففين",a:29,t:"إِنَّ ٱلَّذِينَ أَجْرَمُوا۟ كَانُوا۟ مِنَ ٱلَّذِينَ ءَامَنُوا۟ يَضْحَكُونَ"},
      {n:83030,s:"المطففين",a:30,t:"وَإِذَا مَرُّوا۟ بِهِمْ يَتَغَامَزُونَ"},
      {n:83031,s:"المطففين",a:31,t:"وَإِذَا ٱنقَلَبُوٓا۟ إِلَىٰٓ أَهْلِهِمُ ٱنقَلَبُوا۟ فَكِهِينَ"},
      {n:83032,s:"المطففين",a:32,t:"وَإِذَا رَأَوْهُمْ قَالُوٓا۟ إِنَّ هَٰٓؤُلَآءِ لَضَآلُّونَ"},
      {n:83033,s:"المطففين",a:33,t:"وَمَآ أُرْسِلُوا۟ عَلَيْهِمْ حَٰفِظِينَ"},
      {n:83034,s:"المطففين",a:34,t:"فَٱلْيَوْمَ ٱلَّذِينَ ءَامَنُوا۟ مِنَ ٱلْكُفَّارِ يَضْحَكُونَ"},
      {n:83035,s:"المطففين",a:35,t:"عَلَى ٱلْأَرَآئِكِ يَنظُرُونَ"},
      {n:83036,s:"المطففين",a:36,t:"هَلْ ثُوِّبَ ٱلْكُفَّارُ مَا كَانُوا۟ يَفْعَلُونَ"},
      {n:84001,s:"الانشقاق",a:1,t:"إِذَا ٱلسَّمَآءُ ٱنشَقَّتْ"},
      {n:84002,s:"الانشقاق",a:2,t:"وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ"},
      {n:84003,s:"الانشقاق",a:3,t:"وَإِذَا ٱلْأَرْضُ مُدَّتْ"},
      {n:84004,s:"الانشقاق",a:4,t:"وَأَلْقَتْ مَا فِيهَا وَتَخَلَّتْ"},
      {n:84005,s:"الانشقاق",a:5,t:"وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ"},
      {n:84006,s:"الانشقاق",a:6,t:"يَٰٓأَيُّهَا ٱلْإِنسَٰنُ إِنَّكَ كَادِحٌ إِلَىٰ رَبِّكَ كَدْحًۭا فَمُلَٰقِيهِ"},
      {n:84007,s:"الانشقاق",a:7,t:"فَأَمَّا مَنْ أُوتِىَ كِتَٰبَهُۥ بِيَمِينِهِۦ"},
      {n:84008,s:"الانشقاق",a:8,t:"فَسَوْفَ يُحَاسَبُ حِسَابًۭا يَسِيرًۭا"},
      {n:84009,s:"الانشقاق",a:9,t:"وَيَنقَلِبُ إِلَىٰٓ أَهْلِهِۦ مَسْرُورًۭا"},
      {n:84010,s:"الانشقاق",a:10,t:"وَأَمَّا مَنْ أُوتِىَ كِتَٰبَهُۥ وَرَآءَ ظَهْرِهِۦ"},
      {n:84011,s:"الانشقاق",a:11,t:"فَسَوْفَ يَدْعُوا۟ ثُبُورًۭا"},
      {n:84012,s:"الانشقاق",a:12,t:"وَيَصْلَىٰ سَعِيرًا"},
      {n:84013,s:"الانشقاق",a:13,t:"إِنَّهُۥ كَانَ فِىٓ أَهْلِهِۦ مَسْرُورًا"},
      {n:84014,s:"الانشقاق",a:14,t:"إِنَّهُۥ ظَنَّ أَن لَّن يَحُورَ"},
      {n:84015,s:"الانشقاق",a:15,t:"بَلَىٰٓ إِنَّ رَبَّهُۥ كَانَ بِهِۦ بَصِيرًۭا"},
      {n:84016,s:"الانشقاق",a:16,t:"فَلَآ أُقْسِمُ بِٱلشَّفَقِ"},
      {n:84017,s:"الانشقاق",a:17,t:"وَٱلَّيْلِ وَمَا وَسَقَ"},
      {n:84018,s:"الانشقاق",a:18,t:"وَٱلْقَمَرِ إِذَا ٱتَّسَقَ"},
      {n:84019,s:"الانشقاق",a:19,t:"لَتَرْكَبُنَّ طَبَقًا عَن طَبَقٍۢ"},
      {n:84020,s:"الانشقاق",a:20,t:"فَمَا لَهُمْ لَا يُؤْمِنُونَ"},
      {n:84021,s:"الانشقاق",a:21,t:"وَإِذَا قُرِئَ عَلَيْهِمُ ٱلْقُرْءَانُ لَا يَسْجُدُونَ ۩"},
      {n:84022,s:"الانشقاق",a:22,t:"بَلِ ٱلَّذِينَ كَفَرُوا۟ يُكَذِّبُونَ"},
      {n:84023,s:"الانشقاق",a:23,t:"وَٱللَّهُ أَعْلَمُ بِمَا يُوعُونَ"},
      {n:84024,s:"الانشقاق",a:24,t:"فَبَشِّرْهُم بِعَذَابٍ أَلِيمٍ"},
      {n:84025,s:"الانشقاق",a:25,t:"إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍۭ"},
      {n:85001,s:"البروج",a:1,t:"وَٱلسَّمَآءِ ذَاتِ ٱلْبُرُوجِ"},
      {n:85002,s:"البروج",a:2,t:"وَٱلْيَوْمِ ٱلْمَوْعُودِ"},
      {n:85003,s:"البروج",a:3,t:"وَشَاهِدٍۢ وَمَشْهُودٍۢ"},
      {n:85004,s:"البروج",a:4,t:"قُتِلَ أَصْحَٰبُ ٱلْأُخْدُودِ"},
      {n:85005,s:"البروج",a:5,t:"ٱلنَّارِ ذَاتِ ٱلْوَقُودِ"},
      {n:85006,s:"البروج",a:6,t:"إِذْ هُمْ عَلَيْهَا قُعُودٌۭ"},
      {n:85007,s:"البروج",a:7,t:"وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِٱلْمُؤْمِنِينَ شُهُودٌۭ"},
      {n:85008,s:"البروج",a:8,t:"وَمَا نَقَمُوا۟ مِنْهُمْ إِلَّآ أَن يُؤْمِنُوا۟ بِٱللَّهِ ٱلْعَزِيزِ ٱلْحَمِيدِ"},
      {n:85009,s:"البروج",a:9,t:"ٱلَّذِى لَهُۥ مُلْكُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ شَهِيدٌ"},
      {n:85010,s:"البروج",a:10,t:"إِنَّ ٱلَّذِينَ فَتَنُوا۟ ٱلْمُؤْمِنِينَ وَٱلْمُؤْمِنَٰتِ ثُمَّ لَمْ يَتُوبُوا۟ فَلَهُمْ عَذَابُ جَهَنَّمَ وَلَهُمْ عَذَابُ ٱلْحَرِيقِ"},
      {n:85011,s:"البروج",a:11,t:"إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ لَهُمْ جَنَّٰتٌۭ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ ۚ ذَٰلِكَ ٱلْفَوْزُ ٱلْكَبِيرُ"},
      {n:85012,s:"البروج",a:12,t:"إِنَّ بَطْشَ رَبِّكَ لَشَدِيدٌ"},
      {n:85013,s:"البروج",a:13,t:"إِنَّهُۥ هُوَ يُبْدِئُ وَيُعِيدُ"},
      {n:85014,s:"البروج",a:14,t:"وَهُوَ ٱلْغَفُورُ ٱلْوَدُودُ"},
      {n:85015,s:"البروج",a:15,t:"ذُو ٱلْعَرْشِ ٱلْمَجِيدُ"},
      {n:85016,s:"البروج",a:16,t:"فَعَّالٌۭ لِّمَا يُرِيدُ"},
      {n:85017,s:"البروج",a:17,t:"هَلْ أَتَىٰكَ حَدِيثُ ٱلْجُنُودِ"},
      {n:85018,s:"البروج",a:18,t:"فِرْعَوْنَ وَثَمُودَ"},
      {n:85019,s:"البروج",a:19,t:"بَلِ ٱلَّذِينَ كَفَرُوا۟ فِى تَكْذِيبٍۢ"},
      {n:85020,s:"البروج",a:20,t:"وَٱللَّهُ مِن وَرَآئِهِم مُّحِيطٌۢ"},
      {n:85021,s:"البروج",a:21,t:"بَلْ هُوَ قُرْءَانٌۭ مَّجِيدٌۭ"},
      {n:85022,s:"البروج",a:22,t:"فِى لَوْحٍۢ مَّحْفُوظٍۭ"},
      {n:86001,s:"الطارق",a:1,t:"وَٱلسَّمَآءِ وَٱلطَّارِقِ"},
      {n:86002,s:"الطارق",a:2,t:"وَمَآ أَدْرَىٰكَ مَا ٱلطَّارِقُ"},
      {n:86003,s:"الطارق",a:3,t:"ٱلنَّجْمُ ٱلثَّاقِبُ"},
      {n:86004,s:"الطارق",a:4,t:"إِن كُلُّ نَفْسٍۢ لَّمَّا عَلَيْهَا حَافِظٌۭ"},
      {n:86005,s:"الطارق",a:5,t:"فَلْيَنظُرِ ٱلْإِنسَٰنُ مِمَّ خُلِقَ"},
      {n:86006,s:"الطارق",a:6,t:"خُلِقَ مِن مَّآءٍۢ دَافِقٍۢ"},
      {n:86007,s:"الطارق",a:7,t:"يَخْرُجُ مِنۢ بَيْنِ ٱلصُّلْبِ وَٱلتَّرَآئِبِ"},
      {n:86008,s:"الطارق",a:8,t:"إِنَّهُۥ عَلَىٰ رَجْعِهِۦ لَقَادِرٌۭ"},
      {n:86009,s:"الطارق",a:9,t:"يَوْمَ تُبْلَى ٱلسَّرَآئِرُ"},
      {n:86010,s:"الطارق",a:10,t:"فَمَا لَهُۥ مِن قُوَّةٍۢ وَلَا نَاصِرٍۢ"},
      {n:86011,s:"الطارق",a:11,t:"وَٱلسَّمَآءِ ذَاتِ ٱلرَّجْعِ"},
      {n:86012,s:"الطارق",a:12,t:"وَٱلْأَرْضِ ذَاتِ ٱلصَّدْعِ"},
      {n:86013,s:"الطارق",a:13,t:"إِنَّهُۥ لَقَوْلٌۭ فَصْلٌۭ"},
      {n:86014,s:"الطارق",a:14,t:"وَمَا هُوَ بِٱلْهَزْلِ"},
      {n:86015,s:"الطارق",a:15,t:"إِنَّهُمْ يَكِيدُونَ كَيْدًۭا"},
      {n:86016,s:"الطارق",a:16,t:"وَأَكِيدُ كَيْدًۭا"},
      {n:86017,s:"الطارق",a:17,t:"فَمَهِّلِ ٱلْكَٰفِرِينَ أَمْهِلْهُمْ رُوَيْدًۢا"},
      {n:87001,s:"الأعلى",a:1,t:"سَبِّحِ ٱسْمَ رَبِّكَ ٱلْأَعْلَى"},
      {n:87002,s:"الأعلى",a:2,t:"ٱلَّذِى خَلَقَ فَسَوَّىٰ"},
      {n:87003,s:"الأعلى",a:3,t:"وَٱلَّذِى قَدَّرَ فَهَدَىٰ"},
      {n:87004,s:"الأعلى",a:4,t:"وَٱلَّذِىٓ أَخْرَجَ ٱلْمَرْعَىٰ"},
      {n:87005,s:"الأعلى",a:5,t:"فَجَعَلَهُۥ غُثَآءً أَحْوَىٰ"},
      {n:87006,s:"الأعلى",a:6,t:"سَنُقْرِئُكَ فَلَا تَنسَىٰٓ"},
      {n:87007,s:"الأعلى",a:7,t:"إِلَّا مَا شَآءَ ٱللَّهُ ۚ إِنَّهُۥ يَعْلَمُ ٱلْجَهْرَ وَمَا يَخْفَىٰ"},
      {n:87008,s:"الأعلى",a:8,t:"وَنُيَسِّرُكَ لِلْيُسْرَىٰ"},
      {n:87009,s:"الأعلى",a:9,t:"فَذَكِّرْ إِن نَّفَعَتِ ٱلذِّكْرَىٰ"},
      {n:87010,s:"الأعلى",a:10,t:"سَيَذَّكَّرُ مَن يَخْشَىٰ"},
      {n:87011,s:"الأعلى",a:11,t:"وَيَتَجَنَّبُهَا ٱلْأَشْقَى"},
      {n:87012,s:"الأعلى",a:12,t:"ٱلَّذِى يَصْلَى ٱلنَّارَ ٱلْكُبْرَىٰ"},
      {n:87013,s:"الأعلى",a:13,t:"ثُمَّ لَا يَمُوتُ فِيهَا وَلَا يَحْيَىٰ"},
      {n:87014,s:"الأعلى",a:14,t:"قَدْ أَفْلَحَ مَن تَزَكَّىٰ"},
      {n:87015,s:"الأعلى",a:15,t:"وَذَكَرَ ٱسْمَ رَبِّهِۦ فَصَلَّىٰ"},
      {n:87016,s:"الأعلى",a:16,t:"بَلْ تُؤْثِرُونَ ٱلْحَيَوٰةَ ٱلدُّنْيَا"},
      {n:87017,s:"الأعلى",a:17,t:"وَٱلْءَاخِرَةُ خَيْرٌۭ وَأَبْقَىٰٓ"},
      {n:87018,s:"الأعلى",a:18,t:"إِنَّ هَٰذَا لَفِى ٱلصُّحُفِ ٱلْأُولَىٰ"},
      {n:87019,s:"الأعلى",a:19,t:"صُحُفِ إِبْرَٰهِيمَ وَمُوسَىٰ"},
      {n:88001,s:"الغاشية",a:1,t:"هَلْ أَتَىٰكَ حَدِيثُ ٱلْغَٰشِيَةِ"},
      {n:88002,s:"الغاشية",a:2,t:"وُجُوهٌۭ يَوْمَئِذٍ خَٰشِعَةٌ"},
      {n:88003,s:"الغاشية",a:3,t:"عَامِلَةٌۭ نَّاصِبَةٌۭ"},
      {n:88004,s:"الغاشية",a:4,t:"تَصْلَىٰ نَارًا حَامِيَةًۭ"},
      {n:88005,s:"الغاشية",a:5,t:"تُسْقَىٰ مِنْ عَيْنٍ ءَانِيَةٍۢ"},
      {n:88006,s:"الغاشية",a:6,t:"لَّيْسَ لَهُمْ طَعَامٌ إِلَّا مِن ضَرِيعٍۢ"},
      {n:88007,s:"الغاشية",a:7,t:"لَّا يُسْمِنُ وَلَا يُغْنِى مِن جُوعٍۢ"},
      {n:88008,s:"الغاشية",a:8,t:"وُجُوهٌۭ يَوْمَئِذٍۢ نَّاعِمَةٌۭ"},
      {n:88009,s:"الغاشية",a:9,t:"لِّسَعْيِهَا رَاضِيَةٌۭ"},
      {n:88010,s:"الغاشية",a:10,t:"فِى جَنَّةٍ عَالِيَةٍۢ"},
      {n:88011,s:"الغاشية",a:11,t:"لَّا تَسْمَعُ فِيهَا لَٰغِيَةًۭ"},
      {n:88012,s:"الغاشية",a:12,t:"فِيهَا عَيْنٌۭ جَارِيَةٌۭ"},
      {n:88013,s:"الغاشية",a:13,t:"فِيهَا سُرُرٌۭ مَّرْفُوعَةٌۭ"},
      {n:88014,s:"الغاشية",a:14,t:"وَأَكْوَابٌۭ مَّوْضُوعَةٌۭ"},
      {n:88015,s:"الغاشية",a:15,t:"وَنَمَارِقُ مَصْفُوفَةٌۭ"},
      {n:88016,s:"الغاشية",a:16,t:"وَزَرَابِىُّ مَبْثُوثَةٌ"},
      {n:88017,s:"الغاشية",a:17,t:"أَفَلَا يَنظُرُونَ إِلَى ٱلْإِبِلِ كَيْفَ خُلِقَتْ"},
      {n:88018,s:"الغاشية",a:18,t:"وَإِلَى ٱلسَّمَآءِ كَيْفَ رُفِعَتْ"},
      {n:88019,s:"الغاشية",a:19,t:"وَإِلَى ٱلْجِبَالِ كَيْفَ نُصِبَتْ"},
      {n:88020,s:"الغاشية",a:20,t:"وَإِلَى ٱلْأَرْضِ كَيْفَ سُطِحَتْ"},
      {n:88021,s:"الغاشية",a:21,t:"فَذَكِّرْ إِنَّمَآ أَنتَ مُذَكِّرٌۭ"},
      {n:88022,s:"الغاشية",a:22,t:"لَّسْتَ عَلَيْهِم بِمُصَيْطِرٍ"},
      {n:88023,s:"الغاشية",a:23,t:"إِلَّا مَن تَوَلَّىٰ وَكَفَرَ"},
      {n:88024,s:"الغاشية",a:24,t:"فَيُعَذِّبُهُ ٱللَّهُ ٱلْعَذَابَ ٱلْأَكْبَرَ"},
      {n:88025,s:"الغاشية",a:25,t:"إِنَّ إِلَيْنَآ إِيَابَهُمْ"},
      {n:88026,s:"الغاشية",a:26,t:"ثُمَّ إِنَّ عَلَيْنَا حِسَابَهُم"},
      {n:89001,s:"الفجر",a:1,t:"وَٱلْفَجْرِ"},
      {n:89002,s:"الفجر",a:2,t:"وَلَيَالٍ عَشْرٍۢ"},
      {n:89003,s:"الفجر",a:3,t:"وَٱلشَّفْعِ وَٱلْوَتْرِ"},
      {n:89004,s:"الفجر",a:4,t:"وَٱلَّيْلِ إِذَا يَسْرِ"},
      {n:89005,s:"الفجر",a:5,t:"هَلْ فِى ذَٰلِكَ قَسَمٌۭ لِّذِى حِجْرٍ"},
      {n:89006,s:"الفجر",a:6,t:"أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ"},
      {n:89007,s:"الفجر",a:7,t:"إِرَمَ ذَاتِ ٱلْعِمَادِ"},
      {n:89008,s:"الفجر",a:8,t:"ٱلَّتِى لَمْ يُخْلَقْ مِثْلُهَا فِى ٱلْبِلَٰدِ"},
      {n:89009,s:"الفجر",a:9,t:"وَثَمُودَ ٱلَّذِينَ جَابُوا۟ ٱلصَّخْرَ بِٱلْوَادِ"},
      {n:89010,s:"الفجر",a:10,t:"وَفِرْعَوْنَ ذِى ٱلْأَوْتَادِ"},
      {n:89011,s:"الفجر",a:11,t:"ٱلَّذِينَ طَغَوْا۟ فِى ٱلْبِلَٰدِ"},
      {n:89012,s:"الفجر",a:12,t:"فَأَكْثَرُوا۟ فِيهَا ٱلْفَسَادَ"},
      {n:89013,s:"الفجر",a:13,t:"فَصَبَّ عَلَيْهِمْ رَبُّكَ سَوْطَ عَذَابٍ"},
      {n:89014,s:"الفجر",a:14,t:"إِنَّ رَبَّكَ لَبِٱلْمِرْصَادِ"},
      {n:89015,s:"الفجر",a:15,t:"فَأَمَّا ٱلْإِنسَٰنُ إِذَا مَا ٱبْتَلَىٰهُ رَبُّهُۥ فَأَكْرَمَهُۥ وَنَعَّمَهُۥ فَيَقُولُ رَبِّىٓ أَكْرَمَنِ"},
      {n:89016,s:"الفجر",a:16,t:"وَأَمَّآ إِذَا مَا ٱبْتَلَىٰهُ فَقَدَرَ عَلَيْهِ رِزْقَهُۥ فَيَقُولُ رَبِّىٓ أَهَٰنَنِ"},
      {n:89017,s:"الفجر",a:17,t:"كَلَّا ۖ بَل لَّا تُكْرِمُونَ ٱلْيَتِيمَ"},
      {n:89018,s:"الفجر",a:18,t:"وَلَا تَحَٰٓضُّونَ عَلَىٰ طَعَامِ ٱلْمِسْكِينِ"},
      {n:89019,s:"الفجر",a:19,t:"وَتَأْكُلُونَ ٱلتُّرَاثَ أَكْلًۭا لَّمًّۭا"},
      {n:89020,s:"الفجر",a:20,t:"وَتُحِبُّونَ ٱلْمَالَ حُبًّۭا جَمًّۭا"},
      {n:89021,s:"الفجر",a:21,t:"كَلَّآ إِذَا دُكَّتِ ٱلْأَرْضُ دَكًّۭا دَكًّۭا"},
      {n:89022,s:"الفجر",a:22,t:"وَجَآءَ رَبُّكَ وَٱلْمَلَكُ صَفًّۭا صَفًّۭا"},
      {n:89023,s:"الفجر",a:23,t:"وَجِا۟ىٓءَ يَوْمَئِذٍۭ بِجَهَنَّمَ ۚ يَوْمَئِذٍۢ يَتَذَكَّرُ ٱلْإِنسَٰنُ وَأَنَّىٰ لَهُ ٱلذِّكْرَىٰ"},
      {n:89024,s:"الفجر",a:24,t:"يَقُولُ يَٰلَيْتَنِى قَدَّمْتُ لِحَيَاتِى"},
      {n:89025,s:"الفجر",a:25,t:"فَيَوْمَئِذٍۢ لَّا يُعَذِّبُ عَذَابَهُۥٓ أَحَدٌۭ"},
      {n:89026,s:"الفجر",a:26,t:"وَلَا يُوثِقُ وَثَاقَهُۥٓ أَحَدٌۭ"},
      {n:89027,s:"الفجر",a:27,t:"يَٰٓأَيَّتُهَا ٱلنَّفْسُ ٱلْمُطْمَئِنَّةُ"},
      {n:89028,s:"الفجر",a:28,t:"ٱرْجِعِىٓ إِلَىٰ رَبِّكِ رَاضِيَةًۭ مَّرْضِيَّةًۭ"},
      {n:89029,s:"الفجر",a:29,t:"فَٱدْخُلِى فِى عِبَٰدِى"},
      {n:89030,s:"الفجر",a:30,t:"وَٱدْخُلِى جَنَّتِى"},
      {n:90001,s:"البلد",a:1,t:"لَآ أُقْسِمُ بِهَٰذَا ٱلْبَلَدِ"},
      {n:90002,s:"البلد",a:2,t:"وَأَنتَ حِلٌّۢ بِهَٰذَا ٱلْبَلَدِ"},
      {n:90003,s:"البلد",a:3,t:"وَوَالِدٍۢ وَمَا وَلَدَ"},
      {n:90004,s:"البلد",a:4,t:"لَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ فِى كَبَدٍ"},
      {n:90005,s:"البلد",a:5,t:"أَيَحْسَبُ أَن لَّن يَقْدِرَ عَلَيْهِ أَحَدٌۭ"},
      {n:90006,s:"البلد",a:6,t:"يَقُولُ أَهْلَكْتُ مَالًۭا لُّبَدًا"},
      {n:90007,s:"البلد",a:7,t:"أَيَحْسَبُ أَن لَّمْ يَرَهُۥٓ أَحَدٌ"},
      {n:90008,s:"البلد",a:8,t:"أَلَمْ نَجْعَل لَّهُۥ عَيْنَيْنِ"},
      {n:90009,s:"البلد",a:9,t:"وَلِسَانًۭا وَشَفَتَيْنِ"},
      {n:90010,s:"البلد",a:10,t:"وَهَدَيْنَٰهُ ٱلنَّجْدَيْنِ"},
      {n:90011,s:"البلد",a:11,t:"فَلَا ٱقْتَحَمَ ٱلْعَقَبَةَ"},
      {n:90012,s:"البلد",a:12,t:"وَمَآ أَدْرَىٰكَ مَا ٱلْعَقَبَةُ"},
      {n:90013,s:"البلد",a:13,t:"فَكُّ رَقَبَةٍ"},
      {n:90014,s:"البلد",a:14,t:"أَوْ إِطْعَٰمٌۭ فِى يَوْمٍۢ ذِى مَسْغَبَةٍۢ"},
      {n:90015,s:"البلد",a:15,t:"يَتِيمًۭا ذَا مَقْرَبَةٍ"},
      {n:90016,s:"البلد",a:16,t:"أَوْ مِسْكِينًۭا ذَا مَتْرَبَةٍۢ"},
      {n:90017,s:"البلد",a:17,t:"ثُمَّ كَانَ مِنَ ٱلَّذِينَ ءَامَنُوا۟ وَتَوَاصَوْا۟ بِٱلصَّبْرِ وَتَوَاصَوْا۟ بِٱلْمَرْحَمَةِ"},
      {n:90018,s:"البلد",a:18,t:"أُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلْمَيْمَنَةِ"},
      {n:90019,s:"البلد",a:19,t:"وَٱلَّذِينَ كَفَرُوا۟ بِـَٔايَٰتِنَا هُمْ أَصْحَٰبُ ٱلْمَشْـَٔمَةِ"},
      {n:90020,s:"البلد",a:20,t:"عَلَيْهِمْ نَارٌۭ مُّؤْصَدَةٌۢ"},
      {n:91001,s:"الشمس",a:1,t:"وَٱلشَّمْسِ وَضُحَىٰهَا"},
      {n:91002,s:"الشمس",a:2,t:"وَٱلْقَمَرِ إِذَا تَلَىٰهَا"},
      {n:91003,s:"الشمس",a:3,t:"وَٱلنَّهَارِ إِذَا جَلَّىٰهَا"},
      {n:91004,s:"الشمس",a:4,t:"وَٱلَّيْلِ إِذَا يَغْشَىٰهَا"},
      {n:91005,s:"الشمس",a:5,t:"وَٱلسَّمَآءِ وَمَا بَنَىٰهَا"},
      {n:91006,s:"الشمس",a:6,t:"وَٱلْأَرْضِ وَمَا طَحَىٰهَا"},
      {n:91007,s:"الشمس",a:7,t:"وَنَفْسٍۢ وَمَا سَوَّىٰهَا"},
      {n:91008,s:"الشمس",a:8,t:"فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَىٰهَا"},
      {n:91009,s:"الشمس",a:9,t:"قَدْ أَفْلَحَ مَن زَكَّىٰهَا"},
      {n:91010,s:"الشمس",a:10,t:"وَقَدْ خَابَ مَن دَسَّىٰهَا"},
      {n:91011,s:"الشمس",a:11,t:"كَذَّبَتْ ثَمُودُ بِطَغْوَىٰهَآ"},
      {n:91012,s:"الشمس",a:12,t:"إِذِ ٱنۢبَعَثَ أَشْقَىٰهَا"},
      {n:91013,s:"الشمس",a:13,t:"فَقَالَ لَهُمْ رَسُولُ ٱللَّهِ نَاقَةَ ٱللَّهِ وَسُقْيَٰهَا"},
      {n:91014,s:"الشمس",a:14,t:"فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنۢبِهِمْ فَسَوَّىٰهَا"},
      {n:91015,s:"الشمس",a:15,t:"وَلَا يَخَافُ عُقْبَٰهَا"},
      {n:92001,s:"الليل",a:1,t:"وَٱلَّيْلِ إِذَا يَغْشَىٰ"},
      {n:92002,s:"الليل",a:2,t:"وَٱلنَّهَارِ إِذَا تَجَلَّىٰ"},
      {n:92003,s:"الليل",a:3,t:"وَمَا خَلَقَ ٱلذَّكَرَ وَٱلْأُنثَىٰٓ"},
      {n:92004,s:"الليل",a:4,t:"إِنَّ سَعْيَكُمْ لَشَتَّىٰ"},
      {n:92005,s:"الليل",a:5,t:"فَأَمَّا مَنْ أَعْطَىٰ وَٱتَّقَىٰ"},
      {n:92006,s:"الليل",a:6,t:"وَصَدَّقَ بِٱلْحُسْنَىٰ"},
      {n:92007,s:"الليل",a:7,t:"فَسَنُيَسِّرُهُۥ لِلْيُسْرَىٰ"},
      {n:92008,s:"الليل",a:8,t:"وَأَمَّا مَنۢ بَخِلَ وَٱسْتَغْنَىٰ"},
      {n:92009,s:"الليل",a:9,t:"وَكَذَّبَ بِٱلْحُسْنَىٰ"},
      {n:92010,s:"الليل",a:10,t:"فَسَنُيَسِّرُهُۥ لِلْعُسْرَىٰ"},
      {n:92011,s:"الليل",a:11,t:"وَمَا يُغْنِى عَنْهُ مَالُهُۥٓ إِذَا تَرَدَّىٰٓ"},
      {n:92012,s:"الليل",a:12,t:"إِنَّ عَلَيْنَا لَلْهُدَىٰ"},
      {n:92013,s:"الليل",a:13,t:"وَإِنَّ لَنَا لَلْءَاخِرَةَ وَٱلْأُولَىٰ"},
      {n:92014,s:"الليل",a:14,t:"فَأَنذَرْتُكُمْ نَارًۭا تَلَظَّىٰ"},
      {n:92015,s:"الليل",a:15,t:"لَا يَصْلَىٰهَآ إِلَّا ٱلْأَشْقَى"},
      {n:92016,s:"الليل",a:16,t:"ٱلَّذِى كَذَّبَ وَتَوَلَّىٰ"},
      {n:92017,s:"الليل",a:17,t:"وَسَيُجَنَّبُهَا ٱلْأَتْقَى"},
      {n:92018,s:"الليل",a:18,t:"ٱلَّذِى يُؤْتِى مَالَهُۥ يَتَزَكَّىٰ"},
      {n:92019,s:"الليل",a:19,t:"وَمَا لِأَحَدٍ عِندَهُۥ مِن نِّعْمَةٍۢ تُجْزَىٰٓ"},
      {n:92020,s:"الليل",a:20,t:"إِلَّا ٱبْتِغَآءَ وَجْهِ رَبِّهِ ٱلْأَعْلَىٰ"},
      {n:92021,s:"الليل",a:21,t:"وَلَسَوْفَ يَرْضَىٰ"},
      {n:93001,s:"الضحى",a:1,t:"وَٱلضُّحَىٰ"},
      {n:93002,s:"الضحى",a:2,t:"وَٱلَّيْلِ إِذَا سَجَىٰ"},
      {n:93003,s:"الضحى",a:3,t:"مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ"},
      {n:93004,s:"الضحى",a:4,t:"وَلَلْءَاخِرَةُ خَيْرٌۭ لَّكَ مِنَ ٱلْأُولَىٰ"},
      {n:93005,s:"الضحى",a:5,t:"وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰٓ"},
      {n:93006,s:"الضحى",a:6,t:"أَلَمْ يَجِدْكَ يَتِيمًۭا فَـَٔاوَىٰ"},
      {n:93007,s:"الضحى",a:7,t:"وَوَجَدَكَ ضَآلًّۭا فَهَدَىٰ"},
      {n:93008,s:"الضحى",a:8,t:"وَوَجَدَكَ عَآئِلًۭا فَأَغْنَىٰ"},
      {n:93009,s:"الضحى",a:9,t:"فَأَمَّا ٱلْيَتِيمَ فَلَا تَقْهَرْ"},
      {n:93010,s:"الضحى",a:10,t:"وَأَمَّا ٱلسَّآئِلَ فَلَا تَنْهَرْ"},
      {n:93011,s:"الضحى",a:11,t:"وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ"},
      {n:94001,s:"الشرح",a:1,t:"أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ"},
      {n:94002,s:"الشرح",a:2,t:"وَوَضَعْنَا عَنكَ وِزْرَكَ"},
      {n:94003,s:"الشرح",a:3,t:"ٱلَّذِىٓ أَنقَضَ ظَهْرَكَ"},
      {n:94004,s:"الشرح",a:4,t:"وَرَفَعْنَا لَكَ ذِكْرَكَ"},
      {n:94005,s:"الشرح",a:5,t:"فَإِنَّ مَعَ ٱلْعُسْرِ يُسْرًا"},
      {n:94006,s:"الشرح",a:6,t:"إِنَّ مَعَ ٱلْعُسْرِ يُسْرًۭا"},
      {n:94007,s:"الشرح",a:7,t:"فَإِذَا فَرَغْتَ فَٱنصَبْ"},
      {n:94008,s:"الشرح",a:8,t:"وَإِلَىٰ رَبِّكَ فَٱرْغَب"},
      {n:95001,s:"التين",a:1,t:"وَٱلتِّينِ وَٱلزَّيْتُونِ"},
      {n:95002,s:"التين",a:2,t:"وَطُورِ سِينِينَ"},
      {n:95003,s:"التين",a:3,t:"وَهَٰذَا ٱلْبَلَدِ ٱلْأَمِينِ"},
      {n:95004,s:"التين",a:4,t:"لَقَدْ خَلَقْنَا ٱلْإِنسَٰنَ فِىٓ أَحْسَنِ تَقْوِيمٍۢ"},
      {n:95005,s:"التين",a:5,t:"ثُمَّ رَدَدْنَٰهُ أَسْفَلَ سَٰفِلِينَ"},
      {n:95006,s:"التين",a:6,t:"إِلَّا ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍۢ"},
      {n:95007,s:"التين",a:7,t:"فَمَا يُكَذِّبُكَ بَعْدُ بِٱلدِّينِ"},
      {n:95008,s:"التين",a:8,t:"أَلَيْسَ ٱللَّهُ بِأَحْكَمِ ٱلْحَٰكِمِينَ"},
      {n:96001,s:"العلق",a:1,t:"ٱقْرَأْ بِٱسْمِ رَبِّكَ ٱلَّذِى خَلَقَ"},
      {n:96002,s:"العلق",a:2,t:"خَلَقَ ٱلْإِنسَٰنَ مِنْ عَلَقٍ"},
      {n:96003,s:"العلق",a:3,t:"ٱقْرَأْ وَرَبُّكَ ٱلْأَكْرَمُ"},
      {n:96004,s:"العلق",a:4,t:"ٱلَّذِى عَلَّمَ بِٱلْقَلَمِ"},
      {n:96005,s:"العلق",a:5,t:"عَلَّمَ ٱلْإِنسَٰنَ مَا لَمْ يَعْلَمْ"},
      {n:96006,s:"العلق",a:6,t:"كَلَّآ إِنَّ ٱلْإِنسَٰنَ لَيَطْغَىٰٓ"},
      {n:96007,s:"العلق",a:7,t:"أَن رَّءَاهُ ٱسْتَغْنَىٰٓ"},
      {n:96008,s:"العلق",a:8,t:"إِنَّ إِلَىٰ رَبِّكَ ٱلرُّجْعَىٰٓ"},
      {n:96009,s:"العلق",a:9,t:"أَرَءَيْتَ ٱلَّذِى يَنْهَىٰ"},
      {n:96010,s:"العلق",a:10,t:"عَبْدًا إِذَا صَلَّىٰٓ"},
      {n:96011,s:"العلق",a:11,t:"أَرَءَيْتَ إِن كَانَ عَلَى ٱلْهُدَىٰٓ"},
      {n:96012,s:"العلق",a:12,t:"أَوْ أَمَرَ بِٱلتَّقْوَىٰٓ"},
      {n:96013,s:"العلق",a:13,t:"أَرَءَيْتَ إِن كَذَّبَ وَتَوَلَّىٰٓ"},
      {n:96014,s:"العلق",a:14,t:"أَلَمْ يَعْلَم بِأَنَّ ٱللَّهَ يَرَىٰ"},
      {n:96015,s:"العلق",a:15,t:"كَلَّا لَئِن لَّمْ يَنتَهِ لَنَسْفَعًۢا بِٱلنَّاصِيَةِ"},
      {n:96016,s:"العلق",a:16,t:"نَاصِيَةٍۢ كَٰذِبَةٍ خَاطِئَةٍۢ"},
      {n:96017,s:"العلق",a:17,t:"فَلْيَدْعُ نَادِيَهُۥ"},
      {n:96018,s:"العلق",a:18,t:"سَنَدْعُ ٱلزَّبَانِيَةَ"},
      {n:96019,s:"العلق",a:19,t:"كَلَّا لَا تُطِعْهُ وَٱسْجُدْ وَٱقْتَرِب ۩"},
      {n:97001,s:"القدر",a:1,t:"إِنَّآ أَنزَلْنَٰهُ فِى لَيْلَةِ ٱلْقَدْرِ"},
      {n:97002,s:"القدر",a:2,t:"وَمَآ أَدْرَىٰكَ مَا لَيْلَةُ ٱلْقَدْرِ"},
      {n:97003,s:"القدر",a:3,t:"لَيْلَةُ ٱلْقَدْرِ خَيْرٌۭ مِّنْ أَلْفِ شَهْرٍۢ"},
      {n:97004,s:"القدر",a:4,t:"تَنَزَّلُ ٱلْمَلَٰٓئِكَةُ وَٱلرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍۢ"},
      {n:97005,s:"القدر",a:5,t:"سَلَٰمٌ هِىَ حَتَّىٰ مَطْلَعِ ٱلْفَجْرِ"},
      {n:98001,s:"البينة",a:1,t:"لَمْ يَكُنِ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ ٱلْكِتَٰبِ وَٱلْمُشْرِكِينَ مُنفَكِّينَ حَتَّىٰ تَأْتِيَهُمُ ٱلْبَيِّنَةُ"},
      {n:98002,s:"البينة",a:2,t:"رَسُولٌۭ مِّنَ ٱللَّهِ يَتْلُوا۟ صُحُفًۭا مُّطَهَّرَةًۭ"},
      {n:98003,s:"البينة",a:3,t:"فِيهَا كُتُبٌۭ قَيِّمَةٌۭ"},
      {n:98004,s:"البينة",a:4,t:"وَمَا تَفَرَّقَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ إِلَّا مِنۢ بَعْدِ مَا جَآءَتْهُمُ ٱلْبَيِّنَةُ"},
      {n:98005,s:"البينة",a:5,t:"وَمَآ أُمِرُوٓا۟ إِلَّا لِيَعْبُدُوا۟ ٱللَّهَ مُخْلِصِينَ لَهُ ٱلدِّينَ حُنَفَآءَ وَيُقِيمُوا۟ ٱلصَّلَوٰةَ وَيُؤْتُوا۟ ٱلزَّكَوٰةَ ۚ وَذَٰلِكَ دِينُ ٱلْقَيِّمَةِ"},
      {n:98006,s:"البينة",a:6,t:"إِنَّ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ ٱلْكِتَٰبِ وَٱلْمُشْرِكِينَ فِى نَارِ جَهَنَّمَ خَٰلِدِينَ فِيهَآ ۚ أُو۟لَٰٓئِكَ هُمْ شَرُّ ٱلْبَرِيَّةِ"},
      {n:98007,s:"البينة",a:7,t:"إِنَّ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ أُو۟لَٰٓئِكَ هُمْ خَيْرُ ٱلْبَرِيَّةِ"},
      {n:98008,s:"البينة",a:8,t:"جَزَآؤُهُمْ عِندَ رَبِّهِمْ جَنَّٰتُ عَدْنٍۢ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ خَٰلِدِينَ فِيهَآ أَبَدًۭا ۖ رَّضِىَ ٱللَّهُ عَنْهُمْ وَرَضُوا۟ عَنْهُ ۚ ذَٰلِكَ لِمَنْ خَشِىَ رَبَّهُۥ"},
      {n:99001,s:"الزلزلة",a:1,t:"إِذَا زُلْزِلَتِ ٱلْأَرْضُ زِلْزَالَهَا"},
      {n:99002,s:"الزلزلة",a:2,t:"وَأَخْرَجَتِ ٱلْأَرْضُ أَثْقَالَهَا"},
      {n:99003,s:"الزلزلة",a:3,t:"وَقَالَ ٱلْإِنسَٰنُ مَا لَهَا"},
      {n:99004,s:"الزلزلة",a:4,t:"يَوْمَئِذٍۢ تُحَدِّثُ أَخْبَارَهَا"},
      {n:99005,s:"الزلزلة",a:5,t:"بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا"},
      {n:99006,s:"الزلزلة",a:6,t:"يَوْمَئِذٍۢ يَصْدُرُ ٱلنَّاسُ أَشْتَاتًۭا لِّيُرَوْا۟ أَعْمَٰلَهُمْ"},
      {n:99007,s:"الزلزلة",a:7,t:"فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًۭا يَرَهُۥ"},
      {n:99008,s:"الزلزلة",a:8,t:"وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍۢ شَرًّۭا يَرَهُۥ"},
      {n:100001,s:"العاديات",a:1,t:"وَٱلْعَٰدِيَٰتِ ضَبْحًۭا"},
      {n:100002,s:"العاديات",a:2,t:"فَٱلْمُورِيَٰتِ قَدْحًۭا"},
      {n:100003,s:"العاديات",a:3,t:"فَٱلْمُغِيرَٰتِ صُبْحًۭا"},
      {n:100004,s:"العاديات",a:4,t:"فَأَثَرْنَ بِهِۦ نَقْعًۭا"},
      {n:100005,s:"العاديات",a:5,t:"فَوَسَطْنَ بِهِۦ جَمْعًا"},
      {n:100006,s:"العاديات",a:6,t:"إِنَّ ٱلْإِنسَٰنَ لِرَبِّهِۦ لَكَنُودٌۭ"},
      {n:100007,s:"العاديات",a:7,t:"وَإِنَّهُۥ عَلَىٰ ذَٰلِكَ لَشَهِيدٌۭ"},

/* ===================== إعدادات عامة ===================== */
const PTS = {mcq:10, tf:10, blank:10, order:20, match:20, choice:10};
const QTIME = 35;           // ثواني المؤقت لكل تحدٍّ
const TIME_BONUS = 5;       // أقصى نقاط إضافية للسرعة
const LS = 'quran_game_v1';

/* ===================== أدوات ===================== */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const ayahRec = (s,n) => s.ayat.find(a=>a.n===n) || {t:'', n:n};
const ayahOf = (s,n) => ayahRec(s,n).t;
const tokens = (s,n) => ayahOf(s,n).split(' ').filter(x=>x.length);
const rnd = a => a[Math.floor(Math.random()*a.length)];

/* تجريد التشكيل وتوحيد الحروف — للمقارنة فقط، العرض دائمًا بالنص الأصلي */
const MARKS = /[ً-ٰٟۖ-ۭـ۟۠-ۨ]/g;
const norm = t => String(t).replace(MARKS,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي')
                  .replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^ء-ي]/g,'');
const isMark = t => norm(t).length===0;
/* الآيات التي تنتمي لسورة داخل رحلة مجمّعة (المعرّف = رقم السورة×1000 + رقم الآية) */
const surahAyat = (e,sn) => e.ayat.filter(a => Math.floor(a.n/1000)===sn);
/* هيكل الكلمة: بدون سوابق (و/ف/ب/ك/ل/ال) وبدون حروف المدّ — للمطابقة المرنة فقط */
const skel = t => norm(t).replace(/^(وال|فال|بال|كال|لل|ال|و|ف|ب|ك|ل)/,'').replace(/[اويء]/g,'');
/* يبحث عن الكلمة داخل نص السورة ويرجّع رسمها العثماني الصحيح كما في المصحف */
function exactWord(e, sn, w){
  if(!norm(w)) return w;
  const list = sn ? surahAyat(e,sn) : e.ayat;
  const all = []; list.forEach(a => a.t.split(' ').forEach(k => { if(!isMark(k)) all.push(k); }));
  const t = norm(w);            for(const k of all) if(norm(k)===t) return k;   // مطابقة تامة
  const bare = x => norm(x).replace(/[اويء]/g,'');
  const want = new Set([skel(w), bare(w)].filter(Boolean));
  for(const k of all){ if(want.has(skel(k)) || want.has(bare(k))) return k; }    // مطابقة مرنة
  return w;
}
/* اسم السورة لآية معيّنة (فارغ في الرحلات ذات السورة الواحدة) */
const ayahSrc = (s,n) => { const r=ayahRec(s,n); return r.s ? `سورة ${r.s} · آية ${r.a}` : ''; };
const ayahNo  = (s,n) => { const r=ayahRec(s,n); return r.a!=null ? r.a : r.n; };

/* ============ توليد التحديات تلقائيًا من نص السور ============ */
function poolWords(list){
  const out=[]; list.forEach(a=>a.t.split(' ').forEach(t=>{ if(!isMark(t) && norm(t).length>=3) out.push(t); }));
  return out;
}
function autoBlank(entry, list){
  const cand = list.filter(a => a.t.split(' ').filter(t=>!isMark(t)).length>=3);
  if(!cand.length) return null;
  const a = rnd(cand), tk = a.t.split(' ');
  const idxs = tk.map((t,i)=>i).filter(i => !isMark(tk[i]) && norm(tk[i]).length>=3);
  if(!idxs.length) return null;
  const idx = rnd(idxs), ans = tk[idx], na = norm(ans), last = na.slice(-1);
  const take = pool => {
    const seen=new Set([na]), out=[];
    for(const t of shuffle(pool)){ const k=norm(t); if(seen.has(k)) continue; seen.add(k); out.push(t); if(out.length===3) break; }
    return out;
  };
  /* البدائل من كلمات باقي آيات السورة — نستبعد كلمات الآية المعروضة نفسها */
  const here = new Set(tk.map(norm));
  const pool = poolWords(list.filter(x => x.n!==a.n)).filter(t => !here.has(norm(t)));
  let opts = take(pool.filter(t => norm(t).slice(-1)===last));
  if(opts.length<3) opts = take(pool.concat(opts));
  if(opts.length<3) opts = take(poolWords(list));
  if(opts.length<3) opts = take(poolWords(entry.ayat));
  if(opts.length<3) return null;
  return {type:'blank', ayah:a.n, idx, options:opts, explain:'الكلمة كما جاءت في المصحف تمامًا — راجع الآية كاملة فوق.'};
}
function autoOrder(list){
  if(list.length<3) return null;
  for(let t=0; t<15; t++){
    const k = Math.min(list.length, Math.random()<.5?3:4);
    const st = Math.floor(Math.random()*(list.length-k+1));
    const win = list.slice(st, st+k);
    /* بعض السور فيها آيات متطابقة الألفاظ (مثل الكافرون) — نتجنّبها لأن ترتيبها غير قابل للتمييز */
    if(new Set(win.map(a=>a.t)).size === win.length)
      return {type:'order', ayat:win.map(a=>a.n), explain:'الترتيب الصحيح هو ترتيب الآيات في المصحف.'};
  }
  return null;
}
function autoWhichSurah(entry, stage){
  const names = stage.surahs.map(sn => (entry.info[sn]||{}).nm || ('سورة '+sn));
  if(names.length<3) return null;
  const i = Math.floor(Math.random()*stage.surahs.length);
  const list = surahAyat(entry, stage.surahs[i]).filter(a => a.t.split(' ').filter(t=>!isMark(t)).length>=3);
  if(!list.length) return null;
  const a = rnd(list);
  /* noSrc: نخفي اسم السورة تحت الآية وإلا كانت الإجابة مكشوفة */
  return {type:'mcq', q:'هذه الآية من أي سورة؟', show:a.n, noSrc:true, options:names.slice(), answer:i,
          explain:`هي الآية ${a.a} من سورة ${names[i]}.`, ayah:a.n};
}
function genStage(entry, stage){
  if(stage.challenges) return stage.challenges;
  const out=[], inf=entry.info||{}, bank=[];
  stage.surahs.forEach(sn=>{
    const I = inf[sn]||{}, list = surahAyat(entry, sn), block = [];
    if(I.q && I.q.length){ const x = rnd(I.q);
      block.push({type:'mcq', q:`﴿${I.nm}﴾ ${x.q}`, options:x.o.slice(), answer:x.a, explain:x.e, ayah:x.y}); }
    const b = autoBlank(entry, list); if(b) block.push(b);
    const o = autoOrder(list);        if(o) block.push(o);
    /* ترتيب عشوائي داخل كل سورة حتى لا يقع نفس نوع التحدي على نفس اللاعب كل مرة */
    out.push(...shuffle(block));
    if(I.w) I.w.forEach(p => bank.push([exactWord(entry, sn, p[0]), p[1]]));
  });
  const ws = autoWhichSurah(entry, stage); if(ws) out.push(ws);
  const mix = shuffle(bank);
  for(let i=0; i+4<=mix.length && i<8; i+=4)
    out.push({type:'match', pairs:mix.slice(i,i+4), explain:'كلمات من سور هذه المرحلة بمعانيها.'});
  return out;
}
/* تحديات سورة واحدة بمفردها (وضع «اختر سورة») */
function genSolo(entry, sn){
  const I = entry.info[sn]||{}, list = surahAyat(entry, sn), out = [];
  (I.q||[]).forEach(x => out.push({type:'mcq', q:x.q, options:x.o.slice(), answer:x.a, explain:x.e, ayah:x.y}));
  const seenB = new Set();
  for(let t=0; t<20 && seenB.size<3; t++){
    const b = autoBlank(entry, list); if(!b) break;
    const k = b.ayah+':'+b.idx; if(seenB.has(k)) continue; seenB.add(k); out.push(b);
  }
  const seenO = new Set();
  for(let t=0; t<20 && seenO.size<2; t++){
    const o = autoOrder(list); if(!o) break;
    const k = o.ayat.join(','); if(seenO.has(k)) continue; seenO.add(k); out.push(o);
  }
  const mix = shuffle((I.w||[]).map(p => [exactWord(entry, sn, p[0]), p[1]]));
  for(let i=0; i+4<=mix.length && i<8; i+=4)
    out.push({type:'match', pairs:mix.slice(i,i+4), explain:`كلمات من سورة ${I.nm||''} بمعانيها.`});
  return shuffle(out);
}

const Snd = {
  on:true, ctx:null,
  init(){ if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
          if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  tone(f,at,dur,type='sine',vol=.14){
    if(!this.on||!this.ctx) return;
    const t0=this.ctx.currentTime+at, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t0);
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(this.ctx.destination); o.start(t0); o.stop(t0+dur+.05);
  },
  click(){ this.tone(660,0,.06,'triangle',.07); },
  correct(){ [523.25,659.25,783.99].forEach((f,i)=>this.tone(f,i*.08,.22,'sine',.13)); },
  wrong(){ this.tone(196,0,.16,'sawtooth',.09); this.tone(147,.14,.28,'sawtooth',.09); },
  star(){ [880,1174.7].forEach((f,i)=>this.tone(f,i*.07,.18,'triangle',.1)); },
  win(){ [523.25,587.33,659.25,783.99,1046.5].forEach((f,i)=>this.tone(f,i*.11,.35,'sine',.13)); },
  tick(){ this.tone(1200,0,.03,'square',.03); }
};

let G = {};
function newGame(surah, players){
  G = { surah, players: players.map(n=>({name:n, score:0, right:0, wrong:0})),
        turn:0, stage:0, ch:0, chal:[], stars:new Array(surah.stages.length).fill(0),
        unlocked:0, stageEarned:0, stageMax:0, timeLeft:QTIME, tId:null, locked:false,
        solo:null, soloStage:null, sstars:loadSurahStars(surah.id) };
}
/* نجوم كل سورة على حدة — محفوظة في المتصفح */
function loadSurahStars(id){ try{ return JSON.parse(localStorage.getItem(LS+'_sur_'+id)||'{}'); }catch(e){ return {}; } }
function saveSurahStars(){ try{ localStorage.setItem(LS+'_sur_'+G.surah.id, JSON.stringify(G.sstars)); }catch(e){} }

const curStage = () => G.stage<0 ? G.soloStage : G.surah.stages[G.stage];

/* تجهيز مرحلة: يولّد تحدياتها (أو يأخذ المكتوبة يدويًا) ويحسب أقصى نقاط */
function loadStage(i){
  G.solo = null; G.stage = i; G.ch = 0; G.stageEarned = 0;
  G.chal = genStage(G.surah, G.surah.stages[i]);
  G.stageMax = G.chal.reduce((a,c)=>a+(PTS[c.type]||10)+TIME_BONUS, 0);
  G.turn++;   /* إزاحة بداية الدور كل مرحلة حتى لا يبدأ نفس اللاعب دائمًا */
}
/* تجهيز سورة واحدة في وضع «اختر سورة» */
function loadSolo(sn){
  const I = G.surah.info[sn]||{};
  G.solo = sn; G.stage = -1; G.ch = 0; G.stageEarned = 0;
  G.soloStage = { title:'سورة '+(I.nm||sn), emoji:'📖', surahs:[sn], solo:true,
                  story:[I.ab||''].filter(Boolean) };
  G.chal = genSolo(G.surah, sn);
  G.stageMax = G.chal.reduce((a,c)=>a+(PTS[c.type]||10)+TIME_BONUS, 0);
  G.turn++;
}

/* ===== إدارة اللاعبين أثناء اللعب: تغيير الأسماء / إضافة / حذف ===== */
function screenPlayers(){

/* ===== وضع «اختر سورة»: كل سور الرحلة في شبكة واحدة ===== */

/* ===================== المؤقّت ===================== */
function stopTimer(){ if(G.tId){ clearInterval(G.tId); G.tId=null; } }
function startTimer(){
  stopTimer(); G.timeLeft=QTIME;
  const el=$('#tbar'); if(!el) return;
  G.tId=setInterval(()=>{
    G.timeLeft--;
    const bar=$('#tbar'); if(!bar){stopTimer();return;}
    bar.style.width=Math.max(0,G.timeLeft/QTIME*100)+'%';
    const box=$('#tbox'); if(box) box.classList.toggle('low', G.timeLeft<=10);
    if(G.timeLeft<=5 && G.timeLeft>0) Snd.tick();
    if(G.timeLeft<=0) stopTimer();
  },1000);
}

/* ===================== شاشة اللعب ===================== */
function screenPlay(){
  const st=curStage(), c=G.chal[G.ch];
  if(!c){ return screenStageEnd(); }
  G.locked=false;
  const p=G.players[G.turn%G.players.length];
  const prog=Math.round(G.ch/G.chal.length*100);
  const multi=G.players.length>1;

  app.innerHTML = `
  <div class="hdr">
    <span class="pill">${st.emoji} ${esc(st.title)}</span>
    <div class="row" style="gap:6px">
      <span class="pill">${G.ch+1} / ${G.chal.length}</span>
      ${multi?`<span class="pill turn">🎯 دور: ${esc(p.name)}</span>`:`<span class="pill">🏅 ${p.score}</span>`}
    </div>
  </div>
  <div class="bar"><i style="width:${prog}%"></i></div>
  <div class="timer" id="tbox"><i id="tbar" style="width:100%"></i></div>
  <div class="card fade" id="cbox"></div>
  <div id="after"></div>`;

  const box=$('#cbox');
  ({mcq:renderMCQ, tf:renderTF, blank:renderBlank, order:renderOrder, match:renderMatch, choice:renderChoice}[c.type])(box, c);
  startTimer();
}

function ayahHTML(n, noSrc){
  const src = noSrc ? '' : ayahSrc(G.surah,n);
  return `<div class="ayah">${esc(ayahOf(G.surah,n))}${noSrc?'':`<span class="num">${ayahNo(G.surah,n)}</span>`}</div>`
       + (src?`<div class="src">${esc(src)}</div>`:'');
}

function optButtons(box, list, onPick){
  const wrap=document.createElement('div');
  list.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt'; b.innerHTML=esc(o.label);
    b.onclick=()=>{ if(G.locked) return; G.locked=true; stopTimer();
      wrap.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      onPick(o,b,wrap); };
    wrap.appendChild(b);
  });
  box.appendChild(wrap); return wrap;
}

/* --- اختيار من متعدد --- */
function renderMCQ(box,c){
  box.innerHTML = `<h3>${esc(c.q)}</h3>` + (c.show?ayahHTML(c.show, c.noSrc):'');
  const list = shuffle(c.options.map((t,i)=>({label:t, ok:i===c.answer})));
  optButtons(box, list, (o,b,w)=>{
    w.querySelectorAll('.opt').forEach((x,i)=>{ if(list[i].ok) x.classList.add('ok'); });
    if(!o.ok){ b.classList.add('bad'); b.classList.add('shake'); }
    finish(o.ok, c, PTS.mcq);
  });
}

/* --- صح أم خطأ --- */
function renderTF(box,c){
  box.innerHTML = `<h3>صح أم خطأ؟</h3><p style="font-size:1.08rem">${esc(c.q)}</p>`;
  const list=[{label:'✅ صح', ok:c.answer===true},{label:'❌ خطأ', ok:c.answer===false}];
  optButtons(box, list, (o,b,w)=>{
    w.querySelectorAll('.opt').forEach((x,i)=>{ if(list[i].ok) x.classList.add('ok'); });
    if(!o.ok){ b.classList.add('bad'); b.classList.add('shake'); }
    finish(o.ok, c, PTS.tf);
  });
}

/* --- الكلمة الناقصة --- */
function renderBlank(box,c){
  const tk = tokens(G.surah, c.ayah);
  const right = tk[c.idx] || '';
  const view = tk.map((w,i)=> i===c.idx ? `<span class="blankbox" id="bk_">……</span>` : esc(w)).join(' ');
  const src = ayahSrc(G.surah, c.ayah);
  box.innerHTML = `<h3>أكمل الكلمة الناقصة</h3>
    <div class="ayah">${view}<span class="num">${ayahNo(G.surah,c.ayah)}</span></div>`
    + (src?`<div class="src">${esc(src)}</div>`:'');
  const list = shuffle([{label:right, ok:true}].concat(c.options.map(t=>({label:t, ok:false}))));
  optButtons(box, list, (o,b,w)=>{
    const sp=$('#bk_'); if(sp){ sp.textContent=right; sp.classList.add('filled'); }
    w.querySelectorAll('.opt').forEach((x,i)=>{ if(list[i].ok) x.classList.add('ok'); });
    if(!o.ok){ b.classList.add('bad'); b.classList.add('shake'); }
    finish(o.ok, c, PTS.blank);
  });
}

/* --- ترتيب الآيات --- */
function renderOrder(box,c){
  const want=c.ayat.slice();
  let picked=[];
  const srcAll = ayahSrc(G.surah, want[0]).split(' · ')[0];
  box.innerHTML = `<h3>رتّب الآيات بترتيبها الصحيح${srcAll?` في ${esc(srcAll)}`:' في السورة'}</h3>
    <div class="slots" id="slots"><p class="muted center" style="margin:8px">اضغط على الآيات بالترتيب…</p></div>
    <div id="pool"></div>
    <div class="center" style="margin-top:8px"><button class="btn" id="chk" disabled>تأكيد الترتيب</button></div>`;
  const pool=$('#pool'), slots=$('#slots'), chk=$('#chk');
  const draw=()=>{
    slots.innerHTML = picked.length? picked.map((n,i)=>
      `<div class="slot"><span>${i+1}. ${esc(ayahOf(G.surah,n))}</span><span class="rm" data-i="${i}">✕</span></div>`).join('')
      : '<p class="muted center" style="margin:8px">اضغط على الآيات بالترتيب…</p>';
    slots.querySelectorAll('.rm').forEach(x=>x.onclick=()=>{ if(G.locked)return; Snd.click(); picked.splice(+x.dataset.i,1); draw(); });
    pool.querySelectorAll('.opt').forEach(b=>{ b.style.display = picked.includes(+b.dataset.n) ? 'none':'block'; });
    chk.disabled = picked.length!==want.length;
  };
  pool.innerHTML = shuffle(want).map(n=>
    `<button class="opt" data-n="${n}" style="font-family:var(--quran);font-size:1.25rem;color:#ffeec2">${esc(ayahOf(G.surah,n))}</button>`).join('');
  pool.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(G.locked)return; Snd.click(); picked.push(+b.dataset.n); draw(); });
  draw();
  chk.onclick=()=>{
    if(G.locked) return; G.locked=true; stopTimer();
    const ok = picked.every((n,i)=>n===want[i]);
    pool.querySelectorAll('.opt').forEach(b=>b.disabled=true); chk.disabled=true;
    slots.style.borderColor = ok? 'var(--ok)':'var(--bad)';
    if(!ok){ slots.classList.add('shake');
      slots.insertAdjacentHTML('beforeend', `<p class="center" style="color:var(--gold);margin:10px 0 0">الترتيب الصحيح حسب أرقام الآيات: ${want.map(n=>ayahNo(G.surah,n)).join(' ← ')}</p>`); }
    finish(ok, c, PTS.order);
  };
}

/* --- توصيل كلمة بمعناها --- */
function renderMatch(box,c){
  const L = shuffle(c.pairs.map((p,i)=>({t:p[0], i}))), R = shuffle(c.pairs.map((p,i)=>({t:p[1], i})));
  box.innerHTML = `<h3>وصّل كل كلمة بمعناها</h3>
    <div class="pairs">
      <div id="colL">${L.map(x=>`<div class="pair q" data-i="${x.i}">${esc(x.t)}</div>`).join('')}</div>
      <div id="colR">${R.map(x=>`<div class="pair" data-i="${x.i}">${esc(x.t)}</div>`).join('')}</div>
    </div>`;
  let sel=null, done=0, errs=0;
  const all=[...box.querySelectorAll('.pair')];
  all.forEach(el=>el.onclick=()=>{
    if(G.locked||el.classList.contains('done')) return;
    const side = el.parentElement.id;
    if(!sel){ sel=el; el.classList.add('sel'); Snd.click(); return; }
    if(sel===el){ el.classList.remove('sel'); sel=null; return; }
    if(sel.parentElement.id===side){ sel.classList.remove('sel'); sel=el; el.classList.add('sel'); Snd.click(); return; }
    if(sel.dataset.i===el.dataset.i){
      sel.classList.remove('sel'); sel.classList.add('done'); el.classList.add('done');
      Snd.star(); sel=null; done++;
      if(done===c.pairs.length){ G.locked=true; stopTimer(); finish(errs<=1, c, PTS.match, errs?`أخطأت ${errs} مرة قبل ما تكمّل.`:''); }
    } else {
      errs++; Snd.wrong(); el.classList.add('err'); sel.classList.add('err');
      const a=sel, b=el; sel=null;
      setTimeout(()=>{ a.classList.remove('err','sel'); b.classList.remove('err'); },500);
    }
  });
}

/* --- قرار في القصة --- */
function renderChoice(box,c){
  box.innerHTML = `<h3>🤔 وقفة تفكير</h3><p style="font-size:1.08rem">${esc(c.q)}</p>`;
  const list = shuffle(c.options.map(o=>({label:o.t, ok:!!o.ok, fb:o.fb})));
  optButtons(box, list, (o,b,w)=>{
    w.querySelectorAll('.opt').forEach((x,i)=>{ if(list[i].ok) x.classList.add('ok'); });
    if(!o.ok) b.classList.add('bad');
    finish(o.ok, {explain:o.fb}, PTS.choice);
  });
}

/* ===================== إنهاء التحدي ===================== */
function finish(ok, c, base, note){
  const p=G.players[G.turn%G.players.length];
  let pts=0, bonus=0;
  if(ok){ bonus = Math.max(0, Math.round(G.timeLeft/QTIME*TIME_BONUS)); pts = base+bonus; p.score+=pts; p.right++; Snd.correct(); }
  else { p.wrong++; Snd.wrong(); }
  G.stageEarned += pts;

  const last = G.ch >= G.chal.length-1;
  $('#after').innerHTML = `
    <div class="fb ${ok?'ok':'bad'} pop">
      <b>${ok?'✅ إجابة صحيحة!':'❌ مش مظبوط'}</b>
      ${ok?` <span class="muted">(+${base}${bonus?` نقطة، +${bonus} سرعة`:' نقطة'})</span>`:''}
      ${note?`<div class="muted" style="font-size:.9rem">${esc(note)}</div>`:''}
      ${c.explain?`<div style="margin-top:8px">${esc(c.explain)}</div>`:''}
      ${c.ayah?ayahHTML(c.ayah):''}
    </div>
    <div class="center" style="margin-top:12px"><button class="btn" id="nx">${last?'إنهاء المرحلة ✓':'التحدي التالي ◀'}</button></div>`;
  $('#nx').onclick=()=>{ Snd.click(); G.ch++; G.turn++; screenPlay(); };
  $('#after').scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ===================== نهاية المرحلة ===================== */
function screenStageEnd(){
  stopTimer();
  const pct = G.stageMax? G.stageEarned/G.stageMax : 0;
  const stars = pct>=.85?3 : pct>=.6?2 : pct>=.35?1 : 0;
  const st=curStage(), solo=!!st.solo;
  if(solo){ G.sstars[G.solo]=Math.max(G.sstars[G.solo]||0, stars); saveSurahStars(); }
  else { G.stars[G.stage]=Math.max(G.stars[G.stage], stars);
         if(G.stage>=G.unlocked) G.unlocked=G.stage+1; }
  if(stars>=2) confetti();
  Snd.win();
  const msg = stars===3?'ممتاز! أداء بطل حقيقي 🌟' : stars===2?'كويس جدًا! كمان شوية وتوصل للتلاتة ⭐' :
              stars===1?'بداية كويسة — جرّب تاني وهتتحسّن 💪' : 'ماتزعلش، راجع الآيات وحاول تاني 🤍';
  app.innerHTML = `
  <div class="card fade center">
    <div style="font-size:3.2rem">${st.emoji}</div>
    <h2>خلّصت ${solo?'':'مرحلة '}«${esc(st.title)}»</h2>
    <div style="font-size:2.6rem;color:var(--gold);letter-spacing:8px">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <p><b>${G.stageEarned}</b> نقطة من ${G.stageMax}</p>
    <p class="muted">${msg}</p>
  </div>
  <div class="card fade">
    <h3>النقاط الحالية</h3>
    <table>${G.players.slice().sort((a,b)=>b.score-a.score).map(p=>
      `<tr><td>${esc(p.name)}</td><td><b>${p.score}</b></td><td class="muted">✔ ${p.right} · ✘ ${p.wrong}</td></tr>`).join('')}</table>
  </div>
  <div class="row">
    <button class="btn" id="nx">${solo ? '📖 سورة تانية'
        : (G.unlocked<G.surah.stages.length?'المرحلة التالية ◀':'النتيجة النهائية 🎉')}</button>
    <button class="btn ghost" id="rp">🔄 ${solo?'أعِد السورة':'أعِد المرحلة'}</button>
    <button class="btn ghost" id="mp">🗺️ الخريطة</button>
  </div>`;
  $('#nx').onclick=()=>{ Snd.click();
    if(solo){ screenPicker(); }
    else if(G.unlocked<G.surah.stages.length){ loadStage(G.unlocked); screenStory(); }
    else screenFinal(); };
  $('#rp').onclick=()=>{ Snd.click(); solo?loadSolo(G.solo):loadStage(G.stage); screenStory(); };
  $('#mp').onclick=()=>{ Snd.click(); screenMap(); };
}

/* ===================== النهاية ===================== */
function screenFinal(){
  stopTimer(); confetti(); Snd.win();
  const totStars=G.stars.reduce((a,b)=>a+b,0), maxStars=G.surah.stages.length*3;
  const rank=G.players.slice().sort((a,b)=>b.score-a.score);
  const badge = totStars>=maxStars*0.9 ? {t:'مُدَّكِر ذهبي',e:'🏆'} :
                totStars>=maxStars*0.7 ? {t:'حافظ نجيب',e:'🥈'} :
                totStars>=maxStars*0.4 ? {t:'مجتهد واعد',e:'🥉'} : {t:'بداية الطريق',e:'🌱'};
  const d=new Date(), date=`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  if(!G.saved){ G.saved=true; saveBoard(G.surah.id, rank.map(p=>({name:p.name, score:p.score, stars:totStars, date}))); }
  app.innerHTML = `
  <div class="card fade center">
    <div style="font-size:4rem">${badge.e}</div>
    <h1 style="color:var(--gold)">${esc(badge.t)}</h1>
    <p>أنهيت رحلة <b>${esc(G.surah.name)}</b> كاملة!</p>
    <div style="font-size:1.6rem;color:var(--gold);letter-spacing:5px">⭐ ${totStars} / ${maxStars}</div>
  </div>
  <div class="card fade">
    <h3>الترتيب النهائي</h3>
    <table><tr><th>#</th><th>اللاعب</th><th>النقاط</th><th>صح</th><th>خطأ</th></tr>
    ${rank.map((p,i)=>`<tr><td>${['🥇','🥈','🥉'][i]||(i+1)}</td><td>${esc(p.name)}</td><td><b>${p.score}</b></td><td>${p.right}</td><td>${p.wrong}</td></tr>`).join('')}</table>
  </div>
  <div class="card fade center">
    <div class="ayah">وَلَقَدْ يَسَّرْنَا ٱلْقُرْءَانَ لِلذِّكْرِ فَهَلْ مِن مُّدَّكِرٍۢ<span class="num">17</span></div>
  </div>
  <div class="row">
    <button class="btn" id="ag">🔁 العب تاني</button>
    <button class="btn ghost" id="bd">🏆 سجل الأبطال</button>
    <button class="btn ghost" id="hm">🏠 الرئيسية</button>
  </div>`;
  $('#ag').onclick=()=>{ Snd.click(); newGame(G.surah, G.players.map(p=>p.name)); screenMap(); };
  $('#bd').onclick=()=>{ Snd.click(); screenBoard(G.surah); };
  $('#hm').onclick=()=>{ Snd.click(); screenHome(); };
}

/* ===================== بدء ===================== */
document.addEventListener('click', ()=>Snd.init(), {once:true});
screenHome();
</script>
</body>
</html>
