/* ===================== إعدادات عامة ===================== */
const PTS = {mcq:10, tf:10, blank:10, order:20, match:20, choice:10};
const QTIME = 35;           // ثواني المؤقت لكل تحدٍّ
const TIME_BONUS = 5;       // أقصى نقاط إضافية للسرعة
const LS = 'quran_game_v1';

/* ===================== أدوات ===================== */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const ayahRec = (s,n) => s.ayat.find(a=>a.n===n) || {t:'', n:n};
const ayahOf = (s,n) => ayahRec(s,n).t;
const tokens = (s,n) => ayahOf(s,n).split(' ').filter(x=>x.length);
const rnd = a => a[Math.floor(Math.random()*a.length)];

/* تجريد التشكيل وتوحيد الحروف — للمقارنة فقط، العرض دائمًا بالنص الأصلي */
const MARKS = /[ً-ٰٟۖ-ۭـ۟۠-ۨ]/g;
const norm = t => String(t).replace(MARKS,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي')
                  .replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/[^ء-ي]/g,'');
const isMark = t => norm(t).length===0;
/* الآيات التي تنتمي لسورة داخل رحلة مجمّعة (المعرّف = رقم السورة×1000 + رقم الآية) */
const surahAyat = (e,sn) => e.ayat.filter(a => Math.floor(a.n/1000)===sn);
/* هيكل الكلمة: بدون سوابق (و/ف/ب/ك/ل/ال) وبدون حروف المدّ — للمطابقة المرنة فقط */
const skel = t => norm(t).replace(/^(وال|فال|بال|كال|لل|ال|و|ف|ب|ك|ل)/,'').replace(/[اويء]/g,'');
/* يبحث عن الكلمة داخل نص السورة ويرجّع رسمها العثماني الصحيح كما في المصحف */
function exactWord(e, sn, w){
  if(!norm(w)) return w;
  const list = sn ? surahAyat(e,sn) : e.ayat;
  const all = []; list.forEach(a => a.t.split(' ').forEach(k => { if(!isMark(k)) all.push(k); }));
  const t = norm(w);            for(const k of all) if(norm(k)===t) return k;   // مطابقة تامة
  const bare = x => norm(x).replace(/[اويء]/g,'');
  const want = new Set([skel(w), bare(w)].filter(Boolean));
  for(const k of all){ if(want.has(skel(k)) || want.has(bare(k))) return k; }    // مطابقة مرنة
  return w;
}
/* اسم السورة لآية معيّنة (فارغ في الرحلات ذات السورة الواحدة) */
const ayahSrc = (s,n) => { const r=ayahRec(s,n); return r.s ? `سورة ${r.s} · آية ${r.a}` : ''; };
const ayahNo  = (s,n) => { const r=ayahRec(s,n); return r.a!=null ? r.a : r.n; };

/* ============ توليد التحديات تلقائيًا من نص السور ============ */
function poolWords(list){
  const out=[]; list.forEach(a=>a.t.split(' ').forEach(t=>{ if(!isMark(t) && norm(t).length>=3) out.push(t); }));
  return out;
}
function autoBlank(entry, list){
  const cand = list.filter(a => a.t.split(' ').filter(t=>!isMark(t)).length>=3);
  if(!cand.length) return null;
  const a = rnd(cand), tk = a.t.split(' ');
  const idxs = tk.map((t,i)=>i).filter(i => !isMark(tk[i]) && norm(tk[i]).length>=3);
  if(!idxs.length) return null;
  const idx = rnd(idxs), ans = tk[idx], na = norm(ans), last = na.slice(-1);
  const take = pool => {
    const seen=new Set([na]), out=[];
    for(const t of shuffle(pool)){ const k=norm(t); if(seen.has(k)) continue; seen.add(k); out.push(t); if(out.length===3) break; }
    return out;
  };
  /* البدائل من كلمات باقي آيات السورة — نستبعد كلمات الآية المعروضة نفسها */
  const here = new Set(tk.map(norm));
  const pool = poolWords(list.filter(x => x.n!==a.n)).filter(t => !here.has(norm(t)));
  let opts = take(pool.filter(t => norm(t).slice(-1)===last));
  if(opts.length<3) opts = take(pool.concat(opts));
  if(opts.length<3) opts = take(poolWords(list));
  if(opts.length<3) opts = take(poolWords(entry.ayat));
  if(opts.length<3) return null;
  return {type:'blank', ayah:a.n, idx, options:opts, explain:'الكلمة كما جاءت في المصحف تمامًا — راجع الآية كاملة فوق.'};
}
function autoOrder(list){
  if(list.length<3) return null;
  for(let t=0; t<15; t++){
    const k = Math.min(list.length, Math.random()<.5?3:4);
    const st = Math.floor(Math.random()*(list.length-k+1));
    const win = list.slice(st, st+k);
    /* بعض السور فيها آيات متطابقة الألفاظ (مثل الكافرون) — نتجنّبها لأن ترتيبها غير قابل للتمييز */
    if(new Set(win.map(a=>a.t)).size === win.length)
      return {type:'order', ayat:win.map(a=>a.n), explain:'الترتيب الصحيح هو ترتيب الآيات في المصحف.'};
  }
  return null;
}
function autoWhichSurah(entry, stage){
  const names = stage.surahs.map(sn => (entry.info[sn]||{}).nm || ('سورة '+sn));
  if(names.length<3) return null;
  const i = Math.floor(Math.random()*stage.surahs.length);
  const list = surahAyat(entry, stage.surahs[i]).filter(a => a.t.split(' ').filter(t=>!isMark(t)).length>=3);
  if(!list.length) return null;
  const a = rnd(list);
  /* noSrc: نخفي اسم السورة تحت الآية وإلا كانت الإجابة مكشوفة */
  return {type:'mcq', q:'هذه الآية من أي سورة؟', show:a.n, noSrc:true, options:names.slice(), answer:i,
          explain:`هي الآية ${a.a} من سورة ${names[i]}.`, ayah:a.n};
}
function genStage(entry, stage){
  if(stage.challenges) return stage.challenges;
  const out=[], inf=entry.info||{}, bank=[];
  stage.surahs.forEach(sn=>{
    const I = inf[sn]||{}, list = surahAyat(entry, sn), block = [];
    if(I.q && I.q.length){ const x = rnd(I.q);
      block.push({type:'mcq', q:`﴿${I.nm}﴾ ${x.q}`, options:x.o.slice(), answer:x.a, explain:x.e, ayah:x.y}); }
    const b = autoBlank(entry, list); if(b) block.push(b);
    const o = autoOrder(list);        if(o) block.push(o);
    /* ترتيب عشوائي داخل كل سورة حتى لا يقع نفس نوع التحدي على نفس اللاعب كل مرة */
    out.push(...shuffle(block));
    if(I.w) I.w.forEach(p => bank.push([exactWord(entry, sn, p[0]), p[1]]));
  });
  const ws = autoWhichSurah(entry, stage); if(ws) out.push(ws);
  const mix = shuffle(bank);
  for(let i=0; i+4<=mix.length && i<8; i+=4)
    out.push({type:'match', pairs:mix.slice(i,i+4), explain:'كلمات من سور هذه المرحلة بمعانيها.'});
  return out;
}
/* تحديات سورة واحدة بمفردها (وضع «اختر سورة») */
function genSolo(entry, sn){
  const I = entry.info[sn]||{}, list = surahAyat(entry, sn), out = [];
  (I.q||[]).forEach(x => out.push({type:'mcq', q:x.q, options:x.o.slice(), answer:x.a, explain:x.e, ayah:x.y}));
  const seenB = new Set();
  for(let t=0; t<20 && seenB.size<3; t++){
    const b = autoBlank(entry, list); if(!b) break;
    const k = b.ayah+':'+b.idx; if(seenB.has(k)) continue; seenB.add(k); out.push(b);
  }
  const seenO = new Set();
  for(let t=0; t<20 && seenO.size<2; t++){
    const o = autoOrder(list); if(!o) break;
    const k = o.ayat.join(','); if(seenO.has(k)) continue; seenO.add(k); out.push(o);
  }
  const mix = shuffle((I.w||[]).map(p => [exactWord(entry, sn, p[0]), p[1]]));
  for(let i=0; i+4<=mix.length && i<8; i+=4)
    out.push({type:'match', pairs:mix.slice(i,i+4), explain:`كلمات من سورة ${I.nm||''} بمعانيها.`});
  return shuffle(out);
}

/* ===================== الصوت ===================== */
const Snd = {
  on:true, ctx:null,
  init(){ if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
          if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  tone(f,at,dur,type='sine',vol=.14){
    if(!this.on||!this.ctx) return;
    const t0=this.ctx.currentTime+at, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t0);
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(this.ctx.destination); o.start(t0); o.stop(t0+dur+.05);
  },
  click(){ this.tone(660,0,.06,'triangle',.07); },
  correct(){ [523.25,659.25,783.99].forEach((f,i)=>this.tone(f,i*.08,.22,'sine',.13)); },
  wrong(){ this.tone(196,0,.16,'sawtooth',.09); this.tone(147,.14,.28,'sawtooth',.09); },
  star(){ [880,1174.7].forEach((f,i)=>this.tone(f,i*.07,.18,'triangle',.1)); },
  win(){ [523.25,587.33,659.25,783.99,1046.5].forEach((f,i)=>this.tone(f,i*.11,.35,'sine',.13)); },
  tick(){ this.tone(1200,0,.03,'square',.03); }
};

/* ===================== حالة اللعبة ===================== */
let G = {};
function newGame(surah, players){
  G = { surah, players: players.map(n=>({name:n, score:0, right:0, wrong:0})),
        turn:0, stage:0, ch:0, chal:[], stars:new Array(surah.stages.length).fill(0),
        unlocked:0, stageEarned:0, stageMax:0, timeLeft:QTIME, tId:null, locked:false,
        solo:null, soloStage:null, sstars:loadSurahStars(surah.id) };
}
/* نجوم كل سورة على حدة — محفوظة في المتصفح */
function loadSurahStars(id){ try{ return JSON.parse(localStorage.getItem(LS+'_sur_'+id)||'{}'); }catch(e){ return {}; } }
function saveSurahStars(){ try{ localStorage.setItem(LS+'_sur_'+G.surah.id, JSON.stringify(G.sstars)); }catch(e){} }

const curStage = () => G.stage<0 ? G.soloStage : G.surah.stages[G.stage];

/* تجهيز مرحلة: يولّد تحدياتها (أو يأخذ المكتوبة يدويًا) ويحسب أقصى نقاط */
function loadStage(i){
  G.solo = null; G.stage = i; G.ch = 0; G.stageEarned = 0;
  G.chal = genStage(G.surah, G.surah.stages[i]);
  G.stageMax = G.chal.reduce((a,c)=>a+(PTS[c.type]||10)+TIME_BONUS, 0);
  G.turn++;   /* إزاحة بداية الدور كل مرحلة حتى لا يبدأ نفس اللاعب دائمًا */
}
/* تجهيز سورة واحدة في وضع «اختر سورة» */
function loadSolo(sn){
  const I = G.surah.info[sn]||{};
  G.solo = sn; G.stage = -1; G.ch = 0; G.stageEarned = 0;
  G.soloStage = { title:'سورة '+(I.nm||sn), emoji:'📖', surahs:[sn], solo:true,
                  story:[I.ab||''].filter(Boolean) };
  G.chal = genSolo(G.surah, sn);
  G.stageMax = G.chal.reduce((a,c)=>a+(PTS[c.type]||10)+TIME_BONUS, 0);
  G.turn++;
}

/* ===================== المؤقّت ===================== */
function stopTimer(){ if(G.tId){ clearInterval(G.tId); G.tId=null; } }
function startTimer(){
  stopTimer(); G.timeLeft=QTIME;
  const el=$('#tbar'); if(!el) return;
  G.tId=setInterval(()=>{
    G.timeLeft--;
    const bar=$('#tbar'); if(!bar){stopTimer();return;}
    bar.style.width=Math.max(0,G.timeLeft/QTIME*100)+'%';
    const box=$('#tbox'); if(box) box.classList.toggle('low', G.timeLeft<=10);
    if(G.timeLeft<=5 && G.timeLeft>0) Snd.tick();
    if(G.timeLeft<=0) stopTimer();
  },1000);
}

/* ===================== شاشة اللعب ===================== */
function screenPlay(){
  const st=curStage(), c=G.chal[G.ch];
  if(!c){ return screenStageEnd(); }
  G.locked=false;
  const p=G.players[G.turn%G.players.length];
  const prog=Math.round(G.ch/G.chal.length*100);
  const multi=G.players.length>1;

  app.innerHTML = `
  <div class="hdr">
    <span class="pill">${st.emoji} ${esc(st.title)}</span>
    <div class="row" style="gap:6px">
      <span class="pill">${G.ch+1} / ${G.chal.length}</span>
      ${multi?`<span class="pill turn">🎯 دور: ${esc(p.name)}</span>`:`<span class="pill">🏅 ${p.score}</span>`}
    </div>
  </div>
  <div class="bar"><i style="width:${prog}%"></i></div>
  <div class="timer" id="tbox"><i id="tbar" style="width:100%"></i></div>
  <div class="card fade" id="cbox"></div>
  <div id="after"></div>`;

  const box=$('#cbox');
  ({mcq:renderMCQ, tf:renderTF, blank:renderBlank, order:renderOrder, match:renderMatch, choice:renderChoice}[c.type])(box, c);
  startTimer();
}

function ayahHTML(n, noSrc){
  const src = noSrc ? '' : ayahSrc(G.surah,n);
  return `<div class="ayah">${esc(ayahOf(G.surah,n))}${noSrc?'':`<span class="num">${ayahNo(G.surah,n)}</span>`}</div>`
       + (src?`<div class="src">${esc(src)}</div>`:'');
}

function optButtons(box, list, onPick){
  const wrap=document.createElement('div');
  list.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt'; b.innerHTML=esc(o.label);
    b.onclick=()=>{ if(G.locked) return; G.locked=true; stopTimer();
      wrap.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      onPick(o,b,wrap); };
    wrap.appendChild(b);
  });
  box.appendChild(wrap); return wrap;
}

/* --- اختيار من متعدد --- */
function renderMCQ(box,c){
  box.innerHTML = `<h3>${esc(c.q)}</h3>` + (c.show?ayahHTML(c.show, c.noSrc):'');
  const list = shuffle(c.options.map((t,i)=>({label:t, ok:i===c.answer})));
  optButtons(box, list, (o,b,w)=>{
    w.querySelectorAll('.opt').forEach((x,i)=>{ if(list[i].ok) x.classList.add('ok'); });
    if(!o.ok){ b.classList.add('bad'); b.classList.add('shake'); }
    finish(o.ok, c, PTS.mcq);
  });
}

/* --- صح أم خطأ --- */
function renderTF(box,c){
  box.innerHTML = `<h3>صح أم خطأ؟</h3><p style="font-size:1.08rem">${esc(c.q)}</p>`;
  const list=[{label:'✅ صح', ok:c.answer===true},{label:'❌ خطأ', ok:c.answer===false}];
  optButtons(box, list, (o,b,w)=>{
    w.querySelectorAll('.opt').forEach((x,i)=>{ if(list[i].ok) x.classList.add('ok'); });
    if(!o.ok){ b.classList.add('bad'); b.classList.add('shake'); }
    finish(o.ok, c, PTS.tf);
  });
}

/* --- الكلمة الناقصة --- */
function renderBlank(box,c){
  const tk = tokens(G.surah, c.ayah);
  const right = tk[c.idx] || '';
  const view = tk.map((w,i)=> i===c.idx ? `<span class="blankbox" id="bk_">……</span>` : esc(w)).join(' ');
  const src = ayahSrc(G.surah, c.ayah);
  box.innerHTML = `<h3>أكمل الكلمة الناقصة</h3>
    <div class="ayah">${view}<span class="num">${ayahNo(G.surah,c.ayah)}</span></div>`
    + (src?`<div class="src">${esc(src)}</div>`:'');
  const list = shuffle([{label:right, ok:true}].concat(c.options.map(t=>({label:t, ok:false}))));
  optButtons(box, list, (o,b,w)=>{
    const sp=$('#bk_'); if(sp){ sp.textContent=right; sp.classList.add('filled'); }
    w.querySelectorAll('.opt').forEach((x,i)=>{ if(list[i].ok) x.classList.add('ok'); });
    if(!o.ok){ b.classList.add('bad'); b.classList.add('shake'); }
    finish(o.ok, c, PTS.blank);
  });
}

/* --- ترتيب الآيات --- */
function renderOrder(box,c){
  const want=c.ayat.slice();
  let picked=[];
  const srcAll = ayahSrc(G.surah, want[0]).split(' · ')[0];
  box.innerHTML = `<h3>رتّب الآيات بترتيبها الصحيح${srcAll?` في ${esc(srcAll)}`:' في السورة'}</h3>
    <div class="slots" id="slots"><p class="muted center" style="margin:8px">اضغط على الآيات بالترتيب…</p></div>
    <div id="pool"></div>
    <div class="center" style="margin-top:8px"><button class="btn" id="chk" disabled>تأكيد الترتيب</button></div>`;
  const pool=$('#pool'), slots=$('#slots'), chk=$('#chk');
  const draw=()=>{
    slots.innerHTML = picked.length? picked.map((n,i)=>
      `<div class="slot"><span>${i+1}. ${esc(ayahOf(G.surah,n))}</span><span class="rm" data-i="${i}">✕</span></div>`).join('')
      : '<p class="muted center" style="margin:8px">اضغط على الآيات بالترتيب…</p>';
    slots.querySelectorAll('.rm').forEach(x=>x.onclick=()=>{ if(G.locked)return; Snd.click(); picked.splice(+x.dataset.i,1); draw(); });
    pool.querySelectorAll('.opt').forEach(b=>{ b.style.display = picked.includes(+b.dataset.n) ? 'none':'block'; });
    chk.disabled = picked.length!==want.length;
  };
  pool.innerHTML = shuffle(want).map(n=>
    `<button class="opt" data-n="${n}" style="font-family:var(--quran);font-size:1.25rem;color:#ffeec2">${esc(ayahOf(G.surah,n))}</button>`).join('');
  pool.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(G.locked)return; Snd.click(); picked.push(+b.dataset.n); draw(); });
  draw();
  chk.onclick=()=>{
    if(G.locked) return; G.locked=true; stopTimer();
    const ok = picked.every((n,i)=>n===want[i]);
    pool.querySelectorAll('.opt').forEach(b=>b.disabled=true); chk.disabled=true;
    slots.style.borderColor = ok? 'var(--ok)':'var(--bad)';
    if(!ok){ slots.classList.add('shake');
      slots.insertAdjacentHTML('beforeend', `<p class="center" style="color:var(--gold);margin:10px 0 0">الترتيب الصحيح حسب أرقام الآيات: ${want.map(n=>ayahNo(G.surah,n)).join(' ← ')}</p>`); }
    finish(ok, c, PTS.order);
  };
}

/* --- توصيل كلمة بمعناها --- */
function renderMatch(box,c){
  const L = shuffle(c.pairs.map((p,i)=>({t:p[0], i}))), R = shuffle(c.pairs.map((p,i)=>({t:p[1], i})));
  box.innerHTML = `<h3>وصّل كل كلمة بمعناها</h3>
    <div class="pairs">
      <div id="colL">${L.map(x=>`<div class="pair q" data-i="${x.i}">${esc(x.t)}</div>`).join('')}</div>
      <div id="colR">${R.map(x=>`<div class="pair" data-i="${x.i}">${esc(x.t)}</div>`).join('')}</div>
    </div>`;
  let sel=null, done=0, errs=0;
  const all=[...box.querySelectorAll('.pair')];
  all.forEach(el=>el.onclick=()=>{
    if(G.locked||el.classList.contains('done')) return;
    const side = el.parentElement.id;
    if(!sel){ sel=el; el.classList.add('sel'); Snd.click(); return; }
    if(sel===el){ el.classList.remove('sel'); sel=null; return; }
    if(sel.parentElement.id===side){ sel.classList.remove('sel'); sel=el; el.classList.add('sel'); Snd.click(); return; }
    if(sel.dataset.i===el.dataset.i){
      sel.classList.remove('sel'); sel.classList.add('done'); el.classList.add('done');
      Snd.star(); sel=null; done++;
      if(done===c.pairs.length){ G.locked=true; stopTimer(); finish(errs<=1, c, PTS.match, errs?`أخطأت ${errs} مرة قبل ما تكمّل.`:''); }
    } else {
      errs++; Snd.wrong(); el.classList.add('err'); sel.classList.add('err');
      const a=sel, b=el; sel=null;
      setTimeout(()=>{ a.classList.remove('err','sel'); b.classList.remove('err'); },500);
    }
  });
}

/* --- قرار في القصة --- */
function renderChoice(box,c){
  box.innerHTML = `<h3>🤔 وقفة تفكير</h3><p style="font-size:1.08rem">${esc(c.q)}</p>`;
  const list = shuffle(c.options.map(o=>({label:o.t, ok:!!o.ok, fb:o.fb})));
  optButtons(box, list, (o,b,w)=>{
    w.querySelectorAll('.opt').forEach((x,i)=>{ if(list[i].ok) x.classList.add('ok'); });
    if(!o.ok) b.classList.add('bad');
    finish(o.ok, {explain:o.fb}, PTS.choice);
  });
}

/* ===================== إنهاء التحدي ===================== */
function finish(ok, c, base, note){
  const p=G.players[G.turn%G.players.length];
  let pts=0, bonus=0;
  if(ok){ bonus = Math.max(0, Math.round(G.timeLeft/QTIME*TIME_BONUS)); pts = base+bonus; p.score+=pts; p.right++; Snd.correct(); }
  else { p.wrong++; Snd.wrong(); }
  G.stageEarned += pts;

  const last = G.ch >= G.chal.length-1;
  $('#after').innerHTML = `
    <div class="fb ${ok?'ok':'bad'} pop">
      <b>${ok?'✅ إجابة صحيحة!':'❌ مش مظبوط'}</b>
      ${ok?` <span class="muted">(+${base}${bonus?` نقطة، +${bonus} سرعة`:' نقطة'})</span>`:''}
      ${note?`<div class="muted" style="font-size:.9rem">${esc(note)}</div>`:''}
      ${c.explain?`<div style="margin-top:8px">${esc(c.explain)}</div>`:''}
      ${c.ayah?ayahHTML(c.ayah):''}
    </div>
    <div class="center" style="margin-top:12px"><button class="btn" id="nx">${last?'إنهاء المرحلة ✓':'التحدي التالي ◀'}</button></div>`;
  $('#nx').onclick=()=>{ Snd.click(); G.ch++; G.turn++; screenPlay(); };
  $('#after').scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ===================== نهاية المرحلة ===================== */
function screenStageEnd(){
  stopTimer();
  const pct = G.stageMax? G.stageEarned/G.stageMax : 0;
  const stars = pct>=.85?3 : pct>=.6?2 : pct>=.35?1 : 0;
  const st=curStage(), solo=!!st.solo;
  if(solo){ G.sstars[G.solo]=Math.max(G.sstars[G.solo]||0, stars); saveSurahStars(); }
  else { G.stars[G.stage]=Math.max(G.stars[G.stage], stars);
         if(G.stage>=G.unlocked) G.unlocked=G.stage+1; }
  if(stars>=2) confetti();
  Snd.win();
  const msg = stars===3?'ممتاز! أداء بطل حقيقي 🌟' : stars===2?'كويس جدًا! كمان شوية وتوصل للتلاتة ⭐' :
              stars===1?'بداية كويسة — جرّب تاني وهتتحسّن 💪' : 'ماتزعلش، راجع الآيات وحاول تاني 🤍';
  app.innerHTML = `
  <div class="card fade center">
    <div style="font-size:3.2rem">${st.emoji}</div>
    <h2>خلّصت ${solo?'':'مرحلة '}«${esc(st.title)}»</h2>
    <div style="font-size:2.6rem;color:var(--gold);letter-spacing:8px">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <p><b>${G.stageEarned}</b> نقطة من ${G.stageMax}</p>
    <p class="muted">${msg}</p>
  </div>
  <div class="card fade">
    <h3>النقاط الحالية</h3>
    <table>${G.players.slice().sort((a,b)=>b.score-a.score).map(p=>
      `<tr><td>${esc(p.name)}</td><td><b>${p.score}</b></td><td class="muted">✔ ${p.right} · ✘ ${p.wrong}</td></tr>`).join('')}</table>
  </div>
  <div class="row">
    <button class="btn" id="nx">${solo ? '📖 سورة تانية'
        : (G.unlocked<G.surah.stages.length?'المرحلة التالية ◀':'النتيجة النهائية 🎉')}</button>
    <button class="btn ghost" id="rp">🔄 ${solo?'أعِد السورة':'أعِد المرحلة'}</button>
    <button class="btn ghost" id="mp">🗺️ الخريطة</button>
  </div>`;
  $('#nx').onclick=()=>{ Snd.click();
    if(solo){ screenPicker(); }
    else if(G.unlocked<G.surah.stages.length){ loadStage(G.unlocked); screenStory(); }
    else screenFinal(); };
  $('#rp').onclick=()=>{ Snd.click(); solo?loadSolo(G.solo):loadStage(G.stage); screenStory(); };
  $('#mp').onclick=()=>{ Snd.click(); screenMap(); };
}

/* ===================== النهاية ===================== */
function screenFinal(){
  stopTimer(); confetti(); Snd.win();
  const totStars=G.stars.reduce((a,b)=>a+b,0), maxStars=G.surah.stages.length*3;
  const rank=G.players.slice().sort((a,b)=>b.score-a.score);
  const badge = totStars>=maxStars*0.9 ? {t:'مُدَّكِر ذهبي',e:'🏆'} :
                totStars>=maxStars*0.7 ? {t:'حافظ نجيب',e:'🥈'} :
                totStars>=maxStars*0.4 ? {t:'مجتهد واعد',e:'🥉'} : {t:'بداية الطريق',e:'🌱'};
  const d=new Date(), date=`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
  if(!G.saved){ G.saved=true; saveBoard(G.surah.id, rank.map(p=>({name:p.name, score:p.score, stars:totStars, date}))); }
  app.innerHTML = `
  <div class="card fade center">
    <div style="font-size:4rem">${badge.e}</div>
    <h1 style="color:var(--gold)">${esc(badge.t)}</h1>
    <p>أنهيت رحلة <b>${esc(G.surah.name)}</b> كاملة!</p>
    <div style="font-size:1.6rem;color:var(--gold);letter-spacing:5px">⭐ ${totStars} / ${maxStars}</div>
  </div>
  <div class="card fade">
    <h3>الترتيب النهائي</h3>
    <table><tr><th>#</th><th>اللاعب</th><th>النقاط</th><th>صح</th><th>خطأ</th></tr>
    ${rank.map((p,i)=>`<tr><td>${['🥇','🥈','🥉'][i]||(i+1)}</td><td>${esc(p.name)}</td><td><b>${p.score}</b></td><td>${p.right}</td><td>${p.wrong}</td></tr>`).join('')}</table>
  </div>
  <div class="card fade center">
    <div class="ayah">وَلَقَدْ يَسَّرْنَا ٱلْقُرْءَانَ لِلذِّكْرِ فَهَلْ مِن مُّدَّكِرٍۢ<span class="num">17</span></div>
  </div>
  <div class="row">
    <button class="btn" id="ag">🔁 العب تاني</button>
    <button class="btn ghost" id="bd">🏆 سجل الأبطال</button>
    <button class="btn ghost" id="hm">🏠 الرئيسية</button>
  </div>`;
  $('#ag').onclick=()=>{ Snd.click(); newGame(G.surah, G.players.map(p=>p.name)); screenMap(); };
  $('#bd').onclick=()=>{ Snd.click(); screenBoard(G.surah); };
  $('#hm').onclick=()=>{ Snd.click(); screenHome(); };
}

/* ===================== بدء ===================== */
document.addEventListener('click', ()=>Snd.init(), {once:true});
screenHome();
</script>
