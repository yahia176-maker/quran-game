      {n:67005,s:"الملك",a:5,t:"وَلَقَدْ زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنْيَا بِمَصَٰبِيحَ وَجَعَلْنَٰهَا رُجُومًۭا لِّلشَّيَٰطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ ٱلسَّعِيرِ"},
      {n:67006,s:"الملك",a:6,t:"وَلِلَّذِينَ كَفَرُوا۟ بِرَبِّهِمْ عَذَابُ جَهَنَّمَ ۖ وَبِئْسَ ٱلْمَصِيرُ"},
      {n:67007,s:"الملك",a:7,t:"إِذَآ أُلْقُوا۟ فِيهَا سَمِعُوا۟ لَهَا شَهِيقًۭا وَهِىَ تَفُورُ"},
      {n:67008,s:"الملك",a:8,t:"تَكَادُ تَمَيَّزُ مِنَ ٱلْغَيْظِ ۖ كُلَّمَآ أُلْقِىَ فِيهَا فَوْجٌۭ سَأَلَهُمْ خَزَنَتُهَآ أَلَمْ يَأْتِكُمْ نَذِيرٌۭ"},
      {n:67009,s:"الملك",a:9,t:"قَالُوا۟ بَلَىٰ قَدْ جَآءَنَا نَذِيرٌۭ فَكَذَّبْنَا وَقُلْنَا مَا نَزَّلَ ٱللَّهُ مِن شَىْءٍ إِنْ أَنتُمْ إِلَّا فِى ضَلَٰلٍۢ كَبِيرٍۢ"},
      {n:67010,s:"الملك",a:10,t:"وَقَالُوا۟ لَوْ كُنَّا نَسْمَعُ أَوْ نَعْقِلُ مَا كُنَّا فِىٓ أَصْحَٰبِ ٱلسَّعِيرِ"},
      {n:67011,s:"الملك",a:11,t:"فَٱعْتَرَفُوا۟ بِذَنۢبِهِمْ فَسُحْقًۭا لِّأَصْحَٰبِ ٱلسَّعِيرِ"},
      {n:67012,s:"الملك",a:12,t:"إِنَّ ٱلَّذِينَ يَخْشَوْنَ رَبَّهُم بِٱلْغَيْبِ لَهُم مَّغْفِرَةٌۭ وَأَجْرٌۭ كَبِيرٌۭ"},
      {n:67013,s:"الملك",a:13,t:"وَأَسِرُّوا۟ قَوْلَكُمْ أَوِ ٱجْهَرُوا۟ بِهِۦٓ ۖ إِنَّهُۥ عَلِيمٌۢ بِذَاتِ ٱلصُّدُورِ"},
      {n:67014,s:"الملك",a:14,t:"أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ ٱللَّطِيفُ ٱلْخَبِيرُ"},
      {n:67015,s:"الملك",a:15,t:"هُوَ ٱلَّذِى جَعَلَ لَكُمُ ٱلْأَرْضَ ذَلُولًۭا فَٱمْشُوا۟ فِى مَنَاكِبِهَا وَكُلُوا۟ مِن رِّزْقِهِۦ ۖ وَإِلَيْهِ ٱلنُّشُورُ"},
      {n:67016,s:"الملك",a:16,t:"ءَأَمِنتُم مَّن فِى ٱلسَّمَآءِ أَن يَخْسِفَ بِكُمُ ٱلْأَرْضَ فَإِذَا هِىَ تَمُورُ"},
      {n:67017,s:"الملك",a:17,t:"أَمْ أَمِنتُم مَّن فِى ٱلسَّمَآءِ أَن يُرْسِلَ عَلَيْكُمْ حَاصِبًۭا ۖ فَسَتَعْلَمُونَ كَيْفَ نَذِيرِ"},
      {n:67018,s:"الملك",a:18,t:"وَلَقَدْ كَذَّبَ ٱلَّذِينَ مِن قَبْلِهِمْ فَكَيْفَ كَانَ نَكِيرِ"},
      {n:67019,s:"الملك",a:19,t:"أَوَلَمْ يَرَوْا۟ إِلَى ٱلطَّيْرِ فَوْقَهُمْ صَٰٓفَّٰتٍۢ وَيَقْبِضْنَ ۚ مَا يُمْسِكُهُنَّ إِلَّا ٱلرَّحْمَٰنُ ۚ إِنَّهُۥ بِكُلِّ شَىْءٍۭ بَصِيرٌ"},
      {n:67020,s:"الملك",a:20,t:"أَمَّنْ هَٰذَا ٱلَّذِى هُوَ جُندٌۭ لَّكُمْ يَنصُرُكُم مِّن دُونِ ٱلرَّحْمَٰنِ ۚ إِنِ ٱلْكَٰفِرُونَ إِلَّا فِى غُرُورٍ"},
      {n:67021,s:"الملك",a:21,t:"أَمَّنْ هَٰذَا ٱلَّذِى يَرْزُقُكُمْ إِنْ أَمْسَكَ رِزْقَهُۥ ۚ بَل لَّجُّوا۟ فِى عُتُوٍّۢ وَنُفُورٍ"},
      {n:67022,s:"الملك",a:22,t:"أَفَمَن يَمْشِى مُكِبًّا عَلَىٰ وَجْهِهِۦٓ أَهْدَىٰٓ أَمَّن يَمْشِى سَوِيًّا عَلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ"},
      {n:67023,s:"الملك",a:23,t:"قُلْ هُوَ ٱلَّذِىٓ أَنشَأَكُمْ وَجَعَلَ لَكُمُ ٱلسَّمْعَ وَٱلْأَبْصَٰرَ وَٱلْأَفْـِٔدَةَ ۖ قَلِيلًۭا مَّا تَشْكُرُونَ"},
      {n:67024,s:"الملك",a:24,t:"قُلْ هُوَ ٱلَّذِى ذَرَأَكُمْ فِى ٱلْأَرْضِ وَإِلَيْهِ تُحْشَرُونَ"},
      {n:67025,s:"الملك",a:25,t:"وَيَقُولُونَ مَتَىٰ هَٰذَا ٱلْوَعْدُ إِن كُنتُمْ صَٰدِقِينَ"},
      {n:67026,s:"الملك",a:26,t:"قُلْ إِنَّمَا ٱلْعِلْمُ عِندَ ٱللَّهِ وَإِنَّمَآ أَنَا۠ نَذِيرٌۭ مُّبِينٌۭ"},
      {n:67027,s:"الملك",a:27,t:"فَلَمَّا رَأَوْهُ زُلْفَةًۭ سِيٓـَٔتْ وُجُوهُ ٱلَّذِينَ كَفَرُوا۟ وَقِيلَ هَٰذَا ٱلَّذِى كُنتُم بِهِۦ تَدَّعُونَ"},
      {n:67028,s:"الملك",a:28,t:"قُلْ أَرَءَيْتُمْ إِنْ أَهْلَكَنِىَ ٱللَّهُ وَمَن مَّعِىَ أَوْ رَحِمَنَا فَمَن يُجِيرُ ٱلْكَٰفِرِينَ مِنْ عَذَابٍ أَلِيمٍۢ"},
      {n:67029,s:"الملك",a:29,t:"قُلْ هُوَ ٱلرَّحْمَٰنُ ءَامَنَّا بِهِۦ وَعَلَيْهِ تَوَكَّلْنَا ۖ فَسَتَعْلَمُونَ مَنْ هُوَ فِى ضَلَٰلٍۢ مُّبِينٍۢ"},
      {n:67030,s:"الملك",a:30,t:"قُلْ أَرَءَيْتُمْ إِنْ أَصْبَحَ مَآؤُكُمْ غَوْرًۭا فَمَن يَأْتِيكُم بِمَآءٍۢ مَّعِينٍۭ"},
      {n:68001,s:"القلم",a:1,t:"نٓ ۚ وَٱلْقَلَمِ وَمَا يَسْطُرُونَ"},
      {n:68002,s:"القلم",a:2,t:"مَآ أَنتَ بِنِعْمَةِ رَبِّكَ بِمَجْنُونٍۢ"},
      {n:68003,s:"القلم",a:3,t:"وَإِنَّ لَكَ لَأَجْرًا غَيْرَ مَمْنُونٍۢ"},
      {n:68004,s:"القلم",a:4,t:"وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍۢ"},
      {n:68005,s:"القلم",a:5,t:"فَسَتُبْصِرُ وَيُبْصِرُونَ"},
      {n:68006,s:"القلم",a:6,t:"بِأَييِّكُمُ ٱلْمَفْتُونُ"},
      {n:68007,s:"القلم",a:7,t:"إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَن ضَلَّ عَن سَبِيلِهِۦ وَهُوَ أَعْلَمُ بِٱلْمُهْتَدِينَ"},
      {n:68008,s:"القلم",a:8,t:"فَلَا تُطِعِ ٱلْمُكَذِّبِينَ"},
      {n:68009,s:"القلم",a:9,t:"وَدُّوا۟ لَوْ تُدْهِنُ فَيُدْهِنُونَ"},
      {n:68010,s:"القلم",a:10,t:"وَلَا تُطِعْ كُلَّ حَلَّافٍۢ مَّهِينٍ"},
      {n:68011,s:"القلم",a:11,t:"هَمَّازٍۢ مَّشَّآءٍۭ بِنَمِيمٍۢ"},
      {n:68012,s:"القلم",a:12,t:"مَّنَّاعٍۢ لِّلْخَيْرِ مُعْتَدٍ أَثِيمٍ"},
      {n:68013,s:"القلم",a:13,t:"عُتُلٍّۭ بَعْدَ ذَٰلِكَ زَنِيمٍ"},
      {n:68014,s:"القلم",a:14,t:"أَن كَانَ ذَا مَالٍۢ وَبَنِينَ"},
      {n:68015,s:"القلم",a:15,t:"إِذَا تُتْلَىٰ عَلَيْهِ ءَايَٰتُنَا قَالَ أَسَٰطِيرُ ٱلْأَوَّلِينَ"},
      {n:68016,s:"القلم",a:16,t:"سَنَسِمُهُۥ عَلَى ٱلْخُرْطُومِ"},
      {n:68017,s:"القلم",a:17,t:"إِنَّا بَلَوْنَٰهُمْ كَمَا بَلَوْنَآ أَصْحَٰبَ ٱلْجَنَّةِ إِذْ أَقْسَمُوا۟ لَيَصْرِمُنَّهَا مُصْبِحِينَ"},
      {n:68018,s:"القلم",a:18,t:"وَلَا يَسْتَثْنُونَ"},
      {n:68019,s:"القلم",a:19,t:"فَطَافَ عَلَيْهَا طَآئِفٌۭ مِّن رَّبِّكَ وَهُمْ نَآئِمُونَ"},
      {n:68020,s:"القلم",a:20,t:"فَأَصْبَحَتْ كَٱلصَّرِيمِ"},
      {n:68021,s:"القلم",a:21,t:"فَتَنَادَوْا۟ مُصْبِحِينَ"},
      {n:68022,s:"القلم",a:22,t:"أَنِ ٱغْدُوا۟ عَلَىٰ حَرْثِكُمْ إِن كُنتُمْ صَٰرِمِينَ"},
      {n:68023,s:"القلم",a:23,t:"فَٱنطَلَقُوا۟ وَهُمْ يَتَخَٰفَتُونَ"},
      {n:68024,s:"القلم",a:24,t:"أَن لَّا يَدْخُلَنَّهَا ٱلْيَوْمَ عَلَيْكُم مِّسْكِينٌۭ"},
      {n:68025,s:"القلم",a:25,t:"وَغَدَوْا۟ عَلَىٰ حَرْدٍۢ قَٰدِرِينَ"},
      {n:68026,s:"القلم",a:26,t:"فَلَمَّا رَأَوْهَا قَالُوٓا۟ إِنَّا لَضَآلُّونَ"},
      {n:68027,s:"القلم",a:27,t:"بَلْ نَحْنُ مَحْرُومُونَ"},
      {n:68028,s:"القلم",a:28,t:"قَالَ أَوْسَطُهُمْ أَلَمْ أَقُل لَّكُمْ لَوْلَا تُسَبِّحُونَ"},
      {n:68029,s:"القلم",a:29,t:"قَالُوا۟ سُبْحَٰنَ رَبِّنَآ إِنَّا كُنَّا ظَٰلِمِينَ"},
      {n:68030,s:"القلم",a:30,t:"فَأَقْبَلَ بَعْضُهُمْ عَلَىٰ بَعْضٍۢ يَتَلَٰوَمُونَ"},
      {n:68031,s:"القلم",a:31,t:"قَالُوا۟ يَٰوَيْلَنَآ إِنَّا كُنَّا طَٰغِينَ"},
      {n:68032,s:"القلم",a:32,t:"عَسَىٰ رَبُّنَآ أَن يُبْدِلَنَا خَيْرًۭا مِّنْهَآ إِنَّآ إِلَىٰ رَبِّنَا رَٰغِبُونَ"},
      {n:68033,s:"القلم",a:33,t:"كَذَٰلِكَ ٱلْعَذَابُ ۖ وَلَعَذَابُ ٱلْءَاخِرَةِ أَكْبَرُ ۚ لَوْ كَانُوا۟ يَعْلَمُونَ"},
      {n:68034,s:"القلم",a:34,t:"إِنَّ لِلْمُتَّقِينَ عِندَ رَبِّهِمْ جَنَّٰتِ ٱلنَّعِيمِ"},
      {n:68035,s:"القلم",a:35,t:"أَفَنَجْعَلُ ٱلْمُسْلِمِينَ كَٱلْمُجْرِمِينَ"},
      {n:68036,s:"القلم",a:36,t:"مَا لَكُمْ كَيْفَ تَحْكُمُونَ"},
      {n:68037,s:"القلم",a:37,t:"أَمْ لَكُمْ كِتَٰبٌۭ فِيهِ تَدْرُسُونَ"},
      {n:68038,s:"القلم",a:38,t:"إِنَّ لَكُمْ فِيهِ لَمَا تَخَيَّرُونَ"},
      {n:68039,s:"القلم",a:39,t:"أَمْ لَكُمْ أَيْمَٰنٌ عَلَيْنَا بَٰلِغَةٌ إِلَىٰ يَوْمِ ٱلْقِيَٰمَةِ ۙ إِنَّ لَكُمْ لَمَا تَحْكُمُونَ"},
      {n:68040,s:"القلم",a:40,t:"سَلْهُمْ أَيُّهُم بِذَٰلِكَ زَعِيمٌ"},
      {n:68041,s:"القلم",a:41,t:"أَمْ لَهُمْ شُرَكَآءُ فَلْيَأْتُوا۟ بِشُرَكَآئِهِمْ إِن كَانُوا۟ صَٰدِقِينَ"},
      {n:68042,s:"القلم",a:42,t:"يَوْمَ يُكْشَفُ عَن سَاقٍۢ وَيُدْعَوْنَ إِلَى ٱلسُّجُودِ فَلَا يَسْتَطِيعُونَ"},
      {n:68043,s:"القلم",a:43,t:"خَٰشِعَةً أَبْصَٰرُهُمْ تَرْهَقُهُمْ ذِلَّةٌۭ ۖ وَقَدْ كَانُوا۟ يُدْعَوْنَ إِلَى ٱلسُّجُودِ وَهُمْ سَٰلِمُونَ"},
      {n:68044,s:"القلم",a:44,t:"فَذَرْنِى وَمَن يُكَذِّبُ بِهَٰذَا ٱلْحَدِيثِ ۖ سَنَسْتَدْرِجُهُم مِّنْ حَيْثُ لَا يَعْلَمُونَ"},
      {n:68045,s:"القلم",a:45,t:"وَأُمْلِى لَهُمْ ۚ إِنَّ كَيْدِى مَتِينٌ"},
      {n:68046,s:"القلم",a:46,t:"أَمْ تَسْـَٔلُهُمْ أَجْرًۭا فَهُم مِّن مَّغْرَمٍۢ مُّثْقَلُونَ"},
      {n:68047,s:"القلم",a:47,t:"أَمْ عِندَهُمُ ٱلْغَيْبُ فَهُمْ يَكْتُبُونَ"},
      {n:68048,s:"القلم",a:48,t:"فَٱصْبِرْ لِحُكْمِ رَبِّكَ وَلَا تَكُن كَصَاحِبِ ٱلْحُوتِ إِذْ نَادَىٰ وَهُوَ مَكْظُومٌۭ"},
      {n:68049,s:"القلم",a:49,t:"لَّوْلَآ أَن تَدَٰرَكَهُۥ نِعْمَةٌۭ مِّن رَّبِّهِۦ لَنُبِذَ بِٱلْعَرَآءِ وَهُوَ مَذْمُومٌۭ"},
      {n:68050,s:"القلم",a:50,t:"فَٱجْتَبَٰهُ رَبُّهُۥ فَجَعَلَهُۥ مِنَ ٱلصَّٰلِحِينَ"},
      {n:68051,s:"القلم",a:51,t:"وَإِن يَكَادُ ٱلَّذِينَ كَفَرُوا۟ لَيُزْلِقُونَكَ بِأَبْصَٰرِهِمْ لَمَّا سَمِعُوا۟ ٱلذِّكْرَ وَيَقُولُونَ إِنَّهُۥ لَمَجْنُونٌۭ"},
      {n:68052,s:"القلم",a:52,t:"وَمَا هُوَ إِلَّا ذِكْرٌۭ لِّلْعَٰلَمِينَ"},
      {n:69001,s:"الحاقة",a:1,t:"ٱلْحَآقَّةُ"},
      {n:69002,s:"الحاقة",a:2,t:"مَا ٱلْحَآقَّةُ"},
      {n:69003,s:"الحاقة",a:3,t:"وَمَآ أَدْرَىٰكَ مَا ٱلْحَآقَّةُ"},
      {n:69004,s:"الحاقة",a:4,t:"كَذَّبَتْ ثَمُودُ وَعَادٌۢ بِٱلْقَارِعَةِ"},
      {n:69005,s:"الحاقة",a:5,t:"فَأَمَّا ثَمُودُ فَأُهْلِكُوا۟ بِٱلطَّاغِيَةِ"},
      {n:69006,s:"الحاقة",a:6,t:"وَأَمَّا عَادٌۭ فَأُهْلِكُوا۟ بِرِيحٍۢ صَرْصَرٍ عَاتِيَةٍۢ"},
      {n:69007,s:"الحاقة",a:7,t:"سَخَّرَهَا عَلَيْهِمْ سَبْعَ لَيَالٍۢ وَثَمَٰنِيَةَ أَيَّامٍ حُسُومًۭا فَتَرَى ٱلْقَوْمَ فِيهَا صَرْعَىٰ كَأَنَّهُمْ أَعْجَازُ نَخْلٍ خَاوِيَةٍۢ"},
      {n:69008,s:"الحاقة",a:8,t:"فَهَلْ تَرَىٰ لَهُم مِّنۢ بَاقِيَةٍۢ"},
      {n:69009,s:"الحاقة",a:9,t:"وَجَآءَ فِرْعَوْنُ وَمَن قَبْلَهُۥ وَٱلْمُؤْتَفِكَٰتُ بِٱلْخَاطِئَةِ"},
      {n:69010,s:"الحاقة",a:10,t:"فَعَصَوْا۟ رَسُولَ رَبِّهِمْ فَأَخَذَهُمْ أَخْذَةًۭ رَّابِيَةً"},
      {n:69011,s:"الحاقة",a:11,t:"إِنَّا لَمَّا طَغَا ٱلْمَآءُ حَمَلْنَٰكُمْ فِى ٱلْجَارِيَةِ"},
      {n:69012,s:"الحاقة",a:12,t:"لِنَجْعَلَهَا لَكُمْ تَذْكِرَةًۭ وَتَعِيَهَآ أُذُنٌۭ وَٰعِيَةٌۭ"},
      {n:69013,s:"الحاقة",a:13,t:"فَإِذَا نُفِخَ فِى ٱلصُّورِ نَفْخَةٌۭ وَٰحِدَةٌۭ"},
      {n:69014,s:"الحاقة",a:14,t:"وَحُمِلَتِ ٱلْأَرْضُ وَٱلْجِبَالُ فَدُكَّتَا دَكَّةًۭ وَٰحِدَةًۭ"},
      {n:69015,s:"الحاقة",a:15,t:"فَيَوْمَئِذٍۢ وَقَعَتِ ٱلْوَاقِعَةُ"},
      {n:69016,s:"الحاقة",a:16,t:"وَٱنشَقَّتِ ٱلسَّمَآءُ فَهِىَ يَوْمَئِذٍۢ وَاهِيَةٌۭ"},
      {n:69017,s:"الحاقة",a:17,t:"وَٱلْمَلَكُ عَلَىٰٓ أَرْجَآئِهَا ۚ وَيَحْمِلُ عَرْشَ رَبِّكَ فَوْقَهُمْ يَوْمَئِذٍۢ ثَمَٰنِيَةٌۭ"},
      {n:69018,s:"الحاقة",a:18,t:"يَوْمَئِذٍۢ تُعْرَضُونَ لَا تَخْفَىٰ مِنكُمْ خَافِيَةٌۭ"},
      {n:69019,s:"الحاقة",a:19,t:"فَأَمَّا مَنْ أُوتِىَ كِتَٰبَهُۥ بِيَمِينِهِۦ فَيَقُولُ هَآؤُمُ ٱقْرَءُوا۟ كِتَٰبِيَهْ"},
      {n:69020,s:"الحاقة",a:20,t:"إِنِّى ظَنَنتُ أَنِّى مُلَٰقٍ حِسَابِيَهْ"},
      {n:69021,s:"الحاقة",a:21,t:"فَهُوَ فِى عِيشَةٍۢ رَّاضِيَةٍۢ"},
      {n:69022,s:"الحاقة",a:22,t:"فِى جَنَّةٍ عَالِيَةٍۢ"},
      {n:69023,s:"الحاقة",a:23,t:"قُطُوفُهَا دَانِيَةٌۭ"},
      {n:69024,s:"الحاقة",a:24,t:"كُلُوا۟ وَٱشْرَبُوا۟ هَنِيٓـًٔۢا بِمَآ أَسْلَفْتُمْ فِى ٱلْأَيَّامِ ٱلْخَالِيَةِ"},
      {n:69025,s:"الحاقة",a:25,t:"وَأَمَّا مَنْ أُوتِىَ كِتَٰبَهُۥ بِشِمَالِهِۦ فَيَقُولُ يَٰلَيْتَنِى لَمْ أُوتَ كِتَٰبِيَهْ"},
      {n:69026,s:"الحاقة",a:26,t:"وَلَمْ أَدْرِ مَا حِسَابِيَهْ"},
      {n:69027,s:"الحاقة",a:27,t:"يَٰلَيْتَهَا كَانَتِ ٱلْقَاضِيَةَ"},
      {n:69028,s:"الحاقة",a:28,t:"مَآ أَغْنَىٰ عَنِّى مَالِيَهْ ۜ"},
      {n:69029,s:"الحاقة",a:29,t:"هَلَكَ عَنِّى سُلْطَٰنِيَهْ"},
      {n:69030,s:"الحاقة",a:30,t:"خُذُوهُ فَغُلُّوهُ"},
      {n:69031,s:"الحاقة",a:31,t:"ثُمَّ ٱلْجَحِيمَ صَلُّوهُ"},
      {n:69032,s:"الحاقة",a:32,t:"ثُمَّ فِى سِلْسِلَةٍۢ ذَرْعُهَا سَبْعُونَ ذِرَاعًۭا فَٱسْلُكُوهُ"},
      {n:69033,s:"الحاقة",a:33,t:"إِنَّهُۥ كَانَ لَا يُؤْمِنُ بِٱللَّهِ ٱلْعَظِيمِ"},
      {n:69034,s:"الحاقة",a:34,t:"وَلَا يَحُضُّ عَلَىٰ طَعَامِ ٱلْمِسْكِينِ"},
      {n:69035,s:"الحاقة",a:35,t:"فَلَيْسَ لَهُ ٱلْيَوْمَ هَٰهُنَا حَمِيمٌۭ"},
      {n:69036,s:"الحاقة",a:36,t:"وَلَا طَعَامٌ إِلَّا مِنْ غِسْلِينٍۢ"},
      {n:69037,s:"الحاقة",a:37,t:"لَّا يَأْكُلُهُۥٓ إِلَّا ٱلْخَٰطِـُٔونَ"},
      {n:69038,s:"الحاقة",a:38,t:"فَلَآ أُقْسِمُ بِمَا تُبْصِرُونَ"},
      {n:69039,s:"الحاقة",a:39,t:"وَمَا لَا تُبْصِرُونَ"},
      {n:69040,s:"الحاقة",a:40,t:"إِنَّهُۥ لَقَوْلُ رَسُولٍۢ كَرِيمٍۢ"},
      {n:69041,s:"الحاقة",a:41,t:"وَمَا هُوَ بِقَوْلِ شَاعِرٍۢ ۚ قَلِيلًۭا مَّا تُؤْمِنُونَ"},
      {n:69042,s:"الحاقة",a:42,t:"وَلَا بِقَوْلِ كَاهِنٍۢ ۚ قَلِيلًۭا مَّا تَذَكَّرُونَ"},
      {n:69043,s:"الحاقة",a:43,t:"تَنزِيلٌۭ مِّن رَّبِّ ٱلْعَٰلَمِينَ"},
      {n:69044,s:"الحاقة",a:44,t:"وَلَوْ تَقَوَّلَ عَلَيْنَا بَعْضَ ٱلْأَقَاوِيلِ"},
      {n:69045,s:"الحاقة",a:45,t:"لَأَخَذْنَا مِنْهُ بِٱلْيَمِينِ"},
      {n:69046,s:"الحاقة",a:46,t:"ثُمَّ لَقَطَعْنَا مِنْهُ ٱلْوَتِينَ"},
      {n:69047,s:"الحاقة",a:47,t:"فَمَا مِنكُم مِّنْ أَحَدٍ عَنْهُ حَٰجِزِينَ"},
      {n:69048,s:"الحاقة",a:48,t:"وَإِنَّهُۥ لَتَذْكِرَةٌۭ لِّلْمُتَّقِينَ"},
      {n:69049,s:"الحاقة",a:49,t:"وَإِنَّا لَنَعْلَمُ أَنَّ مِنكُم مُّكَذِّبِينَ"},
      {n:69050,s:"الحاقة",a:50,t:"وَإِنَّهُۥ لَحَسْرَةٌ عَلَى ٱلْكَٰفِرِينَ"},
      {n:69051,s:"الحاقة",a:51,t:"وَإِنَّهُۥ لَحَقُّ ٱلْيَقِينِ"},
      {n:69052,s:"الحاقة",a:52,t:"فَسَبِّحْ بِٱسْمِ رَبِّكَ ٱلْعَظِيمِ"},
      {n:70001,s:"المعارج",a:1,t:"سَأَلَ سَآئِلٌۢ بِعَذَابٍۢ وَاقِعٍۢ"},
      {n:70002,s:"المعارج",a:2,t:"لِّلْكَٰفِرِينَ لَيْسَ لَهُۥ دَافِعٌۭ"},
      {n:70003,s:"المعارج",a:3,t:"مِّنَ ٱللَّهِ ذِى ٱلْمَعَارِجِ"},
      {n:70004,s:"المعارج",a:4,t:"تَعْرُجُ ٱلْمَلَٰٓئِكَةُ وَٱلرُّوحُ إِلَيْهِ فِى يَوْمٍۢ كَانَ مِقْدَارُهُۥ خَمْسِينَ أَلْفَ سَنَةٍۢ"},
      {n:70005,s:"المعارج",a:5,t:"فَٱصْبِرْ صَبْرًۭا جَمِيلًا"},
      {n:70006,s:"المعارج",a:6,t:"إِنَّهُمْ يَرَوْنَهُۥ بَعِيدًۭا"},
      {n:70007,s:"المعارج",a:7,t:"وَنَرَىٰهُ قَرِيبًۭا"},
      {n:70008,s:"المعارج",a:8,t:"يَوْمَ تَكُونُ ٱلسَّمَآءُ كَٱلْمُهْلِ"},
      {n:70009,s:"المعارج",a:9,t:"وَتَكُونُ ٱلْجِبَالُ كَٱلْعِهْنِ"},
      {n:70010,s:"المعارج",a:10,t:"وَلَا يَسْـَٔلُ حَمِيمٌ حَمِيمًۭا"},
      {n:70011,s:"المعارج",a:11,t:"يُبَصَّرُونَهُمْ ۚ يَوَدُّ ٱلْمُجْرِمُ لَوْ يَفْتَدِى مِنْ عَذَابِ يَوْمِئِذٍۭ بِبَنِيهِ"},
      {n:70012,s:"المعارج",a:12,t:"وَصَٰحِبَتِهِۦ وَأَخِيهِ"},
      {n:70013,s:"المعارج",a:13,t:"وَفَصِيلَتِهِ ٱلَّتِى تُـْٔوِيهِ"},
      {n:70014,s:"المعارج",a:14,t:"وَمَن فِى ٱلْأَرْضِ جَمِيعًۭا ثُمَّ يُنجِيهِ"},
      {n:70015,s:"المعارج",a:15,t:"كَلَّآ ۖ إِنَّهَا لَظَىٰ"},
      {n:70016,s:"المعارج",a:16,t:"نَزَّاعَةًۭ لِّلشَّوَىٰ"},
      {n:70017,s:"المعارج",a:17,t:"تَدْعُوا۟ مَنْ أَدْبَرَ وَتَوَلَّىٰ"},
      {n:70018,s:"المعارج",a:18,t:"وَجَمَعَ فَأَوْعَىٰٓ"},
      {n:70019,s:"المعارج",a:19,t:"۞ إِنَّ ٱلْإِنسَٰنَ خُلِقَ هَلُوعًا"},
      {n:70020,s:"المعارج",a:20,t:"إِذَا مَسَّهُ ٱلشَّرُّ جَزُوعًۭا"},
      {n:70021,s:"المعارج",a:21,t:"وَإِذَا مَسَّهُ ٱلْخَيْرُ مَنُوعًا"},
      {n:70022,s:"المعارج",a:22,t:"إِلَّا ٱلْمُصَلِّينَ"},
      {n:70023,s:"المعارج",a:23,t:"ٱلَّذِينَ هُمْ عَلَىٰ صَلَاتِهِمْ دَآئِمُونَ"},
      {n:70024,s:"المعارج",a:24,t:"وَٱلَّذِينَ فِىٓ أَمْوَٰلِهِمْ حَقٌّۭ مَّعْلُومٌۭ"},
      {n:70025,s:"المعارج",a:25,t:"لِّلسَّآئِلِ وَٱلْمَحْرُومِ"},
      {n:70026,s:"المعارج",a:26,t:"وَٱلَّذِينَ يُصَدِّقُونَ بِيَوْمِ ٱلدِّينِ"},
      {n:70027,s:"المعارج",a:27,t:"وَٱلَّذِينَ هُم مِّنْ عَذَابِ رَبِّهِم مُّشْفِقُونَ"},
      {n:70028,s:"المعارج",a:28,t:"إِنَّ عَذَابَ رَبِّهِمْ غَيْرُ مَأْمُونٍۢ"},
      {n:70029,s:"المعارج",a:29,t:"وَٱلَّذِينَ هُمْ لِفُرُوجِهِمْ حَٰفِظُونَ"},
      {n:70030,s:"المعارج",a:30,t:"إِلَّا عَلَىٰٓ أَزْوَٰجِهِمْ أَوْ مَا مَلَكَتْ أَيْمَٰنُهُمْ فَإِنَّهُمْ غَيْرُ مَلُومِينَ"},
      {n:70031,s:"المعارج",a:31,t:"فَمَنِ ٱبْتَغَىٰ وَرَآءَ ذَٰلِكَ فَأُو۟لَٰٓئِكَ هُمُ ٱلْعَادُونَ"},
      {n:70032,s:"المعارج",a:32,t:"وَٱلَّذِينَ هُمْ لِأَمَٰنَٰتِهِمْ وَعَهْدِهِمْ رَٰعُونَ"},
      {n:70033,s:"المعارج",a:33,t:"وَٱلَّذِينَ هُم بِشَهَٰدَٰتِهِمْ قَآئِمُونَ"},
      {n:70034,s:"المعارج",a:34,t:"وَٱلَّذِينَ هُمْ عَلَىٰ صَلَاتِهِمْ يُحَافِظُونَ"},
      {n:70035,s:"المعارج",a:35,t:"أُو۟لَٰٓئِكَ فِى جَنَّٰتٍۢ مُّكْرَمُونَ"},
      {n:70036,s:"المعارج",a:36,t:"فَمَالِ ٱلَّذِينَ كَفَرُوا۟ قِبَلَكَ مُهْطِعِينَ"},
      {n:70037,s:"المعارج",a:37,t:"عَنِ ٱلْيَمِينِ وَعَنِ ٱلشِّمَالِ عِزِينَ"},
      {n:70038,s:"المعارج",a:38,t:"أَيَطْمَعُ كُلُّ ٱمْرِئٍۢ مِّنْهُمْ أَن يُدْخَلَ جَنَّةَ نَعِيمٍۢ"},
      {n:70039,s:"المعارج",a:39,t:"كَلَّآ ۖ إِنَّا خَلَقْنَٰهُم مِّمَّا يَعْلَمُونَ"},
      {n:70040,s:"المعارج",a:40,t:"فَلَآ أُقْسِمُ بِرَبِّ ٱلْمَشَٰرِقِ وَٱلْمَغَٰرِبِ إِنَّا لَقَٰدِرُونَ"},
      {n:70041,s:"المعارج",a:41,t:"عَلَىٰٓ أَن نُّبَدِّلَ خَيْرًۭا مِّنْهُمْ وَمَا نَحْنُ بِمَسْبُوقِينَ"},
      {n:70042,s:"المعارج",a:42,t:"فَذَرْهُمْ يَخُوضُوا۟ وَيَلْعَبُوا۟ حَتَّىٰ يُلَٰقُوا۟ يَوْمَهُمُ ٱلَّذِى يُوعَدُونَ"},
      {n:70043,s:"المعارج",a:43,t:"يَوْمَ يَخْرُجُونَ مِنَ ٱلْأَجْدَاثِ سِرَاعًۭا كَأَنَّهُمْ إِلَىٰ نُصُبٍۢ يُوفِضُونَ"},
      {n:70044,s:"المعارج",a:44,t:"خَٰشِعَةً أَبْصَٰرُهُمْ تَرْهَقُهُمْ ذِلَّةٌۭ ۚ ذَٰلِكَ ٱلْيَوْمُ ٱلَّذِى كَانُوا۟ يُوعَدُونَ"},
      {n:71001,s:"نوح",a:1,t:"إِنَّآ أَرْسَلْنَا نُوحًا إِلَىٰ قَوْمِهِۦٓ أَنْ أَنذِرْ قَوْمَكَ مِن قَبْلِ أَن يَأْتِيَهُمْ عَذَابٌ أَلِيمٌۭ"},
      {n:71002,s:"نوح",a:2,t:"قَالَ يَٰقَوْمِ إِنِّى لَكُمْ نَذِيرٌۭ مُّبِينٌ"},
      {n:71003,s:"نوح",a:3,t:"أَنِ ٱعْبُدُوا۟ ٱللَّهَ وَٱتَّقُوهُ وَأَطِيعُونِ"},
      {n:71004,s:"نوح",a:4,t:"يَغْفِرْ لَكُم مِّن ذُنُوبِكُمْ وَيُؤَخِّرْكُمْ إِلَىٰٓ أَجَلٍۢ مُّسَمًّى ۚ إِنَّ أَجَلَ ٱللَّهِ إِذَا جَآءَ لَا يُؤَخَّرُ ۖ لَوْ كُنتُمْ تَعْلَمُونَ"},
      {n:71005,s:"نوح",a:5,t:"قَالَ رَبِّ إِنِّى دَعَوْتُ قَوْمِى لَيْلًۭا وَنَهَارًۭا"},
      {n:71006,s:"نوح",a:6,t:"فَلَمْ يَزِدْهُمْ دُعَآءِىٓ إِلَّا فِرَارًۭا"},
      {n:71007,s:"نوح",a:7,t:"وَإِنِّى كُلَّمَا دَعَوْتُهُمْ لِتَغْفِرَ لَهُمْ جَعَلُوٓا۟ أَصَٰبِعَهُمْ فِىٓ ءَاذَانِهِمْ وَٱسْتَغْشَوْا۟ ثِيَابَهُمْ وَأَصَرُّوا۟ وَٱسْتَكْبَرُوا۟ ٱسْتِكْبَارًۭا"},
      {n:71008,s:"نوح",a:8,t:"ثُمَّ إِنِّى دَعَوْتُهُمْ جِهَارًۭا"},
      {n:71009,s:"نوح",a:9,t:"ثُمَّ إِنِّىٓ أَعْلَنتُ لَهُمْ وَأَسْرَرْتُ لَهُمْ إِسْرَارًۭا"},
      {n:71010,s:"نوح",a:10,t:"فَقُلْتُ ٱسْتَغْفِرُوا۟ رَبَّكُمْ إِنَّهُۥ كَانَ غَفَّارًۭا"},
      {n:71011,s:"نوح",a:11,t:"يُرْسِلِ ٱلسَّمَآءَ عَلَيْكُم مِّدْرَارًۭا"},
      {n:71012,s:"نوح",a:12,t:"وَيُمْدِدْكُم بِأَمْوَٰلٍۢ وَبَنِينَ وَيَجْعَل لَّكُمْ جَنَّٰتٍۢ وَيَجْعَل لَّكُمْ أَنْهَٰرًۭا"},
      {n:71013,s:"نوح",a:13,t:"مَّا لَكُمْ لَا تَرْجُونَ لِلَّهِ وَقَارًۭا"},
      {n:71014,s:"نوح",a:14,t:"وَقَدْ خَلَقَكُمْ أَطْوَارًا"},
      {n:71015,s:"نوح",a:15,t:"أَلَمْ تَرَوْا۟ كَيْفَ خَلَقَ ٱللَّهُ سَبْعَ سَمَٰوَٰتٍۢ طِبَاقًۭا"},
      {n:71016,s:"نوح",a:16,t:"وَجَعَلَ ٱلْقَمَرَ فِيهِنَّ نُورًۭا وَجَعَلَ ٱلشَّمْسَ سِرَاجًۭا"},
      {n:71017,s:"نوح",a:17,t:"وَٱللَّهُ أَنۢبَتَكُم مِّنَ ٱلْأَرْضِ نَبَاتًۭا"},
      {n:71018,s:"نوح",a:18,t:"ثُمَّ يُعِيدُكُمْ فِيهَا وَيُخْرِجُكُمْ إِخْرَاجًۭا"},
      {n:71019,s:"نوح",a:19,t:"وَٱللَّهُ جَعَلَ لَكُمُ ٱلْأَرْضَ بِسَاطًۭا"},
      {n:71020,s:"نوح",a:20,t:"لِّتَسْلُكُوا۟ مِنْهَا سُبُلًۭا فِجَاجًۭا"},
      {n:71021,s:"نوح",a:21,t:"قَالَ نُوحٌۭ رَّبِّ إِنَّهُمْ عَصَوْنِى وَٱتَّبَعُوا۟ مَن لَّمْ يَزِدْهُ مَالُهُۥ وَوَلَدُهُۥٓ إِلَّا خَسَارًۭا"},
      {n:71022,s:"نوح",a:22,t:"وَمَكَرُوا۟ مَكْرًۭا كُبَّارًۭا"},
      {n:71023,s:"نوح",a:23,t:"وَقَالُوا۟ لَا تَذَرُنَّ ءَالِهَتَكُمْ وَلَا تَذَرُنَّ وَدًّۭا وَلَا سُوَاعًۭا وَلَا يَغُوثَ وَيَعُوقَ وَنَسْرًۭا"},
      {n:71024,s:"نوح",a:24,t:"وَقَدْ أَضَلُّوا۟ كَثِيرًۭا ۖ وَلَا تَزِدِ ٱلظَّٰلِمِينَ إِلَّا ضَلَٰلًۭا"},
      {n:71025,s:"نوح",a:25,t:"مِّمَّا خَطِيٓـَٰٔتِهِمْ أُغْرِقُوا۟ فَأُدْخِلُوا۟ نَارًۭا فَلَمْ يَجِدُوا۟ لَهُم مِّن دُونِ ٱللَّهِ أَنصَارًۭا"},
      {n:71026,s:"نوح",a:26,t:"وَقَالَ نُوحٌۭ رَّبِّ لَا تَذَرْ عَلَى ٱلْأَرْضِ مِنَ ٱلْكَٰفِرِينَ دَيَّارًا"},
      {n:71027,s:"نوح",a:27,t:"إِنَّكَ إِن تَذَرْهُمْ يُضِلُّوا۟ عِبَادَكَ وَلَا يَلِدُوٓا۟ إِلَّا فَاجِرًۭا كَفَّارًۭا"},
      {n:71028,s:"نوح",a:28,t:"رَّبِّ ٱغْفِرْ لِى وَلِوَٰلِدَىَّ وَلِمَن دَخَلَ بَيْتِىَ مُؤْمِنًۭا وَلِلْمُؤْمِنِينَ وَٱلْمُؤْمِنَٰتِ وَلَا تَزِدِ ٱلظَّٰلِمِينَ إِلَّا تَبَارًۢا"},
      {n:72001,s:"الجن",a:1,t:"قُلْ أُوحِىَ إِلَىَّ أَنَّهُ ٱسْتَمَعَ نَفَرٌۭ مِّنَ ٱلْجِنِّ فَقَالُوٓا۟ إِنَّا سَمِعْنَا قُرْءَانًا عَجَبًۭا"},
      {n:72002,s:"الجن",a:2,t:"يَهْدِىٓ إِلَى ٱلرُّشْدِ فَـَٔامَنَّا بِهِۦ ۖ وَلَن نُّشْرِكَ بِرَبِّنَآ أَحَدًۭا"},
      {n:72003,s:"الجن",a:3,t:"وَأَنَّهُۥ تَعَٰلَىٰ جَدُّ رَبِّنَا مَا ٱتَّخَذَ صَٰحِبَةًۭ وَلَا وَلَدًۭا"},
      {n:72004,s:"الجن",a:4,t:"وَأَنَّهُۥ كَانَ يَقُولُ سَفِيهُنَا عَلَى ٱللَّهِ شَطَطًۭا"},
      {n:72005,s:"الجن",a:5,t:"وَأَنَّا ظَنَنَّآ أَن لَّن تَقُولَ ٱلْإِنسُ وَٱلْجِنُّ عَلَى ٱللَّهِ كَذِبًۭا"},
      {n:72006,s:"الجن",a:6,t:"وَأَنَّهُۥ كَانَ رِجَالٌۭ مِّنَ ٱلْإِنسِ يَعُوذُونَ بِرِجَالٍۢ مِّنَ ٱلْجِنِّ فَزَادُوهُمْ رَهَقًۭا"},
      {n:72007,s:"الجن",a:7,t:"وَأَنَّهُمْ ظَنُّوا۟ كَمَا ظَنَنتُمْ أَن لَّن يَبْعَثَ ٱللَّهُ أَحَدًۭا"},
      {n:72008,s:"الجن",a:8,t:"وَأَنَّا لَمَسْنَا ٱلسَّمَآءَ فَوَجَدْنَٰهَا مُلِئَتْ حَرَسًۭا شَدِيدًۭا وَشُهُبًۭا"},
      {n:72009,s:"الجن",a:9,t:"وَأَنَّا كُنَّا نَقْعُدُ مِنْهَا مَقَٰعِدَ لِلسَّمْعِ ۖ فَمَن يَسْتَمِعِ ٱلْءَانَ يَجِدْ لَهُۥ شِهَابًۭا رَّصَدًۭا"},
      {n:72010,s:"الجن",a:10,t:"وَأَنَّا لَا نَدْرِىٓ أَشَرٌّ أُرِيدَ بِمَن فِى ٱلْأَرْضِ أَمْ أَرَادَ بِهِمْ رَبُّهُمْ رَشَدًۭا"},
      {n:72011,s:"الجن",a:11,t:"وَأَنَّا مِنَّا ٱلصَّٰلِحُونَ وَمِنَّا دُونَ ذَٰلِكَ ۖ كُنَّا طَرَآئِقَ قِدَدًۭا"},
      {n:72012,s:"الجن",a:12,t:"وَأَنَّا ظَنَنَّآ أَن لَّن نُّعْجِزَ ٱللَّهَ فِى ٱلْأَرْضِ وَلَن نُّعْجِزَهُۥ هَرَبًۭا"},
      {n:72013,s:"الجن",a:13,t:"وَأَنَّا لَمَّا سَمِعْنَا ٱلْهُدَىٰٓ ءَامَنَّا بِهِۦ ۖ فَمَن يُؤْمِنۢ بِرَبِّهِۦ فَلَا يَخَافُ بَخْسًۭا وَلَا رَهَقًۭا"},
      {n:72014,s:"الجن",a:14,t:"وَأَنَّا مِنَّا ٱلْمُسْلِمُونَ وَمِنَّا ٱلْقَٰسِطُونَ ۖ فَمَنْ أَسْلَمَ فَأُو۟لَٰٓئِكَ تَحَرَّوْا۟ رَشَدًۭا"},
      {n:72015,s:"الجن",a:15,t:"وَأَمَّا ٱلْقَٰسِطُونَ فَكَانُوا۟ لِجَهَنَّمَ حَطَبًۭا"},
      {n:72016,s:"الجن",a:16,t:"وَأَلَّوِ ٱسْتَقَٰمُوا۟ عَلَى ٱلطَّرِيقَةِ لَأَسْقَيْنَٰهُم مَّآءً غَدَقًۭا"},
      {n:72017,s:"الجن",a:17,t:"لِّنَفْتِنَهُمْ فِيهِ ۚ وَمَن يُعْرِضْ عَن ذِكْرِ رَبِّهِۦ يَسْلُكْهُ عَذَابًۭا صَعَدًۭا"},
      {n:72018,s:"الجن",a:18,t:"وَأَنَّ ٱلْمَسَٰجِدَ لِلَّهِ فَلَا تَدْعُوا۟ مَعَ ٱللَّهِ أَحَدًۭا"},
      {n:72019,s:"الجن",a:19,t:"وَأَنَّهُۥ لَمَّا قَامَ عَبْدُ ٱللَّهِ يَدْعُوهُ كَادُوا۟ يَكُونُونَ عَلَيْهِ لِبَدًۭا"},
      {n:72020,s:"الجن",a:20,t:"قُلْ إِنَّمَآ أَدْعُوا۟ رَبِّى وَلَآ أُشْرِكُ بِهِۦٓ أَحَدًۭا"},
      {n:72021,s:"الجن",a:21,t:"قُلْ إِنِّى لَآ أَمْلِكُ لَكُمْ ضَرًّۭا وَلَا رَشَدًۭا"},
      {n:72022,s:"الجن",a:22,t:"قُلْ إِنِّى لَن يُجِيرَنِى مِنَ ٱللَّهِ أَحَدٌۭ وَلَنْ أَجِدَ مِن دُونِهِۦ مُلْتَحَدًا"},
      {n:72023,s:"الجن",a:23,t:"إِلَّا بَلَٰغًۭا مِّنَ ٱللَّهِ وَرِسَٰلَٰتِهِۦ ۚ وَمَن يَعْصِ ٱللَّهَ وَرَسُولَهُۥ فَإِنَّ لَهُۥ نَارَ جَهَنَّمَ خَٰلِدِينَ فِيهَآ أَبَدًا"},
      {n:72024,s:"الجن",a:24,t:"حَتَّىٰٓ إِذَا رَأَوْا۟ مَا يُوعَدُونَ فَسَيَعْلَمُونَ مَنْ أَضْعَفُ نَاصِرًۭا وَأَقَلُّ عَدَدًۭا"},
      {n:72025,s:"الجن",a:25,t:"قُلْ إِنْ أَدْرِىٓ أَقَرِيبٌۭ مَّا تُوعَدُونَ أَمْ يَجْعَلُ لَهُۥ رَبِّىٓ أَمَدًا"},
      {n:72026,s:"الجن",a:26,t:"عَٰلِمُ ٱلْغَيْبِ فَلَا يُظْهِرُ عَلَىٰ غَيْبِهِۦٓ أَحَدًا"},
      {n:72027,s:"الجن",a:27,t:"إِلَّا مَنِ ٱرْتَضَىٰ مِن رَّسُولٍۢ فَإِنَّهُۥ يَسْلُكُ مِنۢ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِۦ رَصَدًۭا"},
      {n:72028,s:"الجن",a:28,t:"لِّيَعْلَمَ أَن قَدْ أَبْلَغُوا۟ رِسَٰلَٰتِ رَبِّهِمْ وَأَحَاطَ بِمَا لَدَيْهِمْ وَأَحْصَىٰ كُلَّ شَىْءٍ عَدَدًۢا"},
      {n:73001,s:"المزمل",a:1,t:"يَٰٓأَيُّهَا ٱلْمُزَّمِّلُ"},
      {n:73002,s:"المزمل",a:2,t:"قُمِ ٱلَّيْلَ إِلَّا قَلِيلًۭا"},
      {n:73003,s:"المزمل",a:3,t:"نِّصْفَهُۥٓ أَوِ ٱنقُصْ مِنْهُ قَلِيلًا"},
      {n:73004,s:"المزمل",a:4,t:"أَوْ زِدْ عَلَيْهِ وَرَتِّلِ ٱلْقُرْءَانَ تَرْتِيلًا"},
      {n:73005,s:"المزمل",a:5,t:"إِنَّا سَنُلْقِى عَلَيْكَ قَوْلًۭا ثَقِيلًا"},
      {n:73006,s:"المزمل",a:6,t:"إِنَّ نَاشِئَةَ ٱلَّيْلِ هِىَ أَشَدُّ وَطْـًۭٔا وَأَقْوَمُ قِيلًا"},
      {n:73007,s:"المزمل",a:7,t:"إِنَّ لَكَ فِى ٱلنَّهَارِ سَبْحًۭا طَوِيلًۭا"},
      {n:73008,s:"المزمل",a:8,t:"وَٱذْكُرِ ٱسْمَ رَبِّكَ وَتَبَتَّلْ إِلَيْهِ تَبْتِيلًۭا"},
      {n:73009,s:"المزمل",a:9,t:"رَّبُّ ٱلْمَشْرِقِ وَٱلْمَغْرِبِ لَآ إِلَٰهَ إِلَّا هُوَ فَٱتَّخِذْهُ وَكِيلًۭا"},
      {n:73010,s:"المزمل",a:10,t:"وَٱصْبِرْ عَلَىٰ مَا يَقُولُونَ وَٱهْجُرْهُمْ هَجْرًۭا جَمِيلًۭا"},
      {n:73011,s:"المزمل",a:11,t:"وَذَرْنِى وَٱلْمُكَذِّبِينَ أُو۟لِى ٱلنَّعْمَةِ وَمَهِّلْهُمْ قَلِيلًا"},
      {n:73012,s:"المزمل",a:12,t:"إِنَّ لَدَيْنَآ أَنكَالًۭا وَجَحِيمًۭا"},
      {n:73013,s:"المزمل",a:13,t:"وَطَعَامًۭا ذَا غُصَّةٍۢ وَعَذَابًا أَلِيمًۭا"},
      {n:73014,s:"المزمل",a:14,t:"يَوْمَ تَرْجُفُ ٱلْأَرْضُ وَٱلْجِبَالُ وَكَانَتِ ٱلْجِبَالُ كَثِيبًۭا مَّهِيلًا"},
      {n:73015,s:"المزمل",a:15,t:"إِنَّآ أَرْسَلْنَآ إِلَيْكُمْ رَسُولًۭا شَٰهِدًا عَلَيْكُمْ كَمَآ أَرْسَلْنَآ إِلَىٰ فِرْعَوْنَ رَسُولًۭا"},
      {n:73016,s:"المزمل",a:16,t:"فَعَصَىٰ فِرْعَوْنُ ٱلرَّسُولَ فَأَخَذْنَٰهُ أَخْذًۭا وَبِيلًۭا"},
      {n:73017,s:"المزمل",a:17,t:"فَكَيْفَ تَتَّقُونَ إِن كَفَرْتُمْ يَوْمًۭا يَجْعَلُ ٱلْوِلْدَٰنَ شِيبًا"},
      {n:73018,s:"المزمل",a:18,t:"ٱلسَّمَآءُ مُنفَطِرٌۢ بِهِۦ ۚ كَانَ وَعْدُهُۥ مَفْعُولًا"},
      {n:73019,s:"المزمل",a:19,t:"إِنَّ هَٰذِهِۦ تَذْكِرَةٌۭ ۖ فَمَن شَآءَ ٱتَّخَذَ إِلَىٰ رَبِّهِۦ سَبِيلًا"},
      {n:73020,s:"المزمل",a:20,t:"۞ إِنَّ رَبَّكَ يَعْلَمُ أَنَّكَ تَقُومُ أَدْنَىٰ مِن ثُلُثَىِ ٱلَّيْلِ وَنِصْفَهُۥ وَثُلُثَهُۥ وَطَآئِفَةٌۭ مِّنَ ٱلَّذِينَ مَعَكَ ۚ وَٱللَّهُ يُقَدِّرُ ٱلَّيْلَ وَٱلنَّهَارَ ۚ عَلِمَ أَن لَّن تُحْصُوهُ فَتَابَ عَلَيْكُمْ ۖ فَٱقْرَءُوا۟ مَا تَيَسَّرَ مِنَ ٱلْقُرْءَانِ ۚ عَلِمَ أَن سَيَكُونُ مِنكُم مَّرْضَىٰ ۙ وَءَاخَرُونَ يَضْرِبُونَ فِى ٱلْأَرْضِ يَبْتَغُونَ مِن فَضْلِ ٱللَّهِ ۙ وَءَاخَرُونَ يُقَٰتِلُونَ فِى سَبِيلِ ٱللَّهِ ۖ فَٱقْرَءُوا۟ مَا تَيَسَّرَ مِنْهُ ۚ وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ وَأَقْرِضُوا۟ ٱللَّهَ قَرْضًا حَسَنًۭا ۚ وَمَا تُقَدِّمُوا۟ لِأَنفُسِكُم مِّنْ خَيْرٍۢ تَجِدُوهُ عِندَ ٱللَّهِ هُوَ خَيْرًۭا وَأَعْظَمَ أَجْرًۭا ۚ وَٱسْتَغْفِرُوا۟ ٱللَّهَ ۖ إِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۢ"},
      {n:74001,s:"المدثر",a:1,t:"يَٰٓأَيُّهَا ٱلْمُدَّثِّرُ"},
      {n:74002,s:"المدثر",a:2,t:"قُمْ فَأَنذِرْ"},
      {n:74003,s:"المدثر",a:3,t:"وَرَبَّكَ فَكَبِّرْ"},
      {n:74004,s:"المدثر",a:4,t:"وَثِيَابَكَ فَطَهِّرْ"},
      {n:74005,s:"المدثر",a:5,t:"وَٱلرُّجْزَ فَٱهْجُرْ"},
      {n:74006,s:"المدثر",a:6,t:"وَلَا تَمْنُن تَسْتَكْثِرُ"},
      {n:74007,s:"المدثر",a:7,t:"وَلِرَبِّكَ فَٱصْبِرْ"},
      {n:74008,s:"المدثر",a:8,t:"فَإِذَا نُقِرَ فِى ٱلنَّاقُورِ"},
      {n:74009,s:"المدثر",a:9,t:"فَذَٰلِكَ يَوْمَئِذٍۢ يَوْمٌ عَسِيرٌ"},
      {n:74010,s:"المدثر",a:10,t:"عَلَى ٱلْكَٰفِرِينَ غَيْرُ يَسِيرٍۢ"},
      {n:74011,s:"المدثر",a:11,t:"ذَرْنِى وَمَنْ خَلَقْتُ وَحِيدًۭا"},
      {n:74012,s:"المدثر",a:12,t:"وَجَعَلْتُ لَهُۥ مَالًۭا مَّمْدُودًۭا"},
      {n:74013,s:"المدثر",a:13,t:"وَبَنِينَ شُهُودًۭا"},
      {n:74014,s:"المدثر",a:14,t:"وَمَهَّدتُّ لَهُۥ تَمْهِيدًۭا"},
      {n:74015,s:"المدثر",a:15,t:"ثُمَّ يَطْمَعُ أَنْ أَزِيدَ"},
      {n:74016,s:"المدثر",a:16,t:"كَلَّآ ۖ إِنَّهُۥ كَانَ لِءَايَٰتِنَا عَنِيدًۭا"},
      {n:74017,s:"المدثر",a:17,t:"سَأُرْهِقُهُۥ صَعُودًا"},
      {n:74018,s:"المدثر",a:18,t:"إِنَّهُۥ فَكَّرَ وَقَدَّرَ"},
      {n:74019,s:"المدثر",a:19,t:"فَقُتِلَ كَيْفَ قَدَّرَ"},
      {n:74020,s:"المدثر",a:20,t:"ثُمَّ قُتِلَ كَيْفَ قَدَّرَ"},
      {n:74021,s:"المدثر",a:21,t:"ثُمَّ نَظَرَ"},
      {n:74022,s:"المدثر",a:22,t:"ثُمَّ عَبَسَ وَبَسَرَ"},
      {n:74023,s:"المدثر",a:23,t:"ثُمَّ أَدْبَرَ وَٱسْتَكْبَرَ"},
      {n:74024,s:"المدثر",a:24,t:"فَقَالَ إِنْ هَٰذَآ إِلَّا سِحْرٌۭ يُؤْثَرُ"},
      {n:74025,s:"المدثر",a:25,t:"إِنْ هَٰذَآ إِلَّا قَوْلُ ٱلْبَشَرِ"},
      {n:74026,s:"المدثر",a:26,t:"سَأُصْلِيهِ سَقَرَ"},
      {n:74027,s:"المدثر",a:27,t:"وَمَآ أَدْرَىٰكَ مَا سَقَرُ"},
      {n:74028,s:"المدثر",a:28,t:"لَا تُبْقِى وَلَا تَذَرُ"},
      {n:74029,s:"المدثر",a:29,t:"لَوَّاحَةٌۭ لِّلْبَشَرِ"},
      {n:74030,s:"المدثر",a:30,t:"عَلَيْهَا تِسْعَةَ عَشَرَ"},
      {n:74031,s:"المدثر",a:31,t:"وَمَا جَعَلْنَآ أَصْحَٰبَ ٱلنَّارِ إِلَّا مَلَٰٓئِكَةًۭ ۙ وَمَا جَعَلْنَا عِدَّتَهُمْ إِلَّا فِتْنَةًۭ لِّلَّذِينَ كَفَرُوا۟ لِيَسْتَيْقِنَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ وَيَزْدَادَ ٱلَّذِينَ ءَامَنُوٓا۟ إِيمَٰنًۭا ۙ وَلَا يَرْتَابَ ٱلَّذِينَ أُوتُوا۟ ٱلْكِتَٰبَ وَٱلْمُؤْمِنُونَ ۙ وَلِيَقُولَ ٱلَّذِينَ فِى قُلُوبِهِم مَّرَضٌۭ وَٱلْكَٰفِرُونَ مَاذَآ أَرَادَ ٱللَّهُ بِهَٰذَا مَثَلًۭا ۚ كَذَٰلِكَ يُضِلُّ ٱللَّهُ مَن يَشَآءُ وَيَهْدِى مَن يَشَآءُ ۚ وَمَا يَعْلَمُ جُنُودَ رَبِّكَ إِلَّا هُوَ ۚ وَمَا هِىَ إِلَّا ذِكْرَىٰ لِلْبَشَرِ"},
      {n:74032,s:"المدثر",a:32,t:"كَلَّا وَٱلْقَمَرِ"},
      {n:74033,s:"المدثر",a:33,t:"وَٱلَّيْلِ إِذْ أَدْبَرَ"},
      {n:74034,s:"المدثر",a:34,t:"وَٱلصُّبْحِ إِذَآ أَسْفَرَ"},
      {n:74035,s:"المدثر",a:35,t:"إِنَّهَا لَإِحْدَى ٱلْكُبَرِ"},
      {n:74036,s:"المدثر",a:36,t:"نَذِيرًۭا لِّلْبَشَرِ"},
      {n:74037,s:"المدثر",a:37,t:"لِمَن شَآءَ مِنكُمْ أَن يَتَقَدَّمَ أَوْ يَتَأَخَّرَ"},
      {n:74038,s:"المدثر",a:38,t:"كُلُّ نَفْسٍۭ بِمَا كَسَبَتْ رَهِينَةٌ"},
      {n:74039,s:"المدثر",a:39,t:"إِلَّآ أَصْحَٰبَ ٱلْيَمِينِ"},
      {n:74040,s:"المدثر",a:40,t:"فِى جَنَّٰتٍۢ يَتَسَآءَلُونَ"},
      {n:74041,s:"المدثر",a:41,t:"عَنِ ٱلْمُجْرِمِينَ"},
      {n:74042,s:"المدثر",a:42,t:"مَا سَلَكَكُمْ فِى سَقَرَ"},
      {n:74043,s:"المدثر",a:43,t:"قَالُوا۟ لَمْ نَكُ مِنَ ٱلْمُصَلِّينَ"},
      {n:74044,s:"المدثر",a:44,t:"وَلَمْ نَكُ نُطْعِمُ ٱلْمِسْكِينَ"},
      {n:74045,s:"المدثر",a:45,t:"وَكُنَّا نَخُوضُ مَعَ ٱلْخَآئِضِينَ"},
      {n:74046,s:"المدثر",a:46,t:"وَكُنَّا نُكَذِّبُ بِيَوْمِ ٱلدِّينِ"},
      {n:74047,s:"المدثر",a:47,t:"حَتَّىٰٓ أَتَىٰنَا ٱلْيَقِينُ"},
      {n:74048,s:"المدثر",a:48,t:"فَمَا تَنفَعُهُمْ شَفَٰعَةُ ٱلشَّٰفِعِينَ"},
      {n:74049,s:"المدثر",a:49,t:"فَمَا لَهُمْ عَنِ ٱلتَّذْكِرَةِ مُعْرِضِينَ"},
      {n:74050,s:"المدثر",a:50,t:"كَأَنَّهُمْ حُمُرٌۭ مُّسْتَنفِرَةٌۭ"},
      {n:74051,s:"المدثر",a:51,t:"فَرَّتْ مِن قَسْوَرَةٍۭ"},
      {n:74052,s:"المدثر",a:52,t:"بَلْ يُرِيدُ كُلُّ ٱمْرِئٍۢ مِّنْهُمْ أَن يُؤْتَىٰ صُحُفًۭا مُّنَشَّرَةًۭ"},
      {n:74053,s:"المدثر",a:53,t:"كَلَّا ۖ بَل لَّا يَخَافُونَ ٱلْءَاخِرَةَ"},
      {n:74054,s:"المدثر",a:54,t:"كَلَّآ إِنَّهُۥ تَذْكِرَةٌۭ"},
      {n:74055,s:"المدثر",a:55,t:"فَمَن شَآءَ ذَكَرَهُۥ"},
      {n:74056,s:"المدثر",a:56,t:"وَمَا يَذْكُرُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُ ۚ هُوَ أَهْلُ ٱلتَّقْوَىٰ وَأَهْلُ ٱلْمَغْفِرَةِ"},
      {n:75001,s:"القيامة",a:1,t:"لَآ أُقْسِمُ بِيَوْمِ ٱلْقِيَٰمَةِ"},
      {n:75002,s:"القيامة",a:2,t:"وَلَآ أُقْسِمُ بِٱلنَّفْسِ ٱللَّوَّامَةِ"},
      {n:75003,s:"القيامة",a:3,t:"أَيَحْسَبُ ٱلْإِنسَٰنُ أَلَّن نَّجْمَعَ عِظَامَهُۥ"},
      {n:75004,s:"القيامة",a:4,t:"بَلَىٰ قَٰدِرِينَ عَلَىٰٓ أَن نُّسَوِّىَ بَنَانَهُۥ"},
      {n:75005,s:"القيامة",a:5,t:"بَلْ يُرِيدُ ٱلْإِنسَٰنُ لِيَفْجُرَ أَمَامَهُۥ"},
      {n:75006,s:"القيامة",a:6,t:"يَسْـَٔلُ أَيَّانَ يَوْمُ ٱلْقِيَٰمَةِ"},
      {n:75007,s:"القيامة",a:7,t:"فَإِذَا بَرِقَ ٱلْبَصَرُ"},
      {n:75008,s:"القيامة",a:8,t:"وَخَسَفَ ٱلْقَمَرُ"},
      {n:75009,s:"القيامة",a:9,t:"وَجُمِعَ ٱلشَّمْسُ وَٱلْقَمَرُ"},
      {n:75010,s:"القيامة",a:10,t:"يَقُولُ ٱلْإِنسَٰنُ يَوْمَئِذٍ أَيْنَ ٱلْمَفَرُّ"},
      {n:75011,s:"القيامة",a:11,t:"كَلَّا لَا وَزَرَ"},
      {n:75012,s:"القيامة",a:12,t:"إِلَىٰ رَبِّكَ يَوْمَئِذٍ ٱلْمُسْتَقَرُّ"},
      {n:75013,s:"القيامة",a:13,t:"يُنَبَّؤُا۟ ٱلْإِنسَٰنُ يَوْمَئِذٍۭ بِمَا قَدَّمَ وَأَخَّرَ"},
      {n:75014,s:"القيامة",a:14,t:"بَلِ ٱلْإِنسَٰنُ عَلَىٰ نَفْسِهِۦ بَصِيرَةٌۭ"},
      {n:75015,s:"القيامة",a:15,t:"وَلَوْ أَلْقَىٰ مَعَاذِيرَهُۥ"},
      {n:75016,s:"القيامة",a:16,t:"لَا تُحَرِّكْ بِهِۦ لِسَانَكَ لِتَعْجَلَ بِهِۦٓ"},
      {n:75017,s:"القيامة",a:17,t:"إِنَّ عَلَيْنَا جَمْعَهُۥ وَقُرْءَانَهُۥ"},
      {n:75018,s:"القيامة",a:18,t:"فَإِذَا قَرَأْنَٰهُ فَٱتَّبِعْ قُرْءَانَهُۥ"},
      {n:75019,s:"القيامة",a:19,t:"ثُمَّ إِنَّ عَلَيْنَا بَيَانَهُۥ"},
      {n:75020,s:"القيامة",a:20,t:"كَلَّا بَلْ تُحِبُّونَ ٱلْعَاجِلَةَ"},
      {n:75021,s:"القيامة",a:21,t:"وَتَذَرُونَ ٱلْءَاخِرَةَ"},
      {n:75022,s:"القيامة",a:22,t:"وُجُوهٌۭ يَوْمَئِذٍۢ نَّاضِرَةٌ"},
      {n:75023,s:"القيامة",a:23,t:"إِلَىٰ رَبِّهَا نَاظِرَةٌۭ"},
      {n:75024,s:"القيامة",a:24,t:"وَوُجُوهٌۭ يَوْمَئِذٍۭ بَاسِرَةٌۭ"},
      {n:75025,s:"القيامة",a:25,t:"تَظُنُّ أَن يُفْعَلَ بِهَا فَاقِرَةٌۭ"},
      {n:75026,s:"القيامة",a:26,t:"كَلَّآ إِذَا بَلَغَتِ ٱلتَّرَاقِىَ"},
      {n:75027,s:"القيامة",a:27,t:"وَقِيلَ مَنْ ۜ رَاقٍۢ"},
      {n:75028,s:"القيامة",a:28,t:"وَظَنَّ أَنَّهُ ٱلْفِرَاقُ"},
      {n:75029,s:"القيامة",a:29,t:"وَٱلْتَفَّتِ ٱلسَّاقُ بِٱلسَّاقِ"},
      {n:75030,s:"القيامة",a:30,t:"إِلَىٰ رَبِّكَ يَوْمَئِذٍ ٱلْمَسَاقُ"},
      {n:75031,s:"القيامة",a:31,t:"فَلَا صَدَّقَ وَلَا صَلَّىٰ"},
      {n:75032,s:"القيامة",a:32,t:"وَلَٰكِن كَذَّبَ وَتَوَلَّىٰ"},
      {n:75033,s:"القيامة",a:33,t:"ثُمَّ ذَهَبَ إِلَىٰٓ أَهْلِهِۦ يَتَمَطَّىٰٓ"},
      {n:75034,s:"القيامة",a:34,t:"أَوْلَىٰ لَكَ فَأَوْلَىٰ"},
      {n:75035,s:"القيامة",a:35,t:"ثُمَّ أَوْلَىٰ لَكَ فَأَوْلَىٰٓ"},
      {n:75036,s:"القيامة",a:36,t:"أَيَحْسَبُ ٱلْإِنسَٰنُ أَن يُتْرَكَ سُدًى"},
      {n:75037,s:"القيامة",a:37,t:"أَلَمْ يَكُ نُطْفَةًۭ مِّن مَّنِىٍّۢ يُمْنَىٰ"},
      {n:75038,s:"القيامة",a:38,t:"ثُمَّ كَانَ عَلَقَةًۭ فَخَلَقَ فَسَوَّىٰ"},
      {n:75039,s:"القيامة",a:39,t:"فَجَعَلَ مِنْهُ ٱلزَّوْجَيْنِ ٱلذَّكَرَ وَٱلْأُنثَىٰٓ"},
      {n:75040,s:"القيامة",a:40,t:"أَلَيْسَ ذَٰلِكَ بِقَٰدِرٍ عَلَىٰٓ أَن يُحْۦِىَ ٱلْمَوْتَىٰ"},
      {n:76001,s:"الإنسان",a:1,t:"هَلْ أَتَىٰ عَلَى ٱلْإِنسَٰنِ حِينٌۭ مِّنَ ٱلدَّهْرِ لَمْ يَكُن شَيْـًۭٔا مَّذْكُورًا"},
      {n:76002,s:"الإنسان",a:2,t:"إِنَّا خَلَقْنَا ٱلْإِنسَٰنَ مِن نُّطْفَةٍ أَمْشَاجٍۢ نَّبْتَلِيهِ فَجَعَلْنَٰهُ سَمِيعًۢا بَصِيرًا"},
      {n:76003,s:"الإنسان",a:3,t:"إِنَّا هَدَيْنَٰهُ ٱلسَّبِيلَ إِمَّا شَاكِرًۭا وَإِمَّا كَفُورًا"},
      {n:76004,s:"الإنسان",a:4,t:"إِنَّآ أَعْتَدْنَا لِلْكَٰفِرِينَ سَلَٰسِلَا۟ وَأَغْلَٰلًۭا وَسَعِيرًا"},
      {n:76005,s:"الإنسان",a:5,t:"إِنَّ ٱلْأَبْرَارَ يَشْرَبُونَ مِن كَأْسٍۢ كَانَ مِزَاجُهَا كَافُورًا"},
      {n:76006,s:"الإنسان",a:6,t:"عَيْنًۭا يَشْرَبُ بِهَا عِبَادُ ٱللَّهِ يُفَجِّرُونَهَا تَفْجِيرًۭا"},
      {n:76007,s:"الإنسان",a:7,t:"يُوفُونَ بِٱلنَّذْرِ وَيَخَافُونَ يَوْمًۭا كَانَ شَرُّهُۥ مُسْتَطِيرًۭا"},
      {n:76008,s:"الإنسان",a:8,t:"وَيُطْعِمُونَ ٱلطَّعَامَ عَلَىٰ حُبِّهِۦ مِسْكِينًۭا وَيَتِيمًۭا وَأَسِيرًا"},
      {n:76009,s:"الإنسان",a:9,t:"إِنَّمَا نُطْعِمُكُمْ لِوَجْهِ ٱللَّهِ لَا نُرِيدُ مِنكُمْ جَزَآءًۭ وَلَا شُكُورًا"},
      {n:76010,s:"الإنسان",a:10,t:"إِنَّا نَخَافُ مِن رَّبِّنَا يَوْمًا عَبُوسًۭا قَمْطَرِيرًۭا"},
      {n:76011,s:"الإنسان",a:11,t:"فَوَقَىٰهُمُ ٱللَّهُ شَرَّ ذَٰلِكَ ٱلْيَوْمِ وَلَقَّىٰهُمْ نَضْرَةًۭ وَسُرُورًۭا"},
      {n:76012,s:"الإنسان",a:12,t:"وَجَزَىٰهُم بِمَا صَبَرُوا۟ جَنَّةًۭ وَحَرِيرًۭا"},
      {n:76013,s:"الإنسان",a:13,t:"مُّتَّكِـِٔينَ فِيهَا عَلَى ٱلْأَرَآئِكِ ۖ لَا يَرَوْنَ فِيهَا شَمْسًۭا وَلَا زَمْهَرِيرًۭا"},
      {n:76014,s:"الإنسان",a:14,t:"وَدَانِيَةً عَلَيْهِمْ ظِلَٰلُهَا وَذُلِّلَتْ قُطُوفُهَا تَذْلِيلًۭا"},
      {n:76015,s:"الإنسان",a:15,t:"وَيُطَافُ عَلَيْهِم بِـَٔانِيَةٍۢ مِّن فِضَّةٍۢ وَأَكْوَابٍۢ كَانَتْ قَوَارِيرَا۠"},
      {n:76016,s:"الإنسان",a:16,t:"قَوَارِيرَا۟ مِن فِضَّةٍۢ قَدَّرُوهَا تَقْدِيرًۭا"},
      {n:76017,s:"الإنسان",a:17,t:"وَيُسْقَوْنَ فِيهَا كَأْسًۭا كَانَ مِزَاجُهَا زَنجَبِيلًا"},
      {n:76018,s:"الإنسان",a:18,t:"عَيْنًۭا فِيهَا تُسَمَّىٰ سَلْسَبِيلًۭا"},
      {n:76019,s:"الإنسان",a:19,t:"۞ وَيَطُوفُ عَلَيْهِمْ وِلْدَٰنٌۭ مُّخَلَّدُونَ إِذَا رَأَيْتَهُمْ حَسِبْتَهُمْ لُؤْلُؤًۭا مَّنثُورًۭا"},
      {n:76020,s:"الإنسان",a:20,t:"وَإِذَا رَأَيْتَ ثَمَّ رَأَيْتَ نَعِيمًۭا وَمُلْكًۭا كَبِيرًا"},
      {n:76021,s:"الإنسان",a:21,t:"عَٰلِيَهُمْ ثِيَابُ سُندُسٍ خُضْرٌۭ وَإِسْتَبْرَقٌۭ ۖ وَحُلُّوٓا۟ أَسَاوِرَ مِن فِضَّةٍۢ وَسَقَىٰهُمْ رَبُّهُمْ شَرَابًۭا طَهُورًا"},
      {n:76022,s:"الإنسان",a:22,t:"إِنَّ هَٰذَا كَانَ لَكُمْ جَزَآءًۭ وَكَانَ سَعْيُكُم مَّشْكُورًا"},
      {n:76023,s:"الإنسان",a:23,t:"إِنَّا نَحْنُ نَزَّلْنَا عَلَيْكَ ٱلْقُرْءَانَ تَنزِيلًۭا"},
      {n:76024,s:"الإنسان",a:24,t:"فَٱصْبِرْ لِحُكْمِ رَبِّكَ وَلَا تُطِعْ مِنْهُمْ ءَاثِمًا أَوْ كَفُورًۭا"},
      {n:76025,s:"الإنسان",a:25,t:"وَٱذْكُرِ ٱسْمَ رَبِّكَ بُكْرَةًۭ وَأَصِيلًۭا"},
      {n:76026,s:"الإنسان",a:26,t:"وَمِنَ ٱلَّيْلِ فَٱسْجُدْ لَهُۥ وَسَبِّحْهُ لَيْلًۭا طَوِيلًا"},
      {n:76027,s:"الإنسان",a:27,t:"إِنَّ هَٰٓؤُلَآءِ يُحِبُّونَ ٱلْعَاجِلَةَ وَيَذَرُونَ وَرَآءَهُمْ يَوْمًۭا ثَقِيلًۭا"},
      {n:76028,s:"الإنسان",a:28,t:"نَّحْنُ خَلَقْنَٰهُمْ وَشَدَدْنَآ أَسْرَهُمْ ۖ وَإِذَا شِئْنَا بَدَّلْنَآ أَمْثَٰلَهُمْ تَبْدِيلًا"},
      {n:76029,s:"الإنسان",a:29,t:"إِنَّ هَٰذِهِۦ تَذْكِرَةٌۭ ۖ فَمَن شَآءَ ٱتَّخَذَ إِلَىٰ رَبِّهِۦ سَبِيلًۭا"},
      {n:76030,s:"الإنسان",a:30,t:"وَمَا تَشَآءُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُ ۚ إِنَّ ٱللَّهَ كَانَ عَلِيمًا حَكِيمًۭا"},
      {n:76031,s:"الإنسان",a:31,t:"يُدْخِلُ مَن يَشَآءُ فِى رَحْمَتِهِۦ ۚ وَٱلظَّٰلِمِينَ أَعَدَّ لَهُمْ عَذَابًا أَلِيمًۢا"},
      {n:77001,s:"المرسلات",a:1,t:"وَٱلْمُرْسَلَٰتِ عُرْفًۭا"},
      {n:77002,s:"المرسلات",a:2,t:"فَٱلْعَٰصِفَٰتِ عَصْفًۭا"},
      {n:77003,s:"المرسلات",a:3,t:"وَٱلنَّٰشِرَٰتِ نَشْرًۭا"},
      {n:77004,s:"المرسلات",a:4,t:"فَٱلْفَٰرِقَٰتِ فَرْقًۭا"},
      {n:77005,s:"المرسلات",a:5,t:"فَٱلْمُلْقِيَٰتِ ذِكْرًا"},
      {n:77006,s:"المرسلات",a:6,t:"عُذْرًا أَوْ نُذْرًا"},
      {n:77007,s:"المرسلات",a:7,t:"إِنَّمَا تُوعَدُونَ لَوَٰقِعٌۭ"},
      {n:77008,s:"المرسلات",a:8,t:"فَإِذَا ٱلنُّجُومُ طُمِسَتْ"},
      {n:77009,s:"المرسلات",a:9,t:"وَإِذَا ٱلسَّمَآءُ فُرِجَتْ"},
      {n:77010,s:"المرسلات",a:10,t:"وَإِذَا ٱلْجِبَالُ نُسِفَتْ"},
      {n:77011,s:"المرسلات",a:11,t:"وَإِذَا ٱلرُّسُلُ أُقِّتَتْ"},
      {n:77012,s:"المرسلات",a:12,t:"لِأَىِّ يَوْمٍ أُجِّلَتْ"},
      {n:77013,s:"المرسلات",a:13,t:"لِيَوْمِ ٱلْفَصْلِ"},
      {n:77014,s:"المرسلات",a:14,t:"وَمَآ أَدْرَىٰكَ مَا يَوْمُ ٱلْفَصْلِ"},
      {n:77015,s:"المرسلات",a:15,t:"وَيْلٌۭ يَوْمَئِذٍۢ لِّلْمُكَذِّبِينَ"},
      {n:77016,s:"المرسلات",a:16,t:"أَلَمْ نُهْلِكِ ٱلْأَوَّلِينَ"},
      {n:77017,s:"المرسلات",a:17,t:"ثُمَّ نُتْبِعُهُمُ ٱلْءَاخِرِينَ"},
      {n:77018,s:"المرسلات",a:18,t:"كَذَٰلِكَ نَفْعَلُ بِٱلْمُجْرِمِينَ"},
      {n:77019,s:"المرسلات",a:19,t:"وَيْلٌۭ يَوْمَئِذٍۢ لِّلْمُكَذِّبِينَ"},
      {n:77020,s:"المرسلات",a:20,t:"أَلَمْ نَخْلُقكُّم مِّن مَّآءٍۢ مَّهِينٍۢ"},
      {n:77021,s:"المرسلات",a:21,t:"فَجَعَلْنَٰهُ فِى قَرَارٍۢ مَّكِينٍ"},
      {n:77022,s:"المرسلات",a:22,t:"إِلَىٰ قَدَرٍۢ مَّعْلُومٍۢ"},
      {n:77023,s:"المرسلات",a:23,t:"فَقَدَرْنَا فَنِعْمَ ٱلْقَٰدِرُونَ"},
      {n:77024,s:"المرسلات",a:24,t:"وَيْلٌۭ يَوْمَئِذٍۢ لِّلْمُكَذِّبِينَ"},
      {n:77025,s:"المرسلات",a:25,t:"أَلَمْ نَجْعَلِ ٱلْأَرْضَ كِفَاتًا"},
      {n:77026,s:"المرسلات",a:26,t:"أَحْيَآءًۭ وَأَمْوَٰتًۭا"},
      {n:77027,s:"المرسلات",a:27,t:"وَجَعَلْنَا فِيهَا رَوَٰسِىَ شَٰمِخَٰتٍۢ وَأَسْقَيْنَٰكُم مَّآءًۭ فُرَاتًۭا"},
      {n:77028,s:"المرسلات",a:28,t:"وَيْلٌۭ يَوْمَئِذٍۢ لِّلْمُكَذِّبِينَ"},
      {n:77029,s:"المرسلات",a:29,t:"ٱنطَلِقُوٓا۟ إِلَىٰ مَا كُنتُم بِهِۦ تُكَذِّبُونَ"},
      {n:77030,s:"المرسلات",a:30,t:"ٱنطَلِقُوٓا۟ إِلَىٰ ظِلٍّۢ ذِى ثَلَٰثِ شُعَبٍۢ"},
      {n:77031,s:"المرسلات",a:31,t:"لَّا ظَلِيلٍۢ وَلَا يُغْنِى مِنَ ٱللَّهَبِ"},
      {n:77032,s:"المرسلات",a:32,t:"إِنَّهَا تَرْمِى بِشَرَرٍۢ كَٱلْقَصْرِ"},
      {n:77033,s:"المرسلات",a:33,t:"كَأَنَّهُۥ جِمَٰلَتٌۭ صُفْرٌۭ"},
      {n:77034,s:"المرسلات",a:34,t:"وَيْلٌۭ يَوْمَئِذٍۢ لِّلْمُكَذِّبِينَ"},
      {n:77035,s:"المرسلات",a:35,t:"هَٰذَا يَوْمُ لَا يَنطِقُونَ"},
      {n:77036,s:"المرسلات",a:36,t:"وَلَا يُؤْذَنُ لَهُمْ فَيَعْتَذِرُونَ"},
      {n:77037,s:"المرسلات",a:37,t:"وَيْلٌۭ يَوْمَئِذٍۢ لِّلْمُكَذِّبِينَ"},
      {n:77038,s:"المرسلات",a:38,t:"هَٰذَا يَوْمُ ٱلْفَصْلِ ۖ جَمَعْنَٰكُمْ وَٱلْأَوَّلِينَ"},
      {n:77039,s:"المرسلات",a:39,t:"فَإِن كَانَ لَكُمْ كَيْدٌۭ فَكِيدُونِ"},
      {n:77040,s:"المرسلات",a:40,t:"وَيْلٌۭ يَوْمَئِذٍۢ لِّلْمُكَذِّبِينَ"},
      {n:77041,s:"المرسلات",a:41,t:"إِنَّ ٱلْمُتَّقِينَ فِى ظِلَٰلٍۢ وَعُيُونٍۢ"},
      {n:77042,s:"المرسلات",a:42,t:"وَفَوَٰكِهَ مِمَّا يَشْتَهُونَ"},
      {n:77043,s:"المرسلات",a:43,t:"كُلُوا۟ وَٱشْرَبُوا۟ هَنِيٓـًٔۢا بِمَا كُنتُمْ تَعْمَلُونَ"},
      {n:77044,s:"المرسلات",a:44,t:"إِنَّا كَذَٰلِكَ نَجْزِى ٱلْمُحْسِنِينَ"},
      {n:77045,s:"المرسلات",a:45,t:"وَيْلٌۭ يَوْمَئِذٍۢ لِّلْمُكَذِّبِينَ"},
      {n:77046,s:"المرسلات",a:46,t:"كُلُوا۟ وَتَمَتَّعُوا۟ قَلِيلًا إِنَّكُم مُّجْرِمُونَ"},
      {n:77047,s:"المرسلات",a:47,t:"وَيْلٌۭ يَوْمَئِذٍۢ لِّلْمُكَذِّبِينَ"},
      {n:77048,s:"المرسلات",a:48,t:"وَإِذَا قِيلَ لَهُمُ ٱرْكَعُوا۟ لَا يَرْكَعُونَ"},
      {n:77049,s:"المرسلات",a:49,t:"وَيْلٌۭ يَوْمَئِذٍۢ لِّلْمُكَذِّبِينَ"},
      {n:77050,s:"المرسلات",a:50,t:"فَبِأَىِّ حَدِيثٍۭ بَعْدَهُۥ يُؤْمِنُونَ"}
    ],

   59:{nm:'الحشر',p:'مدنية',ab:'قصة إجلاء يهود بني النضير الذين ظنوا أن حصونهم تحميهم، ثم أجملُ وصف للأنصار: «وَيُؤْثِرُونَ عَلَىٰٓ أَنفُسِهِمْ» — وختامٌ بأسماء الله الحسنى.',

          {q:'ماذا يحدث للجبل لو أُنزل عليه هذا القرآن؟',o:['لرأيته خاشعًا متصدعًا من خشية الله','يتحول ذهبًا','يصير سهلًا','لا يحدث شيء'],a:0,e:'«لَوْ أَنزَلْنَا هَٰذَا ٱلْقُرْءَانَ عَلَىٰ جَبَلٍۢ...» — الجبل الأصم يتشقق من الخشية، فكيف بقلوبنا ونحن نسمعه كل يوم؟',y:59021}]},
   60:{nm:'الممتحنة',p:'مدنية',ab:'الولاء لله لا لأعدائه، وقدوةُ إبراهيم في البراءة من الشرك — مع قاعدة العدل الذهبية: من لم يقاتلنا في الدين نبرّه ونقسط إليه.',
       w:[['أسوة','قدوةٌ يُقتدى بها'],['يثقفوكم','يظفروا بكم'],['تقسطوا','تعدلوا'],['امتحنوهن','اختبروهن'],['الكوافر','النساء الكافرات'],['ظاهروا','عاونوا']],
       q:[{q:'من الذي ذكرته السورة قدوةً حسنة للمؤمنين؟',o:['إبراهيم عليه السلام والذين معه','داود عليه السلام','أهل الكهف','لقمان الحكيم'],a:0,e:'«قَدْ كَانَتْ لَكُمْ أُسْوَةٌ حَسَنَةٌۭ فِىٓ إِبْرَٰهِيمَ وَٱلَّذِينَ مَعَهُۥٓ» — في البراءة من الشرك والثبات على التوحيد.',y:60004},
          {q:'ماذا قالت السورة عن التعامل مع من لم يقاتلونا في الدين؟',o:['لا ينهانا الله أن نبرّهم ونقسط إليهم، إن الله يحب المقسطين','نقاطعهم تمامًا','نجبرهم على الإسلام','نأخذ أموالهم'],a:0,e:'قاعدة الإسلام في التعامل مع المسالمين: بِرٌّ وعدل — والنهي فقط عن موالاة من قاتل وأخرج.',y:60008}]},
   61:{nm:'الصف',p:'مدنية',ab:'سؤالٌ يهزّ الضمير: «لِمَ تَقُولُونَ مَا لَا تَفْعَلُونَ؟» — وبشارة عيسى برسولٍ اسمه أحمد، والتجارة التي تنجي من عذاب أليم.',
       w:[['مرصوص','متراصٌّ محكمُ البناء'],['زاغوا','مالوا عن الحق'],['مقتا','بغضًا شديدًا'],['الحواريين','أصفياءِ عيسى وأنصاره'],['ظاهرين','غالبين منتصرين']],

          {q:'ما «التجارة» التي تنجي من عذاب أليم في سورة الصف؟',o:['الإيمان بالله ورسوله والجهاد في سبيله بالمال والنفس','تجارة الذهب','الصدق في البيع','الزراعة'],a:0,e:'«هَلْ أَدُلُّكُمْ عَلَىٰ تِجَٰرَةٍۢ تُنجِيكُم...» — تجارة رأس مالها الإيمان وربحها مغفرةٌ وجنات ونصرٌ وفتح قريب.',y:61010},
          {q:'من الذين قالوا «نَحْنُ أَنصَارُ ٱللَّهِ»؟',o:['الحواريون أصفياء عيسى','أهل بدر','الأنصار في المدينة','قوم موسى'],a:0,e:'حين سألهم عيسى: «مَنْ أَنصَارِىٓ إِلَى ٱللَّهِ» — والسورة تدعونا نكون مثلهم: «كُونُوٓا۟ أَنصَارَ ٱللَّهِ».',y:61014}]},
   62:{nm:'الجمعة',p:'مدنية',ab:'بعثة الرسول ﷺ في الأميين يزكيهم ويعلمهم، ومَثَلُ من حمل العلم ولم يعمل به — ثم أحكام يوم الجمعة: اسعَوا إلى ذكر الله وذروا البيع.',

       q:[{q:'بماذا شبهت السورة من حُمِّلوا التوراة ثم لم يعملوا بها؟',o:['كمثل الحمار يحمل أسفارًا','كمثل العنكبوت','كمثل الذي استوقد نارًا','كصاحب الجنتين'],a:0,e:'يحمل كتبًا عظيمة ولا يدري ما فيها — العلم بلا عمل حِملٌ بلا نفع. والتشبيه تحذيرٌ لنا قبل غيرنا.',y:62005},
          {q:'ماذا يفعل المؤمن إذا نُودي لصلاة الجمعة؟',o:['يسعى إلى ذكر الله ويذر البيع','يكمل تجارته ثم يصلي','يصلي في بيته','ينتظر حتى تنتهي الخطبة'],a:0,e:'«فَٱسْعَوْا۟ إِلَىٰ ذِكْرِ ٱللَّهِ وَذَرُوا۟ ٱلْبَيْعَ» — وبعد الصلاة: «فَٱنتَشِرُوا۟ فِى ٱلْأَرْضِ وَٱبْتَغُوا۟ مِن فَضْلِ ٱللَّهِ». توازنٌ كامل بين الدين والعمل.',y:62009}]},
   63:{nm:'المنافقون',p:'مدنية',ab:'كشفٌ لصفات المنافقين: أيمانٌ كاذبة يتسترون بها، وأجسامٌ تعجبك بلا قلوب — وتحذيرٌ للمؤمنين: لا تلهكم أموالكم ولا أولادكم عن ذكر الله.',

          {q:'ما التحذير الذي ختمت به السورة للمؤمنين؟',o:['لا تلهكم أموالكم ولا أولادكم عن ذكر الله، وأنفقوا قبل أن يأتي الموت','لا تسافروا ليلًا','لا تكثروا الكلام','لا تصاحبوا الأغنياء'],a:0,e:'«وَأَنفِقُوا۟ مِن مَّا رَزَقْنَٰكُم مِّن قَبْلِ أَن يَأْتِىَ أَحَدَكُمُ ٱلْمَوْتُ فَيَقُولَ رَبِّ لَوْلَآ أَخَّرْتَنِىٓ...» — ساعتها مفيش تأجيل.',y:63009}]},
   64:{nm:'التغابن',p:'مدنية',ab:'يوم الجمع هو «يوم التغابن» — يومَ يَغبن أهلُ الجنة أهلَ النار. وفيها قاعدة الطمأنينة: ما أصاب من مصيبة إلا بإذن الله.',

          {q:'«إِنَّمَآ أَمْوَٰلُكُمْ وَأَوْلَٰدُكُمْ فِتْنَةٌۭ» — ما معنى فتنة هنا؟',o:['اختبار وابتلاء: هل تشغلك عن الله أم تشكر بها؟','مصيبة يجب التخلص منها','عقوبة من الله','سحر'],a:0,e:'مش مطلوب تكره مالك وولادك — مطلوب ما يبقوش سببًا في نسيان ربك. «وَٱللَّهُ عِندَهُۥٓ أَجْرٌ عَظِيمٌۭ».',y:64015}]},
   65:{nm:'الطلاق',p:'مدنية',ab:'أحكام العدة والسكنى والنفقة بميزان الرحمة — وفي وسطها أشهرُ وعدٍ في القرآن: «وَمَن يَتَّقِ ٱللَّهَ يَجْعَل لَّهُۥ مَخْرَجًۭا».',

          {q:'«لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا مَآ ءَاتَىٰهَا» — في أي سياق جاءت؟',o:['النفقة: ينفق الموسر من سعته والمُقتَّر مما آتاه الله','الصلاة','الصيام','الحج'],a:0,e:'حتى في أصعب المواقف الأسرية، التكليف على قدر الطاقة — «سَيَجْعَلُ ٱللَّهُ بَعْدَ عُسْرٍۢ يُسْرًۭا».',y:65007}]},
   66:{nm:'التحريم',p:'مدنية',ab:'عتابٌ رقيق للنبي ﷺ، وأمرٌ جامع: «قُوٓا۟ أَنفُسَكُمْ وَأَهْلِيكُمْ نَارًۭا» — وأربعة أمثلة نسائية خالدة: امرأتا نوح ولوط، وامرأة فرعون، ومريم.',

          {q:'«قُوٓا۟ أَنفُسَكُمْ وَأَهْلِيكُمْ نَارًۭا» — من الموكَّلون بهذه النار؟',o:['ملائكة غلاظ شداد لا يعصون الله ما أمرهم','الجن','خزنة من البشر','الشياطين'],a:0,e:'الآية تحمّلنا مسؤولية مضاعفة: نجاة أنفسنا ونجاة أهل بيتنا — بالتعليم والقدوة والدعاء.',y:66006}]}

  ayat: [
      {n:58001,s:"المجادلة",a:1,t:"قَدْ سَمِعَ ٱللَّهُ قَوْلَ ٱلَّتِى تُجَٰدِلُكَ فِى زَوْجِهَا وَتَشْتَكِىٓ إِلَى ٱللَّهِ وَٱللَّهُ يَسْمَعُ تَحَاوُرَكُمَآ ۚ إِنَّ ٱللَّهَ سَمِيعٌۢ بَصِيرٌ"},
      {n:58002,s:"المجادلة",a:2,t:"ٱلَّذِينَ يُظَٰهِرُونَ مِنكُم مِّن نِّسَآئِهِم مَّا هُنَّ أُمَّهَٰتِهِمْ ۖ إِنْ أُمَّهَٰتُهُمْ إِلَّا ٱلَّٰٓـِٔى وَلَدْنَهُمْ ۚ وَإِنَّهُمْ لَيَقُولُونَ مُنكَرًۭا مِّنَ ٱلْقَوْلِ وَزُورًۭا ۚ وَإِنَّ ٱللَّهَ لَعَفُوٌّ غَفُورٌۭ"},
      {n:58003,s:"المجادلة",a:3,t:"وَٱلَّذِينَ يُظَٰهِرُونَ مِن نِّسَآئِهِمْ ثُمَّ يَعُودُونَ لِمَا قَالُوا۟ فَتَحْرِيرُ رَقَبَةٍۢ مِّن قَبْلِ أَن يَتَمَآسَّا ۚ ذَٰلِكُمْ تُوعَظُونَ بِهِۦ ۚ وَٱللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌۭ"},
      {n:58004,s:"المجادلة",a:4,t:"فَمَن لَّمْ يَجِدْ فَصِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ مِن قَبْلِ أَن يَتَمَآسَّا ۖ فَمَن لَّمْ يَسْتَطِعْ فَإِطْعَامُ سِتِّينَ مِسْكِينًۭا ۚ ذَٰلِكَ لِتُؤْمِنُوا۟ بِٱللَّهِ وَرَسُولِهِۦ ۚ وَتِلْكَ حُدُودُ ٱللَّهِ ۗ وَلِلْكَٰفِرِينَ عَذَابٌ أَلِيمٌ"},
      {n:58005,s:"المجادلة",a:5,t:"إِنَّ ٱلَّذِينَ يُحَآدُّونَ ٱللَّهَ وَرَسُولَهُۥ كُبِتُوا۟ كَمَا كُبِتَ ٱلَّذِينَ مِن قَبْلِهِمْ ۚ وَقَدْ أَنزَلْنَآ ءَايَٰتٍۭ بَيِّنَٰتٍۢ ۚ وَلِلْكَٰفِرِينَ عَذَابٌۭ مُّهِينٌۭ"},
      {n:58006,s:"المجادلة",a:6,t:"يَوْمَ يَبْعَثُهُمُ ٱللَّهُ جَمِيعًۭا فَيُنَبِّئُهُم بِمَا عَمِلُوٓا۟ ۚ أَحْصَىٰهُ ٱللَّهُ وَنَسُوهُ ۚ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ شَهِيدٌ"},
      {n:58007,s:"المجادلة",a:7,t:"أَلَمْ تَرَ أَنَّ ٱللَّهَ يَعْلَمُ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۖ مَا يَكُونُ مِن نَّجْوَىٰ ثَلَٰثَةٍ إِلَّا هُوَ رَابِعُهُمْ وَلَا خَمْسَةٍ إِلَّا هُوَ سَادِسُهُمْ وَلَآ أَدْنَىٰ مِن ذَٰلِكَ وَلَآ أَكْثَرَ إِلَّا هُوَ مَعَهُمْ أَيْنَ مَا كَانُوا۟ ۖ ثُمَّ يُنَبِّئُهُم بِمَا عَمِلُوا۟ يَوْمَ ٱلْقِيَٰمَةِ ۚ إِنَّ ٱللَّهَ بِكُلِّ شَىْءٍ عَلِيمٌ"},
      {n:58008,s:"المجادلة",a:8,t:"أَلَمْ تَرَ إِلَى ٱلَّذِينَ نُهُوا۟ عَنِ ٱلنَّجْوَىٰ ثُمَّ يَعُودُونَ لِمَا نُهُوا۟ عَنْهُ وَيَتَنَٰجَوْنَ بِٱلْإِثْمِ وَٱلْعُدْوَٰنِ وَمَعْصِيَتِ ٱلرَّسُولِ وَإِذَا جَآءُوكَ حَيَّوْكَ بِمَا لَمْ يُحَيِّكَ بِهِ ٱللَّهُ وَيَقُولُونَ فِىٓ أَنفُسِهِمْ لَوْلَا يُعَذِّبُنَا ٱللَّهُ بِمَا نَقُولُ ۚ حَسْبُهُمْ جَهَنَّمُ يَصْلَوْنَهَا ۖ فَبِئْسَ ٱلْمَصِيرُ"},
      {n:58009,s:"المجادلة",a:9,t:"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا تَنَٰجَيْتُمْ فَلَا تَتَنَٰجَوْا۟ بِٱلْإِثْمِ وَٱلْعُدْوَٰنِ وَمَعْصِيَتِ ٱلرَّسُولِ وَتَنَٰجَوْا۟ بِٱلْبِرِّ وَٱلتَّقْوَىٰ ۖ وَٱتَّقُوا۟ ٱللَّهَ ٱلَّذِىٓ إِلَيْهِ تُحْشَرُونَ"},
      {n:58010,s:"المجادلة",a:10,t:"إِنَّمَا ٱلنَّجْوَىٰ مِنَ ٱلشَّيْطَٰنِ لِيَحْزُنَ ٱلَّذِينَ ءَامَنُوا۟ وَلَيْسَ بِضَآرِّهِمْ شَيْـًٔا إِلَّا بِإِذْنِ ٱللَّهِ ۚ وَعَلَى ٱللَّهِ فَلْيَتَوَكَّلِ ٱلْمُؤْمِنُونَ"},
      {n:58011,s:"المجادلة",a:11,t:"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا قِيلَ لَكُمْ تَفَسَّحُوا۟ فِى ٱلْمَجَٰلِسِ فَٱفْسَحُوا۟ يَفْسَحِ ٱللَّهُ لَكُمْ ۖ وَإِذَا قِيلَ ٱنشُزُوا۟ فَٱنشُزُوا۟ يَرْفَعِ ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ مِنكُمْ وَٱلَّذِينَ أُوتُوا۟ ٱلْعِلْمَ دَرَجَٰتٍۢ ۚ وَٱللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌۭ"},
      {n:58012,s:"المجادلة",a:12,t:"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا نَٰجَيْتُمُ ٱلرَّسُولَ فَقَدِّمُوا۟ بَيْنَ يَدَىْ نَجْوَىٰكُمْ صَدَقَةًۭ ۚ ذَٰلِكَ خَيْرٌۭ لَّكُمْ وَأَطْهَرُ ۚ فَإِن لَّمْ تَجِدُوا۟ فَإِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌ"},
      {n:58013,s:"المجادلة",a:13,t:"ءَأَشْفَقْتُمْ أَن تُقَدِّمُوا۟ بَيْنَ يَدَىْ نَجْوَىٰكُمْ صَدَقَٰتٍۢ ۚ فَإِذْ لَمْ تَفْعَلُوا۟ وَتَابَ ٱللَّهُ عَلَيْكُمْ فَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ وَأَطِيعُوا۟ ٱللَّهَ وَرَسُولَهُۥ ۚ وَٱللَّهُ خَبِيرٌۢ بِمَا تَعْمَلُونَ"},
      {n:58014,s:"المجادلة",a:14,t:"۞ أَلَمْ تَرَ إِلَى ٱلَّذِينَ تَوَلَّوْا۟ قَوْمًا غَضِبَ ٱللَّهُ عَلَيْهِم مَّا هُم مِّنكُمْ وَلَا مِنْهُمْ وَيَحْلِفُونَ عَلَى ٱلْكَذِبِ وَهُمْ يَعْلَمُونَ"},
      {n:58015,s:"المجادلة",a:15,t:"أَعَدَّ ٱللَّهُ لَهُمْ عَذَابًۭا شَدِيدًا ۖ إِنَّهُمْ سَآءَ مَا كَانُوا۟ يَعْمَلُونَ"},
      {n:58016,s:"المجادلة",a:16,t:"ٱتَّخَذُوٓا۟ أَيْمَٰنَهُمْ جُنَّةًۭ فَصَدُّوا۟ عَن سَبِيلِ ٱللَّهِ فَلَهُمْ عَذَابٌۭ مُّهِينٌۭ"},
      {n:58017,s:"المجادلة",a:17,t:"لَّن تُغْنِىَ عَنْهُمْ أَمْوَٰلُهُمْ وَلَآ أَوْلَٰدُهُم مِّنَ ٱللَّهِ شَيْـًٔا ۚ أُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلنَّارِ ۖ هُمْ فِيهَا خَٰلِدُونَ"},
      {n:58018,s:"المجادلة",a:18,t:"يَوْمَ يَبْعَثُهُمُ ٱللَّهُ جَمِيعًۭا فَيَحْلِفُونَ لَهُۥ كَمَا يَحْلِفُونَ لَكُمْ ۖ وَيَحْسَبُونَ أَنَّهُمْ عَلَىٰ شَىْءٍ ۚ أَلَآ إِنَّهُمْ هُمُ ٱلْكَٰذِبُونَ"},
      {n:58019,s:"المجادلة",a:19,t:"ٱسْتَحْوَذَ عَلَيْهِمُ ٱلشَّيْطَٰنُ فَأَنسَىٰهُمْ ذِكْرَ ٱللَّهِ ۚ أُو۟لَٰٓئِكَ حِزْبُ ٱلشَّيْطَٰنِ ۚ أَلَآ إِنَّ حِزْبَ ٱلشَّيْطَٰنِ هُمُ ٱلْخَٰسِرُونَ"},
      {n:58020,s:"المجادلة",a:20,t:"إِنَّ ٱلَّذِينَ يُحَآدُّونَ ٱللَّهَ وَرَسُولَهُۥٓ أُو۟لَٰٓئِكَ فِى ٱلْأَذَلِّينَ"},
      {n:58021,s:"المجادلة",a:21,t:"كَتَبَ ٱللَّهُ لَأَغْلِبَنَّ أَنَا۠ وَرُسُلِىٓ ۚ إِنَّ ٱللَّهَ قَوِىٌّ عَزِيزٌۭ"},
      {n:58022,s:"المجادلة",a:22,t:"لَّا تَجِدُ قَوْمًۭا يُؤْمِنُونَ بِٱللَّهِ وَٱلْيَوْمِ ٱلْءَاخِرِ يُوَآدُّونَ مَنْ حَآدَّ ٱللَّهَ وَرَسُولَهُۥ وَلَوْ كَانُوٓا۟ ءَابَآءَهُمْ أَوْ أَبْنَآءَهُمْ أَوْ إِخْوَٰنَهُمْ أَوْ عَشِيرَتَهُمْ ۚ أُو۟لَٰٓئِكَ كَتَبَ فِى قُلُوبِهِمُ ٱلْإِيمَٰنَ وَأَيَّدَهُم بِرُوحٍۢ مِّنْهُ ۖ وَيُدْخِلُهُمْ جَنَّٰتٍۢ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ خَٰلِدِينَ فِيهَا ۚ رَضِىَ ٱللَّهُ عَنْهُمْ وَرَضُوا۟ عَنْهُ ۚ أُو۟لَٰٓئِكَ حِزْبُ ٱللَّهِ ۚ أَلَآ إِنَّ حِزْبَ ٱللَّهِ هُمُ ٱلْمُفْلِحُونَ"},
      {n:59001,s:"الحشر",a:1,t:"سَبَّحَ لِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۖ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ"},
      {n:59002,s:"الحشر",a:2,t:"هُوَ ٱلَّذِىٓ أَخْرَجَ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ ٱلْكِتَٰبِ مِن دِيَٰرِهِمْ لِأَوَّلِ ٱلْحَشْرِ ۚ مَا ظَنَنتُمْ أَن يَخْرُجُوا۟ ۖ وَظَنُّوٓا۟ أَنَّهُم مَّانِعَتُهُمْ حُصُونُهُم مِّنَ ٱللَّهِ فَأَتَىٰهُمُ ٱللَّهُ مِنْ حَيْثُ لَمْ يَحْتَسِبُوا۟ ۖ وَقَذَفَ فِى قُلُوبِهِمُ ٱلرُّعْبَ ۚ يُخْرِبُونَ بُيُوتَهُم بِأَيْدِيهِمْ وَأَيْدِى ٱلْمُؤْمِنِينَ فَٱعْتَبِرُوا۟ يَٰٓأُو۟لِى ٱلْأَبْصَٰرِ"},
      {n:59003,s:"الحشر",a:3,t:"وَلَوْلَآ أَن كَتَبَ ٱللَّهُ عَلَيْهِمُ ٱلْجَلَآءَ لَعَذَّبَهُمْ فِى ٱلدُّنْيَا ۖ وَلَهُمْ فِى ٱلْءَاخِرَةِ عَذَابُ ٱلنَّارِ"},
      {n:59004,s:"الحشر",a:4,t:"ذَٰلِكَ بِأَنَّهُمْ شَآقُّوا۟ ٱللَّهَ وَرَسُولَهُۥ ۖ وَمَن يُشَآقِّ ٱللَّهَ فَإِنَّ ٱللَّهَ شَدِيدُ ٱلْعِقَابِ"},
      {n:59005,s:"الحشر",a:5,t:"مَا قَطَعْتُم مِّن لِّينَةٍ أَوْ تَرَكْتُمُوهَا قَآئِمَةً عَلَىٰٓ أُصُولِهَا فَبِإِذْنِ ٱللَّهِ وَلِيُخْزِىَ ٱلْفَٰسِقِينَ"},
      {n:59006,s:"الحشر",a:6,t:"وَمَآ أَفَآءَ ٱللَّهُ عَلَىٰ رَسُولِهِۦ مِنْهُمْ فَمَآ أَوْجَفْتُمْ عَلَيْهِ مِنْ خَيْلٍۢ وَلَا رِكَابٍۢ وَلَٰكِنَّ ٱللَّهَ يُسَلِّطُ رُسُلَهُۥ عَلَىٰ مَن يَشَآءُ ۚ وَٱللَّهُ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ"},
      {n:59007,s:"الحشر",a:7,t:"مَّآ أَفَآءَ ٱللَّهُ عَلَىٰ رَسُولِهِۦ مِنْ أَهْلِ ٱلْقُرَىٰ فَلِلَّهِ وَلِلرَّسُولِ وَلِذِى ٱلْقُرْبَىٰ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينِ وَٱبْنِ ٱلسَّبِيلِ كَىْ لَا يَكُونَ دُولَةًۢ بَيْنَ ٱلْأَغْنِيَآءِ مِنكُمْ ۚ وَمَآ ءَاتَىٰكُمُ ٱلرَّسُولُ فَخُذُوهُ وَمَا نَهَىٰكُمْ عَنْهُ فَٱنتَهُوا۟ ۚ وَٱتَّقُوا۟ ٱللَّهَ ۖ إِنَّ ٱللَّهَ شَدِيدُ ٱلْعِقَابِ"},
      {n:59008,s:"الحشر",a:8,t:"لِلْفُقَرَآءِ ٱلْمُهَٰجِرِينَ ٱلَّذِينَ أُخْرِجُوا۟ مِن دِيَٰرِهِمْ وَأَمْوَٰلِهِمْ يَبْتَغُونَ فَضْلًۭا مِّنَ ٱللَّهِ وَرِضْوَٰنًۭا وَيَنصُرُونَ ٱللَّهَ وَرَسُولَهُۥٓ ۚ أُو۟لَٰٓئِكَ هُمُ ٱلصَّٰدِقُونَ"},
      {n:59009,s:"الحشر",a:9,t:"وَٱلَّذِينَ تَبَوَّءُو ٱلدَّارَ وَٱلْإِيمَٰنَ مِن قَبْلِهِمْ يُحِبُّونَ مَنْ هَاجَرَ إِلَيْهِمْ وَلَا يَجِدُونَ فِى صُدُورِهِمْ حَاجَةًۭ مِّمَّآ أُوتُوا۟ وَيُؤْثِرُونَ عَلَىٰٓ أَنفُسِهِمْ وَلَوْ كَانَ بِهِمْ خَصَاصَةٌۭ ۚ وَمَن يُوقَ شُحَّ نَفْسِهِۦ فَأُو۟لَٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ"},
      {n:59010,s:"الحشر",a:10,t:"وَٱلَّذِينَ جَآءُو مِنۢ بَعْدِهِمْ يَقُولُونَ رَبَّنَا ٱغْفِرْ لَنَا وَلِإِخْوَٰنِنَا ٱلَّذِينَ سَبَقُونَا بِٱلْإِيمَٰنِ وَلَا تَجْعَلْ فِى قُلُوبِنَا غِلًّۭا لِّلَّذِينَ ءَامَنُوا۟ رَبَّنَآ إِنَّكَ رَءُوفٌۭ رَّحِيمٌ"},
      {n:59011,s:"الحشر",a:11,t:"۞ أَلَمْ تَرَ إِلَى ٱلَّذِينَ نَافَقُوا۟ يَقُولُونَ لِإِخْوَٰنِهِمُ ٱلَّذِينَ كَفَرُوا۟ مِنْ أَهْلِ ٱلْكِتَٰبِ لَئِنْ أُخْرِجْتُمْ لَنَخْرُجَنَّ مَعَكُمْ وَلَا نُطِيعُ فِيكُمْ أَحَدًا أَبَدًۭا وَإِن قُوتِلْتُمْ لَنَنصُرَنَّكُمْ وَٱللَّهُ يَشْهَدُ إِنَّهُمْ لَكَٰذِبُونَ"},
      {n:59012,s:"الحشر",a:12,t:"لَئِنْ أُخْرِجُوا۟ لَا يَخْرُجُونَ مَعَهُمْ وَلَئِن قُوتِلُوا۟ لَا يَنصُرُونَهُمْ وَلَئِن نَّصَرُوهُمْ لَيُوَلُّنَّ ٱلْأَدْبَٰرَ ثُمَّ لَا يُنصَرُونَ"},
      {n:59013,s:"الحشر",a:13,t:"لَأَنتُمْ أَشَدُّ رَهْبَةًۭ فِى صُدُورِهِم مِّنَ ٱللَّهِ ۚ ذَٰلِكَ بِأَنَّهُمْ قَوْمٌۭ لَّا يَفْقَهُونَ"},
      {n:59014,s:"الحشر",a:14,t:"لَا يُقَٰتِلُونَكُمْ جَمِيعًا إِلَّا فِى قُرًۭى مُّحَصَّنَةٍ أَوْ مِن وَرَآءِ جُدُرٍۭ ۚ بَأْسُهُم بَيْنَهُمْ شَدِيدٌۭ ۚ تَحْسَبُهُمْ جَمِيعًۭا وَقُلُوبُهُمْ شَتَّىٰ ۚ ذَٰلِكَ بِأَنَّهُمْ قَوْمٌۭ لَّا يَعْقِلُونَ"},
      {n:59015,s:"الحشر",a:15,t:"كَمَثَلِ ٱلَّذِينَ مِن قَبْلِهِمْ قَرِيبًۭا ۖ ذَاقُوا۟ وَبَالَ أَمْرِهِمْ وَلَهُمْ عَذَابٌ أَلِيمٌۭ"},
      {n:59016,s:"الحشر",a:16,t:"كَمَثَلِ ٱلشَّيْطَٰنِ إِذْ قَالَ لِلْإِنسَٰنِ ٱكْفُرْ فَلَمَّا كَفَرَ قَالَ إِنِّى بَرِىٓءٌۭ مِّنكَ إِنِّىٓ أَخَافُ ٱللَّهَ رَبَّ ٱلْعَٰلَمِينَ"},
      {n:59017,s:"الحشر",a:17,t:"فَكَانَ عَٰقِبَتَهُمَآ أَنَّهُمَا فِى ٱلنَّارِ خَٰلِدَيْنِ فِيهَا ۚ وَذَٰلِكَ جَزَٰٓؤُا۟ ٱلظَّٰلِمِينَ"},
      {n:59018,s:"الحشر",a:18,t:"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ وَلْتَنظُرْ نَفْسٌۭ مَّا قَدَّمَتْ لِغَدٍۢ ۖ وَٱتَّقُوا۟ ٱللَّهَ ۚ إِنَّ ٱللَّهَ خَبِيرٌۢ بِمَا تَعْمَلُونَ"},
      {n:59019,s:"الحشر",a:19,t:"وَلَا تَكُونُوا۟ كَٱلَّذِينَ نَسُوا۟ ٱللَّهَ فَأَنسَىٰهُمْ أَنفُسَهُمْ ۚ أُو۟لَٰٓئِكَ هُمُ ٱلْفَٰسِقُونَ"},
      {n:59020,s:"الحشر",a:20,t:"لَا يَسْتَوِىٓ أَصْحَٰبُ ٱلنَّارِ وَأَصْحَٰبُ ٱلْجَنَّةِ ۚ أَصْحَٰبُ ٱلْجَنَّةِ هُمُ ٱلْفَآئِزُونَ"},
      {n:59021,s:"الحشر",a:21,t:"لَوْ أَنزَلْنَا هَٰذَا ٱلْقُرْءَانَ عَلَىٰ جَبَلٍۢ لَّرَأَيْتَهُۥ خَٰشِعًۭا مُّتَصَدِّعًۭا مِّنْ خَشْيَةِ ٱللَّهِ ۚ وَتِلْكَ ٱلْأَمْثَٰلُ نَضْرِبُهَا لِلنَّاسِ لَعَلَّهُمْ يَتَفَكَّرُونَ"},
      {n:59022,s:"الحشر",a:22,t:"هُوَ ٱللَّهُ ٱلَّذِى لَآ إِلَٰهَ إِلَّا هُوَ ۖ عَٰلِمُ ٱلْغَيْبِ وَٱلشَّهَٰدَةِ ۖ هُوَ ٱلرَّحْمَٰنُ ٱلرَّحِيمُ"},
      {n:59023,s:"الحشر",a:23,t:"هُوَ ٱللَّهُ ٱلَّذِى لَآ إِلَٰهَ إِلَّا هُوَ ٱلْمَلِكُ ٱلْقُدُّوسُ ٱلسَّلَٰمُ ٱلْمُؤْمِنُ ٱلْمُهَيْمِنُ ٱلْعَزِيزُ ٱلْجَبَّارُ ٱلْمُتَكَبِّرُ ۚ سُبْحَٰنَ ٱللَّهِ عَمَّا يُشْرِكُونَ"},
      {n:59024,s:"الحشر",a:24,t:"هُوَ ٱللَّهُ ٱلْخَٰلِقُ ٱلْبَارِئُ ٱلْمُصَوِّرُ ۖ لَهُ ٱلْأَسْمَآءُ ٱلْحُسْنَىٰ ۚ يُسَبِّحُ لَهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۖ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ"},
      {n:60001,s:"الممتحنة",a:1,t:"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَتَّخِذُوا۟ عَدُوِّى وَعَدُوَّكُمْ أَوْلِيَآءَ تُلْقُونَ إِلَيْهِم بِٱلْمَوَدَّةِ وَقَدْ كَفَرُوا۟ بِمَا جَآءَكُم مِّنَ ٱلْحَقِّ يُخْرِجُونَ ٱلرَّسُولَ وَإِيَّاكُمْ ۙ أَن تُؤْمِنُوا۟ بِٱللَّهِ رَبِّكُمْ إِن كُنتُمْ خَرَجْتُمْ جِهَٰدًۭا فِى سَبِيلِى وَٱبْتِغَآءَ مَرْضَاتِى ۚ تُسِرُّونَ إِلَيْهِم بِٱلْمَوَدَّةِ وَأَنَا۠ أَعْلَمُ بِمَآ أَخْفَيْتُمْ وَمَآ أَعْلَنتُمْ ۚ وَمَن يَفْعَلْهُ مِنكُمْ فَقَدْ ضَلَّ سَوَآءَ ٱلسَّبِيلِ"},
      {n:60002,s:"الممتحنة",a:2,t:"إِن يَثْقَفُوكُمْ يَكُونُوا۟ لَكُمْ أَعْدَآءًۭ وَيَبْسُطُوٓا۟ إِلَيْكُمْ أَيْدِيَهُمْ وَأَلْسِنَتَهُم بِٱلسُّوٓءِ وَوَدُّوا۟ لَوْ تَكْفُرُونَ"},
      {n:60003,s:"الممتحنة",a:3,t:"لَن تَنفَعَكُمْ أَرْحَامُكُمْ وَلَآ أَوْلَٰدُكُمْ ۚ يَوْمَ ٱلْقِيَٰمَةِ يَفْصِلُ بَيْنَكُمْ ۚ وَٱللَّهُ بِمَا تَعْمَلُونَ بَصِيرٌۭ"},
      {n:60004,s:"الممتحنة",a:4,t:"قَدْ كَانَتْ لَكُمْ أُسْوَةٌ حَسَنَةٌۭ فِىٓ إِبْرَٰهِيمَ وَٱلَّذِينَ مَعَهُۥٓ إِذْ قَالُوا۟ لِقَوْمِهِمْ إِنَّا بُرَءَٰٓؤُا۟ مِنكُمْ وَمِمَّا تَعْبُدُونَ مِن دُونِ ٱللَّهِ كَفَرْنَا بِكُمْ وَبَدَا بَيْنَنَا وَبَيْنَكُمُ ٱلْعَدَٰوَةُ وَٱلْبَغْضَآءُ أَبَدًا حَتَّىٰ تُؤْمِنُوا۟ بِٱللَّهِ وَحْدَهُۥٓ إِلَّا قَوْلَ إِبْرَٰهِيمَ لِأَبِيهِ لَأَسْتَغْفِرَنَّ لَكَ وَمَآ أَمْلِكُ لَكَ مِنَ ٱللَّهِ مِن شَىْءٍۢ ۖ رَّبَّنَا عَلَيْكَ تَوَكَّلْنَا وَإِلَيْكَ أَنَبْنَا وَإِلَيْكَ ٱلْمَصِيرُ"},
      {n:60005,s:"الممتحنة",a:5,t:"رَبَّنَا لَا تَجْعَلْنَا فِتْنَةًۭ لِّلَّذِينَ كَفَرُوا۟ وَٱغْفِرْ لَنَا رَبَّنَآ ۖ إِنَّكَ أَنتَ ٱلْعَزِيزُ ٱلْحَكِيمُ"},
      {n:60006,s:"الممتحنة",a:6,t:"لَقَدْ كَانَ لَكُمْ فِيهِمْ أُسْوَةٌ حَسَنَةٌۭ لِّمَن كَانَ يَرْجُوا۟ ٱللَّهَ وَٱلْيَوْمَ ٱلْءَاخِرَ ۚ وَمَن يَتَوَلَّ فَإِنَّ ٱللَّهَ هُوَ ٱلْغَنِىُّ ٱلْحَمِيدُ"},
      {n:60007,s:"الممتحنة",a:7,t:"۞ عَسَى ٱللَّهُ أَن يَجْعَلَ بَيْنَكُمْ وَبَيْنَ ٱلَّذِينَ عَادَيْتُم مِّنْهُم مَّوَدَّةًۭ ۚ وَٱللَّهُ قَدِيرٌۭ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ"},
      {n:60008,s:"الممتحنة",a:8,t:"لَّا يَنْهَىٰكُمُ ٱللَّهُ عَنِ ٱلَّذِينَ لَمْ يُقَٰتِلُوكُمْ فِى ٱلدِّينِ وَلَمْ يُخْرِجُوكُم مِّن دِيَٰرِكُمْ أَن تَبَرُّوهُمْ وَتُقْسِطُوٓا۟ إِلَيْهِمْ ۚ إِنَّ ٱللَّهَ يُحِبُّ ٱلْمُقْسِطِينَ"},
      {n:60009,s:"الممتحنة",a:9,t:"إِنَّمَا يَنْهَىٰكُمُ ٱللَّهُ عَنِ ٱلَّذِينَ قَٰتَلُوكُمْ فِى ٱلدِّينِ وَأَخْرَجُوكُم مِّن دِيَٰرِكُمْ وَظَٰهَرُوا۟ عَلَىٰٓ إِخْرَاجِكُمْ أَن تَوَلَّوْهُمْ ۚ وَمَن يَتَوَلَّهُمْ فَأُو۟لَٰٓئِكَ هُمُ ٱلظَّٰلِمُونَ"},
      {n:60010,s:"الممتحنة",a:10,t:"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا جَآءَكُمُ ٱلْمُؤْمِنَٰتُ مُهَٰجِرَٰتٍۢ فَٱمْتَحِنُوهُنَّ ۖ ٱللَّهُ أَعْلَمُ بِإِيمَٰنِهِنَّ ۖ فَإِنْ عَلِمْتُمُوهُنَّ مُؤْمِنَٰتٍۢ فَلَا تَرْجِعُوهُنَّ إِلَى ٱلْكُفَّارِ ۖ لَا هُنَّ حِلٌّۭ لَّهُمْ وَلَا هُمْ يَحِلُّونَ لَهُنَّ ۖ وَءَاتُوهُم مَّآ أَنفَقُوا۟ ۚ وَلَا جُنَاحَ عَلَيْكُمْ أَن تَنكِحُوهُنَّ إِذَآ ءَاتَيْتُمُوهُنَّ أُجُورَهُنَّ ۚ وَلَا تُمْسِكُوا۟ بِعِصَمِ ٱلْكَوَافِرِ وَسْـَٔلُوا۟ مَآ أَنفَقْتُمْ وَلْيَسْـَٔلُوا۟ مَآ أَنفَقُوا۟ ۚ ذَٰلِكُمْ حُكْمُ ٱللَّهِ ۖ يَحْكُمُ بَيْنَكُمْ ۚ وَٱللَّهُ عَلِيمٌ حَكِيمٌۭ"},
      {n:60011,s:"الممتحنة",a:11,t:"وَإِن فَاتَكُمْ شَىْءٌۭ مِّنْ أَزْوَٰجِكُمْ إِلَى ٱلْكُفَّارِ فَعَاقَبْتُمْ فَـَٔاتُوا۟ ٱلَّذِينَ ذَهَبَتْ أَزْوَٰجُهُم مِّثْلَ مَآ أَنفَقُوا۟ ۚ وَٱتَّقُوا۟ ٱللَّهَ ٱلَّذِىٓ أَنتُم بِهِۦ مُؤْمِنُونَ"},
      {n:60012,s:"الممتحنة",a:12,t:"يَٰٓأَيُّهَا ٱلنَّبِىُّ إِذَا جَآءَكَ ٱلْمُؤْمِنَٰتُ يُبَايِعْنَكَ عَلَىٰٓ أَن لَّا يُشْرِكْنَ بِٱللَّهِ شَيْـًۭٔا وَلَا يَسْرِقْنَ وَلَا يَزْنِينَ وَلَا يَقْتُلْنَ أَوْلَٰدَهُنَّ وَلَا يَأْتِينَ بِبُهْتَٰنٍۢ يَفْتَرِينَهُۥ بَيْنَ أَيْدِيهِنَّ وَأَرْجُلِهِنَّ وَلَا يَعْصِينَكَ فِى مَعْرُوفٍۢ ۙ فَبَايِعْهُنَّ وَٱسْتَغْفِرْ لَهُنَّ ٱللَّهَ ۖ إِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۭ"},
      {n:60013,s:"الممتحنة",a:13,t:"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَتَوَلَّوْا۟ قَوْمًا غَضِبَ ٱللَّهُ عَلَيْهِمْ قَدْ يَئِسُوا۟ مِنَ ٱلْءَاخِرَةِ كَمَا يَئِسَ ٱلْكُفَّارُ مِنْ أَصْحَٰبِ ٱلْقُبُورِ"},
      {n:61001,s:"الصف",a:1,t:"سَبَّحَ لِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۖ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ"},
      {n:61002,s:"الصف",a:2,t:"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لِمَ تَقُولُونَ مَا لَا تَفْعَلُونَ"},
      {n:61003,s:"الصف",a:3,t:"كَبُرَ مَقْتًا عِندَ ٱللَّهِ أَن تَقُولُوا۟ مَا لَا تَفْعَلُونَ"},
      {n:61004,s:"الصف",a:4,t:"إِنَّ ٱللَّهَ يُحِبُّ ٱلَّذِينَ يُقَٰتِلُونَ فِى سَبِيلِهِۦ صَفًّۭا كَأَنَّهُم بُنْيَٰنٌۭ مَّرْصُوصٌۭ"},
      {n:61005,s:"الصف",a:5,t:"وَإِذْ قَالَ مُوسَىٰ لِقَوْمِهِۦ يَٰقَوْمِ لِمَ تُؤْذُونَنِى وَقَد تَّعْلَمُونَ أَنِّى رَسُولُ ٱللَّهِ إِلَيْكُمْ ۖ فَلَمَّا زَاغُوٓا۟ أَزَاغَ ٱللَّهُ قُلُوبَهُمْ ۚ وَٱللَّهُ لَا يَهْدِى ٱلْقَوْمَ ٱلْفَٰسِقِينَ"},
      {n:61006,s:"الصف",a:6,t:"وَإِذْ قَالَ عِيسَى ٱبْنُ مَرْيَمَ يَٰبَنِىٓ إِسْرَٰٓءِيلَ إِنِّى رَسُولُ ٱللَّهِ إِلَيْكُم مُّصَدِّقًۭا لِّمَا بَيْنَ يَدَىَّ مِنَ ٱلتَّوْرَىٰةِ وَمُبَشِّرًۢا بِرَسُولٍۢ يَأْتِى مِنۢ بَعْدِى ٱسْمُهُۥٓ أَحْمَدُ ۖ فَلَمَّا جَآءَهُم بِٱلْبَيِّنَٰتِ قَالُوا۟ هَٰذَا سِحْرٌۭ مُّبِينٌۭ"},
      {n:61007,s:"الصف",a:7,t:"وَمَنْ أَظْلَمُ مِمَّنِ ٱفْتَرَىٰ عَلَى ٱللَّهِ ٱلْكَذِبَ وَهُوَ يُدْعَىٰٓ إِلَى ٱلْإِسْلَٰمِ ۚ وَٱللَّهُ لَا يَهْدِى ٱلْقَوْمَ ٱلظَّٰلِمِينَ"},
      {n:61008,s:"الصف",a:8,t:"يُرِيدُونَ لِيُطْفِـُٔوا۟ نُورَ ٱللَّهِ بِأَفْوَٰهِهِمْ وَٱللَّهُ مُتِمُّ نُورِهِۦ وَلَوْ كَرِهَ ٱلْكَٰفِرُونَ"},
      {n:61009,s:"الصف",a:9,t:"هُوَ ٱلَّذِىٓ أَرْسَلَ رَسُولَهُۥ بِٱلْهُدَىٰ وَدِينِ ٱلْحَقِّ لِيُظْهِرَهُۥ عَلَى ٱلدِّينِ كُلِّهِۦ وَلَوْ كَرِهَ ٱلْمُشْرِكُونَ"},
      {n:61010,s:"الصف",a:10,t:"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ هَلْ أَدُلُّكُمْ عَلَىٰ تِجَٰرَةٍۢ تُنجِيكُم مِّنْ عَذَابٍ أَلِيمٍۢ"},
      {n:61011,s:"الصف",a:11,t:"تُؤْمِنُونَ بِٱللَّهِ وَرَسُولِهِۦ وَتُجَٰهِدُونَ فِى سَبِيلِ ٱللَّهِ بِأَمْوَٰلِكُمْ وَأَنفُسِكُمْ ۚ ذَٰلِكُمْ خَيْرٌۭ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ"},
      {n:61012,s:"الصف",a:12,t:"يَغْفِرْ لَكُمْ ذُنُوبَكُمْ وَيُدْخِلْكُمْ جَنَّٰتٍۢ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ وَمَسَٰكِنَ طَيِّبَةًۭ فِى جَنَّٰتِ عَدْنٍۢ ۚ ذَٰلِكَ ٱلْفَوْزُ ٱلْعَظِيمُ"},
      {n:61013,s:"الصف",a:13,t:"وَأُخْرَىٰ تُحِبُّونَهَا ۖ نَصْرٌۭ مِّنَ ٱللَّهِ وَفَتْحٌۭ قَرِيبٌۭ ۗ وَبَشِّرِ ٱلْمُؤْمِنِينَ"},
      {n:61014,s:"الصف",a:14,t:"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُونُوٓا۟ أَنصَارَ ٱللَّهِ كَمَا قَالَ عِيسَى ٱبْنُ مَرْيَمَ لِلْحَوَارِيِّۦنَ مَنْ أَنصَارِىٓ إِلَى ٱللَّهِ ۖ قَالَ ٱلْحَوَارِيُّونَ نَحْنُ أَنصَارُ ٱللَّهِ ۖ فَـَٔامَنَت طَّآئِفَةٌۭ مِّنۢ بَنِىٓ إِسْرَٰٓءِيلَ وَكَفَرَت طَّآئِفَةٌۭ ۖ فَأَيَّدْنَا ٱلَّذِينَ ءَامَنُوا۟ عَلَىٰ عَدُوِّهِمْ فَأَصْبَحُوا۟ ظَٰهِرِينَ"},
      {n:62001,s:"الجمعة",a:1,t:"يُسَبِّحُ لِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ٱلْمَلِكِ ٱلْقُدُّوسِ ٱلْعَزِيزِ ٱلْحَكِيمِ"},
      {n:62002,s:"الجمعة",a:2,t:"هُوَ ٱلَّذِى بَعَثَ فِى ٱلْأُمِّيِّۦنَ رَسُولًۭا مِّنْهُمْ يَتْلُوا۟ عَلَيْهِمْ ءَايَٰتِهِۦ وَيُزَكِّيهِمْ وَيُعَلِّمُهُمُ ٱلْكِتَٰبَ وَٱلْحِكْمَةَ وَإِن كَانُوا۟ مِن قَبْلُ لَفِى ضَلَٰلٍۢ مُّبِينٍۢ"},
      {n:62003,s:"الجمعة",a:3,t:"وَءَاخَرِينَ مِنْهُمْ لَمَّا يَلْحَقُوا۟ بِهِمْ ۚ وَهُوَ ٱلْعَزِيزُ ٱلْحَكِيمُ"},
      {n:62004,s:"الجمعة",a:4,t:"ذَٰلِكَ فَضْلُ ٱللَّهِ يُؤْتِيهِ مَن يَشَآءُ ۚ وَٱللَّهُ ذُو ٱلْفَضْلِ ٱلْعَظِيمِ"},
      {n:62005,s:"الجمعة",a:5,t:"مَثَلُ ٱلَّذِينَ حُمِّلُوا۟ ٱلتَّوْرَىٰةَ ثُمَّ لَمْ يَحْمِلُوهَا كَمَثَلِ ٱلْحِمَارِ يَحْمِلُ أَسْفَارًۢا ۚ بِئْسَ مَثَلُ ٱلْقَوْمِ ٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَٰتِ ٱللَّهِ ۚ وَٱللَّهُ لَا يَهْدِى ٱلْقَوْمَ ٱلظَّٰلِمِينَ"},
      {n:62006,s:"الجمعة",a:6,t:"قُلْ يَٰٓأَيُّهَا ٱلَّذِينَ هَادُوٓا۟ إِن زَعَمْتُمْ أَنَّكُمْ أَوْلِيَآءُ لِلَّهِ مِن دُونِ ٱلنَّاسِ فَتَمَنَّوُا۟ ٱلْمَوْتَ إِن كُنتُمْ صَٰدِقِينَ"},
      {n:62007,s:"الجمعة",a:7,t:"وَلَا يَتَمَنَّوْنَهُۥٓ أَبَدًۢا بِمَا قَدَّمَتْ أَيْدِيهِمْ ۚ وَٱللَّهُ عَلِيمٌۢ بِٱلظَّٰلِمِينَ"},
      {n:62008,s:"الجمعة",a:8,t:"قُلْ إِنَّ ٱلْمَوْتَ ٱلَّذِى تَفِرُّونَ مِنْهُ فَإِنَّهُۥ مُلَٰقِيكُمْ ۖ ثُمَّ تُرَدُّونَ إِلَىٰ عَٰلِمِ ٱلْغَيْبِ وَٱلشَّهَٰدَةِ فَيُنَبِّئُكُم بِمَا كُنتُمْ تَعْمَلُونَ"},
      {n:62009,s:"الجمعة",a:9,t:"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِذَا نُودِىَ لِلصَّلَوٰةِ مِن يَوْمِ ٱلْجُمُعَةِ فَٱسْعَوْا۟ إِلَىٰ ذِكْرِ ٱللَّهِ وَذَرُوا۟ ٱلْبَيْعَ ۚ ذَٰلِكُمْ خَيْرٌۭ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ"},
      {n:62010,s:"الجمعة",a:10,t:"فَإِذَا قُضِيَتِ ٱلصَّلَوٰةُ فَٱنتَشِرُوا۟ فِى ٱلْأَرْضِ وَٱبْتَغُوا۟ مِن فَضْلِ ٱللَّهِ وَٱذْكُرُوا۟ ٱللَّهَ كَثِيرًۭا لَّعَلَّكُمْ تُفْلِحُونَ"},
      {n:62011,s:"الجمعة",a:11,t:"وَإِذَا رَأَوْا۟ تِجَٰرَةً أَوْ لَهْوًا ٱنفَضُّوٓا۟ إِلَيْهَا وَتَرَكُوكَ قَآئِمًۭا ۚ قُلْ مَا عِندَ ٱللَّهِ خَيْرٌۭ مِّنَ ٱللَّهْوِ وَمِنَ ٱلتِّجَٰرَةِ ۚ وَٱللَّهُ خَيْرُ ٱلرَّٰزِقِينَ"},
      {n:63001,s:"المنافقون",a:1,t:"إِذَا جَآءَكَ ٱلْمُنَٰفِقُونَ قَالُوا۟ نَشْهَدُ إِنَّكَ لَرَسُولُ ٱللَّهِ ۗ وَٱللَّهُ يَعْلَمُ إِنَّكَ لَرَسُولُهُۥ وَٱللَّهُ يَشْهَدُ إِنَّ ٱلْمُنَٰفِقِينَ لَكَٰذِبُونَ"},
      {n:63002,s:"المنافقون",a:2,t:"ٱتَّخَذُوٓا۟ أَيْمَٰنَهُمْ جُنَّةًۭ فَصَدُّوا۟ عَن سَبِيلِ ٱللَّهِ ۚ إِنَّهُمْ سَآءَ مَا كَانُوا۟ يَعْمَلُونَ"},
      {n:63003,s:"المنافقون",a:3,t:"ذَٰلِكَ بِأَنَّهُمْ ءَامَنُوا۟ ثُمَّ كَفَرُوا۟ فَطُبِعَ عَلَىٰ قُلُوبِهِمْ فَهُمْ لَا يَفْقَهُونَ"},
      {n:63004,s:"المنافقون",a:4,t:"۞ وَإِذَا رَأَيْتَهُمْ تُعْجِبُكَ أَجْسَامُهُمْ ۖ وَإِن يَقُولُوا۟ تَسْمَعْ لِقَوْلِهِمْ ۖ كَأَنَّهُمْ خُشُبٌۭ مُّسَنَّدَةٌۭ ۖ يَحْسَبُونَ كُلَّ صَيْحَةٍ عَلَيْهِمْ ۚ هُمُ ٱلْعَدُوُّ فَٱحْذَرْهُمْ ۚ قَٰتَلَهُمُ ٱللَّهُ ۖ أَنَّىٰ يُؤْفَكُونَ"},
      {n:63005,s:"المنافقون",a:5,t:"وَإِذَا قِيلَ لَهُمْ تَعَالَوْا۟ يَسْتَغْفِرْ لَكُمْ رَسُولُ ٱللَّهِ لَوَّوْا۟ رُءُوسَهُمْ وَرَأَيْتَهُمْ يَصُدُّونَ وَهُم مُّسْتَكْبِرُونَ"},
      {n:63006,s:"المنافقون",a:6,t:"سَوَآءٌ عَلَيْهِمْ أَسْتَغْفَرْتَ لَهُمْ أَمْ لَمْ تَسْتَغْفِرْ لَهُمْ لَن يَغْفِرَ ٱللَّهُ لَهُمْ ۚ إِنَّ ٱللَّهَ لَا يَهْدِى ٱلْقَوْمَ ٱلْفَٰسِقِينَ"},
      {n:63007,s:"المنافقون",a:7,t:"هُمُ ٱلَّذِينَ يَقُولُونَ لَا تُنفِقُوا۟ عَلَىٰ مَنْ عِندَ رَسُولِ ٱللَّهِ حَتَّىٰ يَنفَضُّوا۟ ۗ وَلِلَّهِ خَزَآئِنُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَلَٰكِنَّ ٱلْمُنَٰفِقِينَ لَا يَفْقَهُونَ"},
      {n:63008,s:"المنافقون",a:8,t:"يَقُولُونَ لَئِن رَّجَعْنَآ إِلَى ٱلْمَدِينَةِ لَيُخْرِجَنَّ ٱلْأَعَزُّ مِنْهَا ٱلْأَذَلَّ ۚ وَلِلَّهِ ٱلْعِزَّةُ وَلِرَسُولِهِۦ وَلِلْمُؤْمِنِينَ وَلَٰكِنَّ ٱلْمُنَٰفِقِينَ لَا يَعْلَمُونَ"},
      {n:63009,s:"المنافقون",a:9,t:"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تُلْهِكُمْ أَمْوَٰلُكُمْ وَلَآ أَوْلَٰدُكُمْ عَن ذِكْرِ ٱللَّهِ ۚ وَمَن يَفْعَلْ ذَٰلِكَ فَأُو۟لَٰٓئِكَ هُمُ ٱلْخَٰسِرُونَ"},
      {n:63010,s:"المنافقون",a:10,t:"وَأَنفِقُوا۟ مِن مَّا رَزَقْنَٰكُم مِّن قَبْلِ أَن يَأْتِىَ أَحَدَكُمُ ٱلْمَوْتُ فَيَقُولَ رَبِّ لَوْلَآ أَخَّرْتَنِىٓ إِلَىٰٓ أَجَلٍۢ قَرِيبٍۢ فَأَصَّدَّقَ وَأَكُن مِّنَ ٱلصَّٰلِحِينَ"},
      {n:63011,s:"المنافقون",a:11,t:"وَلَن يُؤَخِّرَ ٱللَّهُ نَفْسًا إِذَا جَآءَ أَجَلُهَا ۚ وَٱللَّهُ خَبِيرٌۢ بِمَا تَعْمَلُونَ"},
      {n:64001,s:"التغابن",a:1,t:"يُسَبِّحُ لِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۖ لَهُ ٱلْمُلْكُ وَلَهُ ٱلْحَمْدُ ۖ وَهُوَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌ"},
      {n:64002,s:"التغابن",a:2,t:"هُوَ ٱلَّذِى خَلَقَكُمْ فَمِنكُمْ كَافِرٌۭ وَمِنكُم مُّؤْمِنٌۭ ۚ وَٱللَّهُ بِمَا تَعْمَلُونَ بَصِيرٌ"},
      {n:64003,s:"التغابن",a:3,t:"خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ بِٱلْحَقِّ وَصَوَّرَكُمْ فَأَحْسَنَ صُوَرَكُمْ ۖ وَإِلَيْهِ ٱلْمَصِيرُ"},
      {n:64004,s:"التغابن",a:4,t:"يَعْلَمُ مَا فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَيَعْلَمُ مَا تُسِرُّونَ وَمَا تُعْلِنُونَ ۚ وَٱللَّهُ عَلِيمٌۢ بِذَاتِ ٱلصُّدُورِ"},
      {n:64005,s:"التغابن",a:5,t:"أَلَمْ يَأْتِكُمْ نَبَؤُا۟ ٱلَّذِينَ كَفَرُوا۟ مِن قَبْلُ فَذَاقُوا۟ وَبَالَ أَمْرِهِمْ وَلَهُمْ عَذَابٌ أَلِيمٌۭ"},
      {n:64006,s:"التغابن",a:6,t:"ذَٰلِكَ بِأَنَّهُۥ كَانَت تَّأْتِيهِمْ رُسُلُهُم بِٱلْبَيِّنَٰتِ فَقَالُوٓا۟ أَبَشَرٌۭ يَهْدُونَنَا فَكَفَرُوا۟ وَتَوَلَّوا۟ ۚ وَّٱسْتَغْنَى ٱللَّهُ ۚ وَٱللَّهُ غَنِىٌّ حَمِيدٌۭ"},
      {n:64007,s:"التغابن",a:7,t:"زَعَمَ ٱلَّذِينَ كَفَرُوٓا۟ أَن لَّن يُبْعَثُوا۟ ۚ قُلْ بَلَىٰ وَرَبِّى لَتُبْعَثُنَّ ثُمَّ لَتُنَبَّؤُنَّ بِمَا عَمِلْتُمْ ۚ وَذَٰلِكَ عَلَى ٱللَّهِ يَسِيرٌۭ"},
      {n:64008,s:"التغابن",a:8,t:"فَـَٔامِنُوا۟ بِٱللَّهِ وَرَسُولِهِۦ وَٱلنُّورِ ٱلَّذِىٓ أَنزَلْنَا ۚ وَٱللَّهُ بِمَا تَعْمَلُونَ خَبِيرٌۭ"},
      {n:64009,s:"التغابن",a:9,t:"يَوْمَ يَجْمَعُكُمْ لِيَوْمِ ٱلْجَمْعِ ۖ ذَٰلِكَ يَوْمُ ٱلتَّغَابُنِ ۗ وَمَن يُؤْمِنۢ بِٱللَّهِ وَيَعْمَلْ صَٰلِحًۭا يُكَفِّرْ عَنْهُ سَيِّـَٔاتِهِۦ وَيُدْخِلْهُ جَنَّٰتٍۢ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ خَٰلِدِينَ فِيهَآ أَبَدًۭا ۚ ذَٰلِكَ ٱلْفَوْزُ ٱلْعَظِيمُ"},
      {n:64010,s:"التغابن",a:10,t:"وَٱلَّذِينَ كَفَرُوا۟ وَكَذَّبُوا۟ بِـَٔايَٰتِنَآ أُو۟لَٰٓئِكَ أَصْحَٰبُ ٱلنَّارِ خَٰلِدِينَ فِيهَا ۖ وَبِئْسَ ٱلْمَصِيرُ"},
      {n:64011,s:"التغابن",a:11,t:"مَآ أَصَابَ مِن مُّصِيبَةٍ إِلَّا بِإِذْنِ ٱللَّهِ ۗ وَمَن يُؤْمِنۢ بِٱللَّهِ يَهْدِ قَلْبَهُۥ ۚ وَٱللَّهُ بِكُلِّ شَىْءٍ عَلِيمٌۭ"},
      {n:64012,s:"التغابن",a:12,t:"وَأَطِيعُوا۟ ٱللَّهَ وَأَطِيعُوا۟ ٱلرَّسُولَ ۚ فَإِن تَوَلَّيْتُمْ فَإِنَّمَا عَلَىٰ رَسُولِنَا ٱلْبَلَٰغُ ٱلْمُبِينُ"},
      {n:64013,s:"التغابن",a:13,t:"ٱللَّهُ لَآ إِلَٰهَ إِلَّا هُوَ ۚ وَعَلَى ٱللَّهِ فَلْيَتَوَكَّلِ ٱلْمُؤْمِنُونَ"},
      {n:64014,s:"التغابن",a:14,t:"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ إِنَّ مِنْ أَزْوَٰجِكُمْ وَأَوْلَٰدِكُمْ عَدُوًّۭا لَّكُمْ فَٱحْذَرُوهُمْ ۚ وَإِن تَعْفُوا۟ وَتَصْفَحُوا۟ وَتَغْفِرُوا۟ فَإِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌ"},
      {n:64015,s:"التغابن",a:15,t:"إِنَّمَآ أَمْوَٰلُكُمْ وَأَوْلَٰدُكُمْ فِتْنَةٌۭ ۚ وَٱللَّهُ عِندَهُۥٓ أَجْرٌ عَظِيمٌۭ"},
      {n:64016,s:"التغابن",a:16,t:"فَٱتَّقُوا۟ ٱللَّهَ مَا ٱسْتَطَعْتُمْ وَٱسْمَعُوا۟ وَأَطِيعُوا۟ وَأَنفِقُوا۟ خَيْرًۭا لِّأَنفُسِكُمْ ۗ وَمَن يُوقَ شُحَّ نَفْسِهِۦ فَأُو۟لَٰٓئِكَ هُمُ ٱلْمُفْلِحُونَ"},
      {n:64017,s:"التغابن",a:17,t:"إِن تُقْرِضُوا۟ ٱللَّهَ قَرْضًا حَسَنًۭا يُضَٰعِفْهُ لَكُمْ وَيَغْفِرْ لَكُمْ ۚ وَٱللَّهُ شَكُورٌ حَلِيمٌ"},
      {n:64018,s:"التغابن",a:18,t:"عَٰلِمُ ٱلْغَيْبِ وَٱلشَّهَٰدَةِ ٱلْعَزِيزُ ٱلْحَكِيمُ"},
      {n:65001,s:"الطلاق",a:1,t:"يَٰٓأَيُّهَا ٱلنَّبِىُّ إِذَا طَلَّقْتُمُ ٱلنِّسَآءَ فَطَلِّقُوهُنَّ لِعِدَّتِهِنَّ وَأَحْصُوا۟ ٱلْعِدَّةَ ۖ وَٱتَّقُوا۟ ٱللَّهَ رَبَّكُمْ ۖ لَا تُخْرِجُوهُنَّ مِنۢ بُيُوتِهِنَّ وَلَا يَخْرُجْنَ إِلَّآ أَن يَأْتِينَ بِفَٰحِشَةٍۢ مُّبَيِّنَةٍۢ ۚ وَتِلْكَ حُدُودُ ٱللَّهِ ۚ وَمَن يَتَعَدَّ حُدُودَ ٱللَّهِ فَقَدْ ظَلَمَ نَفْسَهُۥ ۚ لَا تَدْرِى لَعَلَّ ٱللَّهَ يُحْدِثُ بَعْدَ ذَٰلِكَ أَمْرًۭا"},
      {n:65002,s:"الطلاق",a:2,t:"فَإِذَا بَلَغْنَ أَجَلَهُنَّ فَأَمْسِكُوهُنَّ بِمَعْرُوفٍ أَوْ فَارِقُوهُنَّ بِمَعْرُوفٍۢ وَأَشْهِدُوا۟ ذَوَىْ عَدْلٍۢ مِّنكُمْ وَأَقِيمُوا۟ ٱلشَّهَٰدَةَ لِلَّهِ ۚ ذَٰلِكُمْ يُوعَظُ بِهِۦ مَن كَانَ يُؤْمِنُ بِٱللَّهِ وَٱلْيَوْمِ ٱلْءَاخِرِ ۚ وَمَن يَتَّقِ ٱللَّهَ يَجْعَل لَّهُۥ مَخْرَجًۭا"},
      {n:65003,s:"الطلاق",a:3,t:"وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ ۚ وَمَن يَتَوَكَّلْ عَلَى ٱللَّهِ فَهُوَ حَسْبُهُۥٓ ۚ إِنَّ ٱللَّهَ بَٰلِغُ أَمْرِهِۦ ۚ قَدْ جَعَلَ ٱللَّهُ لِكُلِّ شَىْءٍۢ قَدْرًۭا"},
      {n:65004,s:"الطلاق",a:4,t:"وَٱلَّٰٓـِٔى يَئِسْنَ مِنَ ٱلْمَحِيضِ مِن نِّسَآئِكُمْ إِنِ ٱرْتَبْتُمْ فَعِدَّتُهُنَّ ثَلَٰثَةُ أَشْهُرٍۢ وَٱلَّٰٓـِٔى لَمْ يَحِضْنَ ۚ وَأُو۟لَٰتُ ٱلْأَحْمَالِ أَجَلُهُنَّ أَن يَضَعْنَ حَمْلَهُنَّ ۚ وَمَن يَتَّقِ ٱللَّهَ يَجْعَل لَّهُۥ مِنْ أَمْرِهِۦ يُسْرًۭا"},
      {n:65005,s:"الطلاق",a:5,t:"ذَٰلِكَ أَمْرُ ٱللَّهِ أَنزَلَهُۥٓ إِلَيْكُمْ ۚ وَمَن يَتَّقِ ٱللَّهَ يُكَفِّرْ عَنْهُ سَيِّـَٔاتِهِۦ وَيُعْظِمْ لَهُۥٓ أَجْرًا"},
      {n:65006,s:"الطلاق",a:6,t:"أَسْكِنُوهُنَّ مِنْ حَيْثُ سَكَنتُم مِّن وُجْدِكُمْ وَلَا تُضَآرُّوهُنَّ لِتُضَيِّقُوا۟ عَلَيْهِنَّ ۚ وَإِن كُنَّ أُو۟لَٰتِ حَمْلٍۢ فَأَنفِقُوا۟ عَلَيْهِنَّ حَتَّىٰ يَضَعْنَ حَمْلَهُنَّ ۚ فَإِنْ أَرْضَعْنَ لَكُمْ فَـَٔاتُوهُنَّ أُجُورَهُنَّ ۖ وَأْتَمِرُوا۟ بَيْنَكُم بِمَعْرُوفٍۢ ۖ وَإِن تَعَاسَرْتُمْ فَسَتُرْضِعُ لَهُۥٓ أُخْرَىٰ"},
      {n:65007,s:"الطلاق",a:7,t:"لِيُنفِقْ ذُو سَعَةٍۢ مِّن سَعَتِهِۦ ۖ وَمَن قُدِرَ عَلَيْهِ رِزْقُهُۥ فَلْيُنفِقْ مِمَّآ ءَاتَىٰهُ ٱللَّهُ ۚ لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا مَآ ءَاتَىٰهَا ۚ سَيَجْعَلُ ٱللَّهُ بَعْدَ عُسْرٍۢ يُسْرًۭا"},
      {n:65008,s:"الطلاق",a:8,t:"وَكَأَيِّن مِّن قَرْيَةٍ عَتَتْ عَنْ أَمْرِ رَبِّهَا وَرُسُلِهِۦ فَحَاسَبْنَٰهَا حِسَابًۭا شَدِيدًۭا وَعَذَّبْنَٰهَا عَذَابًۭا نُّكْرًۭا"},
      {n:65009,s:"الطلاق",a:9,t:"فَذَاقَتْ وَبَالَ أَمْرِهَا وَكَانَ عَٰقِبَةُ أَمْرِهَا خُسْرًا"},
      {n:65010,s:"الطلاق",a:10,t:"أَعَدَّ ٱللَّهُ لَهُمْ عَذَابًۭا شَدِيدًۭا ۖ فَٱتَّقُوا۟ ٱللَّهَ يَٰٓأُو۟لِى ٱلْأَلْبَٰبِ ٱلَّذِينَ ءَامَنُوا۟ ۚ قَدْ أَنزَلَ ٱللَّهُ إِلَيْكُمْ ذِكْرًۭا"},
      {n:65011,s:"الطلاق",a:11,t:"رَّسُولًۭا يَتْلُوا۟ عَلَيْكُمْ ءَايَٰتِ ٱللَّهِ مُبَيِّنَٰتٍۢ لِّيُخْرِجَ ٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ مِنَ ٱلظُّلُمَٰتِ إِلَى ٱلنُّورِ ۚ وَمَن يُؤْمِنۢ بِٱللَّهِ وَيَعْمَلْ صَٰلِحًۭا يُدْخِلْهُ جَنَّٰتٍۢ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ خَٰلِدِينَ فِيهَآ أَبَدًۭا ۖ قَدْ أَحْسَنَ ٱللَّهُ لَهُۥ رِزْقًا"},
      {n:65012,s:"الطلاق",a:12,t:"ٱللَّهُ ٱلَّذِى خَلَقَ سَبْعَ سَمَٰوَٰتٍۢ وَمِنَ ٱلْأَرْضِ مِثْلَهُنَّ يَتَنَزَّلُ ٱلْأَمْرُ بَيْنَهُنَّ لِتَعْلَمُوٓا۟ أَنَّ ٱللَّهَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ وَأَنَّ ٱللَّهَ قَدْ أَحَاطَ بِكُلِّ شَىْءٍ عِلْمًۢا"},
      {n:66001,s:"التحريم",a:1,t:"يَٰٓأَيُّهَا ٱلنَّبِىُّ لِمَ تُحَرِّمُ مَآ أَحَلَّ ٱللَّهُ لَكَ ۖ تَبْتَغِى مَرْضَاتَ أَزْوَٰجِكَ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ"},
      {n:66002,s:"التحريم",a:2,t:"قَدْ فَرَضَ ٱللَّهُ لَكُمْ تَحِلَّةَ أَيْمَٰنِكُمْ ۚ وَٱللَّهُ مَوْلَىٰكُمْ ۖ وَهُوَ ٱلْعَلِيمُ ٱلْحَكِيمُ"},
      {n:66003,s:"التحريم",a:3,t:"وَإِذْ أَسَرَّ ٱلنَّبِىُّ إِلَىٰ بَعْضِ أَزْوَٰجِهِۦ حَدِيثًۭا فَلَمَّا نَبَّأَتْ بِهِۦ وَأَظْهَرَهُ ٱللَّهُ عَلَيْهِ عَرَّفَ بَعْضَهُۥ وَأَعْرَضَ عَنۢ بَعْضٍۢ ۖ فَلَمَّا نَبَّأَهَا بِهِۦ قَالَتْ مَنْ أَنۢبَأَكَ هَٰذَا ۖ قَالَ نَبَّأَنِىَ ٱلْعَلِيمُ ٱلْخَبِيرُ"},
      {n:66004,s:"التحريم",a:4,t:"إِن تَتُوبَآ إِلَى ٱللَّهِ فَقَدْ صَغَتْ قُلُوبُكُمَا ۖ وَإِن تَظَٰهَرَا عَلَيْهِ فَإِنَّ ٱللَّهَ هُوَ مَوْلَىٰهُ وَجِبْرِيلُ وَصَٰلِحُ ٱلْمُؤْمِنِينَ ۖ وَٱلْمَلَٰٓئِكَةُ بَعْدَ ذَٰلِكَ ظَهِيرٌ"},
      {n:66005,s:"التحريم",a:5,t:"عَسَىٰ رَبُّهُۥٓ إِن طَلَّقَكُنَّ أَن يُبْدِلَهُۥٓ أَزْوَٰجًا خَيْرًۭا مِّنكُنَّ مُسْلِمَٰتٍۢ مُّؤْمِنَٰتٍۢ قَٰنِتَٰتٍۢ تَٰٓئِبَٰتٍ عَٰبِدَٰتٍۢ سَٰٓئِحَٰتٍۢ ثَيِّبَٰتٍۢ وَأَبْكَارًۭا"},
      {n:66006,s:"التحريم",a:6,t:"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ قُوٓا۟ أَنفُسَكُمْ وَأَهْلِيكُمْ نَارًۭا وَقُودُهَا ٱلنَّاسُ وَٱلْحِجَارَةُ عَلَيْهَا مَلَٰٓئِكَةٌ غِلَاظٌۭ شِدَادٌۭ لَّا يَعْصُونَ ٱللَّهَ مَآ أَمَرَهُمْ وَيَفْعَلُونَ مَا يُؤْمَرُونَ"},
      {n:66007,s:"التحريم",a:7,t:"يَٰٓأَيُّهَا ٱلَّذِينَ كَفَرُوا۟ لَا تَعْتَذِرُوا۟ ٱلْيَوْمَ ۖ إِنَّمَا تُجْزَوْنَ مَا كُنتُمْ تَعْمَلُونَ"},
      {n:66008,s:"التحريم",a:8,t:"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ تُوبُوٓا۟ إِلَى ٱللَّهِ تَوْبَةًۭ نَّصُوحًا عَسَىٰ رَبُّكُمْ أَن يُكَفِّرَ عَنكُمْ سَيِّـَٔاتِكُمْ وَيُدْخِلَكُمْ جَنَّٰتٍۢ تَجْرِى مِن تَحْتِهَا ٱلْأَنْهَٰرُ يَوْمَ لَا يُخْزِى ٱللَّهُ ٱلنَّبِىَّ وَٱلَّذِينَ ءَامَنُوا۟ مَعَهُۥ ۖ نُورُهُمْ يَسْعَىٰ بَيْنَ أَيْدِيهِمْ وَبِأَيْمَٰنِهِمْ يَقُولُونَ رَبَّنَآ أَتْمِمْ لَنَا نُورَنَا وَٱغْفِرْ لَنَآ ۖ إِنَّكَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ"},
      {n:66009,s:"التحريم",a:9,t:"يَٰٓأَيُّهَا ٱلنَّبِىُّ جَٰهِدِ ٱلْكُفَّارَ وَٱلْمُنَٰفِقِينَ وَٱغْلُظْ عَلَيْهِمْ ۚ وَمَأْوَىٰهُمْ جَهَنَّمُ ۖ وَبِئْسَ ٱلْمَصِيرُ"},
      {n:66010,s:"التحريم",a:10,t:"ضَرَبَ ٱللَّهُ مَثَلًۭا لِّلَّذِينَ كَفَرُوا۟ ٱمْرَأَتَ نُوحٍۢ وَٱمْرَأَتَ لُوطٍۢ ۖ كَانَتَا تَحْتَ عَبْدَيْنِ مِنْ عِبَادِنَا صَٰلِحَيْنِ فَخَانَتَاهُمَا فَلَمْ يُغْنِيَا عَنْهُمَا مِنَ ٱللَّهِ شَيْـًۭٔا وَقِيلَ ٱدْخُلَا ٱلنَّارَ مَعَ ٱلدَّٰخِلِينَ"},
